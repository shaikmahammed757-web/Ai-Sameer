<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SK MD Bike Puzzle & Earn</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0f172a;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
        }
        header {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            padding: 16px;
            font-size: 20px;
            font-weight: bold;
            color: #000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .container {
            padding: 12px;
            max-width: 400px;
            margin: auto;
        }
        .wallet-box {
            background: #1e293b;
            border: 2px solid #f59e0b;
            padding: 10px;
            margin: 10px 0;
            border-radius: 10px;
        }
        .balance-text {
            color: #4ade80;
            font-weight: bold;
            font-size: 18px;
        }
        .game-screen {
            background: #1e293b;
            border: 3px solid #3b82f6;
            border-radius: 12px;
            padding: 12px;
            margin-top: 10px;
        }
        .puzzle-board {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin: 15px 0;
        }
        .slot, .piece {
            height: 90px;
            background: #334155;
            border: 2px dashed #94a3b8;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            cursor: pointer;
        }
        .piece {
            border: 2px solid #f59e0b;
            background: #475569;
        }
        .action-btn {
            background: #22c55e;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <header>SK MD Bike Puzzle & Earn</header>

    <div class="container">
        <div class="wallet-box">
            <p style="margin:4px 0;">Wallet Balance: <span class="balance-text" id="balance">₹0</span></p>
            <p style="margin:4px 0; font-size: 12px; color: #94a3b8;">Min. Withdrawal Limit: <b>₹1000</b></p>
        </div>

        <div class="game-screen">
            <h3 style="margin:5px 0;">Bike Mechanic Jigsaw</h3>
            <p style="font-size: 12px; color: #cbd5e1; margin-bottom: 10px;">Tap pieces to place them into the correct puzzle slots!</p>
            
            <div style="font-size:13px; color:#f59e0b; margin-bottom:5px;">Puzzle Slots (Target)</div>
            <div class="puzzle-board">
                <div class="slot" id="slot0" onclick="placePiece(0)">🛞</div>
                <div class="slot" id="slot1" onclick="placePiece(1)">⚙️</div>
                <div class="slot" id="slot2" onclick="placePiece(2)">⛽</div>
                <div class="slot" id="slot3" onclick="placePiece(3)">⛓️</div>
            </div>

            <div style="font-size:13px; color:#38bdf8; margin-bottom:5px;">Available Bike Parts</div>
            <div class="puzzle-board" id="piecesContainer">
                <!-- Pieces -->
            </div>

            <button class="action-btn" onclick="verifyPuzzle()">Check & Earn ₹50</button>
        </div>
    </div>

    <script>
        let balance = 0;
        let selectedPiece = null;
        
        function initGame() {
            document.getElementById("balance").innerText = "₹" + balance;
            const container = document.getElementById("piecesContainer");
            container.innerHTML = "";
            
            let parts = ['⛓️', '🛞', '⛽', '⚙️'].sort(() => Math.random() - 0.5);
            parts.forEach(part => {
                let div = document.createElement("div");
                div.className = "piece";
                div.innerText = part;
                div.onclick = function() {
                    selectedPiece = part;
                    alert("Selected part: " + part + ". Now tap any empty slot above!");
                };
                container.appendChild(div);
            });
        }

        function placePiece(slotIndex) {
            if(selectedPiece) {
                document.getElementById("slot" + slotIndex).innerText = selectedPiece;
                selectedPiece = null;
            } else {
                alert("Please select a bike part from below first!");
            }
        }

        function verifyPuzzle() {
            balance += 50;
            if(balance >= 1000) {
                alert("🎉 Congratulations! You reached ₹1000 withdrawal limit.");
            } else {
                alert("✨ Puzzle Solved! ₹50 added to your wallet.");
            }
            initGame();
        }

        initGame();
    </script>
</body>
</html>
