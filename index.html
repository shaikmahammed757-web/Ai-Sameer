<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ai Sameer</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #0b0f19; color: #ffffff; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        .chat-container { display: flex; flex-direction: column; height: 100%; max-width: 800px; margin: 0 auto; width: 100%; position: relative; }
        
        /* Header */
        .chat-header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: #0b0f19; }
        .header-left { display: flex; align-items: center; gap: 15px; }
        .model-select { background: none; border: none; color: #fff; font-size: 1.1rem; font-weight: bold; display: flex; align-items: center; gap: 5px; cursor: pointer; }
        .icon-btn { background: none; border: none; color: #fff; font-size: 1.3rem; cursor: pointer; }
        
        /* Sidebar */
        .sidebar { position: fixed; top: 0; left: -280px; width: 280px; height: 100%; background: #171c28; transition: 0.3s ease; z-index: 1000; display: flex; flex-direction: column; padding: 20px; box-shadow: 2px 0 10px rgba(0,0,0,0.5); }
        .sidebar.open { left: 0; }
        .sidebar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .sidebar-item { padding: 12px 15px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 12px; font-size: 0.95rem; color: #e0e0e0; margin-bottom: 5px; background: #212635; }
        .sidebar-item:hover { background: #2c344a; }

        /* Main Center Area */
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .welcome-box { display: flex; flex-direction: column; align-items: center; gap: 15px; }
        .sparkle-icon { font-size: 2.5rem; background: linear-gradient(45deg, #4285f4, #ea4335, #fbbc05, #34a853); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .welcome-title { font-size: 1.8rem; font-weight: 500; color: #e2e8f0; }

        /* Bottom Input Area */
        .chat-input-area { padding: 15px 20px; background: #0b0f19; display: flex; flex-direction: column; gap: 10px; }
        .action-chips { display: flex; gap: 10px; justify-content: center; margin-bottom: 5px; }
        .chip { background: #1e2330; border: 1px solid #2d3748; padding: 10px 18px; border-radius: 20px; color: #fff; font-size: 0.9rem; display: flex; align-items: center; gap: 8px; cursor: pointer; }
        
        .input-box-wrapper { display: flex; background: #171c28; border-radius: 30px; padding: 10px 20px; align-items: center; border: 1px solid #2d3748; }
        .input-box-wrapper input { flex: 1; background: none; border: none; color: #fff; outline: none; font-size: 1rem; }
        
        /* Message Bubbles */
        .message { padding: 12px 18px; border-radius: 12px; max-width: 85%; align-self: flex-start; margin-bottom: 10px; text-align: left; line-height: 1.5; }
        .user-message { background: #212635; align-self: flex-end; }
        .ai-message { background: #171c28; border: 1px solid #2d3748; }
    </style>
</head>
<body>
    <div class="chat-container">
        <!-- Header -->
        <header class="chat-header">
            <div class="header-left">
                <button id="sidebar-toggle" class="icon-btn">☰</button>
                <button class="model-select">Gemini Auto <span>▼</span></button>
            </div>
            <button id="new-chat-btn" class="icon-btn">✏️</button>
        </header>

        <!-- Sidebar Menu -->
        <div id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <h3>Gemini</h3>
                <button id="sidebar-close" class="icon-btn">✕</button>
            </div>
            <div class="sidebar-item" onclick="newChat()">✏️ New chat</div>
            <div class="sidebar-item">🔍 Search chats</div>
            <div class="sidebar-item">🖼️ Images</div>
            <div class="sidebar-item">📚 Library</div>
            <hr style="border: 0.5px solid #2d3748; margin: 15px 0;">
            <div class="sidebar-item">⚙️ Settings</div>
        </div>

        <!-- Chat Area / Welcome Screen -->
        <div id="chat-messages" class="chat-messages">
            <div class="welcome-box">
                <div class="sparkle-icon">✦</div>
                <div class="welcome-title">What should we focus on?</div>
            </div>
        </div>

        <!-- Bottom Input & Quick Chips -->
        <div class="chat-input-area">
            <div class="action-chips">
                <div class="chip">📷 Photos</div>
                <div class="chip">📸 Camera</div>
                <div class="chip">😊 Avatar</div>
            </div>
            <div class="input-box-wrapper">
                <button id="add-btn" class="icon-btn" style="margin-right: 10px;">＋</button>
                <input type="text" id="user-input" placeholder="Ask Gemini">
                <button id="mic-btn" class="icon-btn" style="margin-right: 10px;">🎙️</button>
                <button id="send-btn" class="icon-btn">⬆️</button>
            </div>
        </div>
    </div>

    <script>
        const WORKER_URL = "https://ai-sameer-api.shaikmahammed757.workers.dev";

        // Sidebar Toggle
        const sidebar = document.getElementById("sidebar");
        document.getElementById("sidebar-toggle").addEventListener("click", () => sidebar.classList.add("open"));
        document.getElementById("sidebar-close").addEventListener("click", () => sidebar.classList.remove("open"));

        function newChat() {
            document.getElementById("chat-messages").innerHTML = `
                <div class="welcome-box">
                    <div class="sparkle-icon">✦</div>
                    <div class="welcome-title">What should we focus on?</div>
                </div>
            `;
            sidebar.classList.remove("open");
        }

        document.getElementById("new-chat-btn").addEventListener("click", newChat);

        async function sendToAI(promptText) {
            const chatMessages = document.getElementById("chat-messages");
            if(chatMessages.querySelector('.welcome-box')) {
                chatMessages.innerHTML = "";
            }

            appendMessage("You", promptText);
            try {
                const response = await fetch(WORKER_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ prompt: promptText })
                });
                const data = await response.json();
                const aiReply = data.reply || "సమాధానం అందుకోవడంలో సమస్య ఏర్పడింది.";
                appendAIMessage(aiReply);
            } catch (error) {
                appendAIMessage("నెట్‌వర్క్ సమస్య కారణంగా కనెక్షన్ కాలేదు.");
            }
        }

        function appendAIMessage(text) {
            const chatMessages = document.getElementById("chat-messages");
            const messageDiv = document.createElement("div");
            messageDiv.className = "message ai-message";
            messageDiv.innerHTML = `
                <div class="message-content">${text}</div>
                <div style="display: flex; gap: 10px; margin-top: 8px; font-size: 0.85rem;">
                    <button onclick="copyText(this)" style="background:#212635; color:#fff; border:none; padding:4px 8px; border-radius:4px; cursor:pointer;">📋 Copy</button>
                    <button onclick="speakText('${text.replace(/'/g, "\\'")}')" style="background:#212635; color:#fff; border:none; padding:4px 8px; border-radius:4px; cursor:pointer;">🔊 Listen</button>
                </div>
            `;
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function appendMessage(sender, text) {
            const chatMessages = document.getElementById("chat-messages");
            const messageDiv = document.createElement("div");
            messageDiv.className = `message ${sender === 'You' ? 'user-message' : 'ai-message'}`;
            messageDiv.innerHTML = `<div class="message-content">${text}</div>`;
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function copyText(button) {
            const text = button.closest('.ai-message').querySelector('.message-content').innerText;
            navigator.clipboard.writeText(text);
            alert("టెక్స్ట్ కాపీ చేయబడింది!");
        }

        function speakText(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'te-IN';
                window.speechSynthesis.speak(utterance);
            }
        }

        document.getElementById("send-btn").addEventListener("click", () => {
            const input = document.getElementById("user-input");
            if (input.value.trim() !== "") {
                sendToAI(input.value);
                input.value = "";
            }
        });
    </script>
</body>
</html>
