
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>AI Sameer</title>

<style>
:root {
  color-scheme: dark;
  --bg: #000000;
  --panel: #1c1c1c;
  --panel2: #252525;
  --text: #f1f1f1;
  --muted: #a5a5a5;
  --border: #303038;
  --blue: #a9baff;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, BlinkMacSystemFont,
               "Segoe UI", sans-serif;
}

body { min-height: 100dvh; }

button, textarea, input { font: inherit; }
button { color: inherit; cursor: pointer; }
button:focus-visible, textarea:focus-visible {
  outline: 2px solid var(--blue);
  outline-offset: 3px;
}

.topbar {
  height: 66px;
  padding: 0 15px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  background: #000;
  position: sticky;
  top: 0;
  z-index: 10;
}

.top-left {
  display: flex;
  align-items: center;
  gap: 14px;
}

.icon-button {
  border: 0;
  background: transparent;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 25px;
}

.icon-button:active { background: #252525; }

.brand {
  font-size: 21px;
  font-weight: 500;
  letter-spacing: -.4px;
}

.new-chat { font-size: 26px; }

main {
  max-width: 850px;
  margin: 0 auto;
  padding: 0 18px;
}

#welcome {
  min-height: calc(100dvh - 255px);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  text-align: center;
  padding: 30px 0 55px;
}

.sparkle {
  font-size: 65px;
  line-height: 1.2;
  background: linear-gradient(45deg,#4285f4,#34a853,#fbbc05,#ea4335);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  margin-bottom: 22px;
}

#welcome h1 {
  margin: 0;
  font-size: clamp(29px, 7vw, 43px);
  font-weight: 400;
  letter-spacing: -1.2px;
  line-height: 1.25;
}

#welcome p {
  color: var(--muted);
  font-size: 15px;
  margin-top: 16px;
}

#messages {
  display: flex;
  flex-direction: column;
  gap: 20px;
  padding: 24px 0 25px;
}

.user-message {
  align-self: flex-end;
  max-width: 88%;
  padding: 13px 18px;
  background: #202433;
  border-radius: 25px 25px 5px 25px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  line-height: 1.65;
}

.answer {
  width: 100%;
  padding: 7px 2px 12px;
  line-height: 1.8;
  font-size: 16px;
  overflow-wrap: anywhere;
}

.answer-text { white-space: pre-wrap; }

.answer-actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 5px;
  border-top: 1px solid #292929;
  margin-top: 17px;
  padding-top: 10px;
}

.answer-actions button {
  border: 0;
  background: transparent;
  border-radius: 50%;
  width: 43px;
  height: 43px;
  font-size: 21px;
}

.answer-actions button:active { background: #292929; }

.composer-wrap {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 12;
  padding: 12px 14px max(12px, env(safe-area-inset-bottom));
  background: linear-gradient(transparent, #000 14%);
}

.composer {
  max-width: 810px;
  margin: 0 auto;
  padding: 11px 13px;
  border: 1px solid #292929;
  border-radius: 35px;
  background: var(--panel);
  box-shadow: 0 5px 24px #0005;
}

#question {
  display: block;
  width: 100%;
  min-height: 49px;
  max-height: 135px;
  resize: none;
  border: 0;
  outline: none;
  background: transparent;
  color: #fff;
  padding: 10px 9px;
  font-size: 17px;
  line-height: 1.5;
}

#question::placeholder { color: #a5a5a5; }

.composer-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.composer-left {
  display: flex;
  align-items: center;
  gap: 12px;
}

.composer-button {
  border: 0;
  background: transparent;
  width: 44px;
  height: 44px;
  flex: 0 0 44px;
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 25px;
}

.composer-button:active { background: #333; }

#voiceButton {
  width: 53px;
  height: 53px;
  flex-basis: 53px;
  border: 0;
  border-radius: 50%;
  background: #283f98;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 25px;
}

#voiceButton.listening {
  background: #b3261e;
  animation: pulse 1.2s infinite;
}

#sendButton {
  display: none;
  width: 48px;
  height: 48px;
  flex-basis: 48px;
  border: 0;
  border-radius: 50%;
  background: var(--blue);
  color: #10182f;
  font-size: 24px;
}

#sendButton.visible { display: flex; align-items: center; justify-content: center; }
#sendButton:disabled { opacity: .55; }

@keyframes pulse {
  50% { box-shadow: 0 0 0 7px #b3261e33; }
}

/* Plus feature sheet */
#overlay {
  position: fixed;
  inset: 0;
  z-index: 20;
  background: #0009;
  display: none;
}

#overlay.open { display: block; }

#featurePanel {
  display: none;
  position: fixed;
  z-index: 21;
  left: 12px;
  right: 12px;
  bottom: 100px;
  max-width: 650px;
  max-height: min(76dvh, 760px);
  overflow-y: auto;
  margin: 0 auto;
  padding: 16px 15px 20px;
  background: #1c1c1c;
  border: 1px solid #343434;
  border-radius: 32px;
  box-shadow: 0 12px 45px #0009;
}

#featurePanel.open { display: block; }

.handle {
  width: 64px;
  height: 5px;
  border-radius: 9px;
  background: #777;
  margin: 0 auto 20px;
}

.feature-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 9px;
  margin-bottom: 17px;
}

.feature-tile {
  min-height: 115px;
  padding: 10px 3px;
  border: 0;
  border-radius: 26px;
  background: #282828;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
}

.feature-tile .emoji { font-size: 34px; }
.feature-tile span:last-child { font-size: 16px; }
.feature-tile:active, .feature-row:active { background: #383838; }

.feature-list {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.feature-row {
  width: 100%;
  min-height: 79px;
  padding: 12px 10px;
  display: flex;
  align-items: center;
  gap: 20px;
  text-align: left;
  border: 0;
  border-radius: 16px;
  background: transparent;
}

.feature-icon {
  width: 40px;
  flex: 0 0 40px;
  text-align: center;
  font-size: 29px;
}

.feature-name { font-size: 19px; }
.feature-description { color: #aaa; font-size: 15px; margin-top: 3px; }

/* Side menu */
#sideOverlay {
  display: none;
  position: fixed;
  inset: 0;
  background: #0009;
  z-index: 29;
}

#sideOverlay.open { display: block; }

#sideMenu {
  position: fixed;
  z-index: 30;
  inset: 0 auto 0 0;
  width: min(87vw, 355px);
  background: #111318;
  padding: 18px 14px;
  transform: translateX(-105%);
  transition: transform .22s ease;
  display: flex;
  flex-direction: column;
  gap: 10px;
  overflow-y: auto;
}

#sideMenu.open { transform: translateX(0); }

.side-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 22px;
  padding: 5px 3px 18px;
}

.side-item {
  width: 100%;
  padding: 16px;
  text-align: left;
  border: 0;
  border-radius: 16px;
  background: #202127;
  font-size: 17px;
}

#chatSearch {
  display: none;
  padding: 13px;
  background: #252630;
  border: 1px solid #444;
  border-radius: 13px;
  color: #fff;
  width: 100%;
}

.history-item {
  width: 100%;
  text-align: left;
  background: transparent;
  border: 0;
  padding: 12px;
  border-radius: 12px;
  overflow-wrap: anywhere;
}

#fileInput, #cameraInput { display: none; }

#attached {
  display: none;
  padding: 5px 9px;
  color: #bdbdbd;
  font-size: 13px;
  overflow-wrap: anywhere;
}

#toast {
  display: none;
  position: fixed;
  z-index: 60;
  left: 50%;
  bottom: 125px;
  transform: translateX(-50%);
  max-width: 90%;
  background: #333;
  color: white;
  padding: 12px 17px;
  border-radius: 16px;
  font-size: 14px;
  text-align: center;
}

@media (min-width: 600px) {
  .composer-wrap { padding-bottom: 18px; }
  #featurePanel { left: 18px; right: auto; width: 430px; bottom: 100px; }
}

@media (max-height: 650px) {
  #welcome { min-height: 42dvh; }
  #featurePanel { max-height: 65dvh; }
}
</style>
</head>

<body>

<header class="topbar">
  <div class="top-left">
    <button class="icon-button" id="menuButton" aria-label="Open menu">☰</button>
    <div class="brand">AI Sameer</div>
  </div>
  <button class="icon-button new-chat" id="newChatButton" aria-label="New chat">✎</button>
</header>

<aside id="sideMenu" aria-label="AI Sameer menu">
  <div class="side-heading">
    <span>AI Sameer</span>
    <button class="icon-button" id="closeMenuButton" aria-label="Close menu">×</button>
  </div>
  <button class="side-item" id="sideNewChat">✎ &nbsp; New chat</button>
  <button class="side-item" id="searchChatsButton">⌕ &nbsp; Search chats</button>
  <input id="chatSearch" type="search" placeholder="Search chats...">
  <button class="side-item" id="sideImagesButton">▧ &nbsp; Images</button>
  <div id="chatHistory"></div>
</aside>
<div id="sideOverlay"></div>

<main>
  <section id="welcome">
    <div class="sparkle">✦</div>
    <h1>What should we<br>focus on?</h1>
    <p>Ask anything. Let's figure it out together.</p>
  </section>
  <section id="messages" aria-live="polite"></section>
</main>

<div id="overlay"></div>

<section id="featurePanel" aria-label="More features">
  <div class="handle"></div>

  <div class="feature-grid">
    <button class="feature-tile" data-feature="Photos">
      <span class="emoji">🖼️</span><span>Photos</span>
    </button>
    <button class="feature-tile" data-feature="Camera">
      <span class="emoji">📸</span><span>Camera</span>
    </button>
    <button class="feature-tile" data-feature="Avatar">
      <span class="emoji">😊</span><span>Avatar</span>
    </button>
  </div>

  <div class="feature-list">
    <button class="feature-row" data-feature="Images">
      <span class="feature-icon">🎨</span>
      <span><div class="feature-name">Images</div><div class="feature-description">Create and edit</div></span>
    </button>
    <button class="feature-row" data-feature="Music">
      <span class="feature-icon">🎵</span>
      <span><div class="feature-name">Music</div><div class="feature-description">Make audio tracks</div></span>
    </button>
    <button class="feature-row" data-feature="Canvas">
      <span class="feature-icon">▣</span>
      <span><div class="feature-name">Canvas</div><div class="feature-description">Code, write or make slides</div></span>
    </button>
    <button class="feature-row" data-feature="Deep Research">
      <span class="feature-icon">◎</span>
      <span><div class="feature-name">Deep Research</div><div class="feature-description">Get detailed reports</div></span>
    </button>
    <button class="feature-row" data-feature="Guided Learning">
      <span class="feature-icon">📖</span>
      <span><div class="feature-name">Guided Learning</div><div class="feature-description">Get step-by-step help</div></span>
    </button>
  </div>
</section>

<div class="composer-wrap">
  <div class="composer">
    <div id="attached"></div>
    <textarea id="question" rows="1" placeholder="Ask AI Sameer..." aria-label="Ask AI Sameer"></textarea>
    <div class="composer-row">
      <div class="composer-left">
        <button class="composer-button" id="plusButton" aria-label="More features">＋</button>
        <button class="composer-button" id="micButton" aria-label="Voice typing">🎙</button>
      </div>
      <button id="sendButton" aria-label="Send message">➤</button>
      <button id="voiceButton" aria-label="Voice mode" title="Voice mode">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none" aria-hidden="true">
          <rect x="3" y="10" width="3" height="8" rx="1.5" fill="currentColor"/>
          <rect x="9" y="5" width="3" height="18" rx="1.5" fill="currentColor"/>
          <rect x="15" y="9" width="3" height="10" rx="1.5" fill="currentColor"/>
          <rect x="21" y="7" width="3" height="14" rx="1.5" fill="currentColor"/>
        </svg>
      </button>
    </div>
  </div>
</div>

<input id="fileInput" type="file" accept="image/*" multiple>
<input id="cameraInput" type="file" accept="image/*" capture="environment">
<div id="toast" role="status"></div>

<script>
"use strict";

/*
 IMPORTANT:
 Keep your real Cloudflare Worker URL here.
 The address below is the Worker address used in the previous version.
 If your actual Worker URL is different, replace it with that exact URL.
*/
const API_URL = "https://ai-sameer-api.shaikmahammed757.workers.dev";

const $ = id => document.getElementById(id);

const question = $("question");
const messages = $("messages");
const welcome = $("welcome");
const featurePanel = $("featurePanel");
const overlay = $("overlay");
const sideMenu = $("sideMenu");
const sideOverlay = $("sideOverlay");

let chat = [];
let savedChats = [];
let selectedFiles = [];
let busy = false;
let lastAnswer = "";
let voiceMode = false;
let recognition = null;

function showToast(message) {
  const el = $("toast");
  el.textContent = message;
  el.style.display = "block";
  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(() => el.style.display = "none", 3200);
}

function toggleFeatures(force) {
  const open = typeof force === "boolean"
    ? force : !featurePanel.classList.contains("open");
  featurePanel.classList.toggle("open", open);
  overlay.classList.toggle("open", open);
}

function toggleSideMenu(force) {
  const open = typeof force === "boolean"
    ? force : !sideMenu.classList.contains("open");
  sideMenu.classList.toggle("open", open);
  sideOverlay.classList.toggle("open", open);
}

$("plusButton").addEventListener("click", () => toggleFeatures());
overlay.addEventListener("click", () => toggleFeatures(false));
$("menuButton").addEventListener("click", () => toggleSideMenu());
$("closeMenuButton").addEventListener("click", () => toggleSideMenu(false));
sideOverlay.addEventListener("click", () => toggleSideMenu(false));

function newChat() {
  if (chat.length) savedChats.unshift(chat.slice());
  chat = [];
  lastAnswer = "";
  selectedFiles = [];
  messages.replaceChildren();
  $("attached").style.display = "none";
  $("attached").textContent = "";
  question.value = "";
  question.style.height = "49px";
  welcome.style.display = "flex";
  renderChatHistory();
  toggleFeatures(false);
  toggleSideMenu(false);
  updateComposer();
  question.focus();
}

$("newChatButton").addEventListener("click", newChat);
$("sideNewChat").addEventListener("click", newChat);

$("searchChatsButton").addEventListener("click", () => {
  const el = $("chatSearch");
  el.style.display = el.style.display === "block" ? "none" : "block";
  if (el.style.display === "block") el.focus();
});

function renderChatHistory() {
  const list = $("chatHistory");
  const term = $("chatSearch").value.toLowerCase();
  list.replaceChildren();

  savedChats.forEach((saved, index) => {
    const first = saved.find(m => m.role === "user")?.content || "New chat";
    if (!first.toLowerCase().includes(term)) return;

    const btn = document.createElement("button");
    btn.className = "history-item";
    btn.textContent = first;
    btn.addEventListener("click", () => {
      chat = saved.slice();
      messages.replaceChildren();
      chat.forEach(m => addMessage(m.role, m.content));
      welcome.style.display = "none";
      toggleSideMenu(false);
      updateComposer();
    });
    list.appendChild(btn);
  });
}
$("chatSearch").addEventListener("input", renderChatHistory);

function addMessage(role, text) {
  if (role === "user") {
    const el = document.createElement("div");
    el.className = "user-message";
    el.textContent = text;
    messages.appendChild(el);
    return el;
  }

  const el = document.createElement("article");
  el.className = "answer";

  const body = document.createElement("div");
  body.className = "answer-text";
  body.textContent = text;
  el.appendChild(body);

  const actions = document.createElement("div");
  actions.className = "answer-actions";

  function action(icon, label, callback) {
    const btn = document.createElement("button");
    btn.textContent = icon;
    btn.title = label;
    btn.setAttribute("aria-label", label);
    btn.addEventListener("click", callback);
    actions.appendChild(btn);
  }

  action("📋", "Copy", () => copyText(body.textContent));
  action("👍", "Like", () => showToast("Thanks for your feedback!"));
  action("👎", "Dislike", () => showToast("Thanks for your feedback."));
  action("🔊", "Read aloud", () => speakText(body.textContent));
  action("📤", "Share", () => shareText(body.textContent));

  el.appendChild(actions);
  el.body = body;
  messages.appendChild(el);
  el.scrollIntoView({ behavior: "smooth", block: "nearest" });
  return el;
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    showToast("Copied.");
  } catch {
    showToast("Clipboard access is unavailable in this browser.");
  }
}

async function shareText(text) {
  try {
    if (navigator.share) {
      await navigator.share({ title: "AI Sameer", text });
    } else {
      await copyText(text);
    }
  } catch (err) {
    if (err.name !== "AbortError") showToast("Unable to share right now.");
  }
}

function speakText(text) {
  if (!("speechSynthesis" in window)) {
    showToast("Speech playback is not supported in this browser.");
    return;
  }
  speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = "en-IN";
  speechSynthesis.speak(utterance);
}

function updateComposer() {
  const hasText = question.value.trim().length > 0;
  $("sendButton").classList.toggle("visible", hasText);
  $("voiceButton").style.display = hasText ? "none" : "flex";
}

question.addEventListener("input", () => {
  question.style.height = "49px";
  question.style.height = Math.min(question.scrollHeight, 135) + "px";
  updateComposer();
});

question.addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
});

function startSpeechRecognition(onText) {
  const SpeechRecognition =
    window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    showToast("Voice typing is not supported. Try Chrome and allow microphone access.");
    return;
  }

  try {
    if (recognition) recognition.abort();
    recognition = new SpeechRecognition();
    recognition.lang = "en-IN";
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    recognition.onresult = event => {
      const spoken = event.results[0][0].transcript;
      onText(spoken);
    };

    recognition.onerror = () => {
      $("voiceButton").classList.remove("listening");
      showToast("Microphone unavailable. Check browser permissions.");
    };

    recognition.onend = () => {
      $("voiceButton").classList.remove("listening");
      if (voiceMode) voiceMode = false;
    };

    recognition.start();
    return true;
  } catch {
    showToast("Could not start the microphone.");
    return false;
  }
}

$("micButton").addEventListener("click", () => {
  startSpeechRecognition(text => {
    question.value = (question.value.trim() ? question.value.trim() + " " : "") + text;
    question.dispatchEvent(new Event("input"));
    question.focus();
  });
});

$("voiceButton").addEventListener("click", () => {
  voiceMode = true;
  $("voiceButton").classList.add("listening");
  showToast("Listening... Speak your question.");

  const started = startSpeechRecognition(text => {
    question.value = text;
    question.dispatchEvent(new Event("input"));
    voiceMode = false;
    $("voiceButton").classList.remove("listening");
    sendMessage(true);
  });

  if (!started) {
    voiceMode = false;
    $("voiceButton").classList.remove("listening");
  }
});

function addSelectedFiles(file
