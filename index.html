<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SK MD Bike Puzzle & Earn</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0f172a;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
        }
        header {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            padding: 14px;
            font-size: 18px;
            font-weight: bold;
            color: #000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .container {
            padding: 10px;
            max-width: 400px;
            margin: auto;
        }
        .wallet-box {
            background: #1e293b;
            border: 2px solid #f59e0b;
            padding: 8px;
            margin: 8px 0;
            border-radius: 8px;
        }
        .balance-text {
            color: #4ade80;
            font-weight: bold;
            font-size: 16px;
        }
        .game-screen {
            background: #1e293b;
            border: 3px solid #3b82f6;
            border-radius: 12px;
            padding: 10px;
            margin-top: 5px;
        }
        /* Main Blueprint Puzzle Box */
        .puzzle-container {
            width: 260px;
            height: 260px;
            margin: 10px auto;
            background: #1e3a8a;
            border: 3px solid #60a5fa;
            border-radius: 8px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 2px;
            padding: 2px;
        }
        .puzzle-slot {
            background: #0f172a;
            border: 2px dashed #93c5fd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            color: #93c5fd;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        /* Parts Pool Grid */
        .parts-pool {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin: 10px 0;
        }
        .pool-piece {
            width: 60px;
            height: 60px;
            background: #334155;
            border: 2px solid #f59e0b;
            border-radius: 6px;
            cursor: pointer;
            overflow: hidden;
            margin: auto;
            transition: 0.2s;
        }
        .pool-piece:active {
            transform: scale(0.92);
        }
        /* Splitting the master bike image into 4 quarters */
        .bike-part-0 { background: url('https://images.unsplash.com/photo-1558981806-ec527fa84c39?w=400&auto=format&fit=crop&q=80') 0px 0px/120px 120px no-repeat; }
        .bike-part-1 { background: url('https://images.unsplash.com/photo-1558981806-ec527fa84c39?w=400&auto=format&fit=crop&q=80') -60px 0px/120px 120px no-repeat; }
        .bike-part-2 { background: url('https://images.unsplash.com/photo-1558981806-ec527fa84c39?w=400&auto=format&fit=crop&q=80') 0px -60px/120px 120px no-repeat; }
        .bike-part-3 { background: url('https://images.unsplash.com/photo-1558981806-ec527fa84c39?w=400&auto=format&fit=crop&q=80') -60px -60px/120px 120px no-repeat; }

        .action-btn {
            background: #22c55e;
            color: white;
            border: none;
            padding: 10px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>
<body>

    <header>SK MD Bike Puzzle & Earn</header>

    <div class="container">
        <div class="wallet-box">
            <p style="margin:2px 0;">Wallet Balance: <span class="balance-text" id="balance">₹0</span></p>
            <p style="margin:2px 0; font-size: 11px; color: #94a3b8;">Min. Withdrawal Limit: <b>₹1000</b></p>
        </div>

        <div class="game-screen">
            <h3 style="margin:4px 0;">Bike Mechanic Photo Puzzle</h3>
            <p style="font-size: 11px; color: #cbd5e1; margin-bottom: 6px;">Tap a part below, then tap slots to form the full bike photo!</p>
            
            <!-- 4 Slots forming the full bike image -->
            <div class="puzzle-container">
                <div class="puzzle-slot" id="slot0" onclick="placePiece(0)">Slot 1</div>
                <div class="puzzle-slot" id="slot1" onclick="placePiece(1)">Slot 2</div>
                <div class="puzzle-slot" id="slot2" onclick="placePiece(2)">Slot 3</div>
                <div class="puzzle-slot" id="slot3" onclick="placePiece(3)">Slot 4</div>
            </div>

            <div style="font-size:12px; color:#f59e0b; margin: 5px 0;">Scrambled Bike Parts</div>
            
            <!-- Shuffled pieces pool -->
            <div class="parts-pool" id="poolContainer"></div>

            <button class="action-btn" onclick="verifyPuzzle()">Check & Earn ₹50</button>
        </div>
    </div>

    <script>
        let balance = 0;
        let selectedPartClass = null;
        let currentSlots = [null, null, null, null];
        const correctParts = ['bike-part-0', 'bike-part-1', 'bike-part-2', 'bike-part-3'];

        function initGame() {
            document.getElementById("balance").innerText = "₹" + balance;
            currentSlots = [null, null, null, null];
            renderBoard();

            let pool = document.getElementById("poolContainer");
            pool.innerHTML = "";

            let shuffled = [...correctParts].sort(() => Math.random() - 0.5);
            shuffled.forEach(partClass => {
                let div = document.createElement("div");
                div.className = `pool-piece ${partClass}`;
                div.onclick = function() {
                    selectedPartClass = partClass;
                    alert("Piece selected! Now tap any slot above to fix it.");
                };
                pool.appendChild(div);
            });
        }

        function renderBoard() {
            for(let i=0; i<4; i++) {
                let slot = document.getElementById("slot" + i);
                if(currentSlots[i]) {
                    slot.className = `puzzle-slot ${currentSlots[i]}`;
                    slot.innerText = "";
                } else {
                    slot.className = "puzzle-slot";
                    slot.innerText = `Slot ${i+1}`;
                }
            }
        }

        function placePiece(index) {
            if(selectedPartClass) {
                currentSlots[index] = selectedPartClass;
                selectedPartClass = null;
                renderBoard();
            } else {
                alert("Please select a bike part from the bottom first!");
            }
        }

        function verifyPuzzle() {
            balance += 50;
            if(balance >= 1000) {
                alert("🎉 అభినందనలు! మీరు ₹1000 విత్‌డ్రా లిమిట్ చేరుకున్నారు.");
            } else {
                alert("✨ అద్భుతం! బైక్ ఫోటో సరిగ్గా సెట్ అయింది. ₹50 మీ వాలెట్‌కి చేరింది!");
            }
            initGame();
        }

        initGame();
    </script>
</body>
</html>
