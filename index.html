<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#10111b">
  <title>AI Sameer</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #10111b;
      color: #f5f5ff;
    }
    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }
    .app { min-height: 100vh; display: flex; }
    aside {
      width: 245px; padding: 18px;
      background: #171824; border-right: 1px solid #303142;
      display: flex; flex-direction: column; gap: 14px;
    }
    .brand { font-size: 23px; font-weight: 800; color: #a9a1ff; }
    .new-chat, .history-item {
      width: 100%; padding: 12px; border-radius: 12px;
      border: 1px solid #37394c; background: #222433;
      color: white; text-align: left;
    }
    .history-item { margin-top: 8px; overflow-wrap: anywhere; }
    .side-label { color: #aaaabd; font-size: 13px; margin-top: 8px; }
    .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    header {
      padding: 15px 18px; display: flex; justify-content: space-between;
      align-items: center; gap: 12px; border-bottom: 1px solid #303142;
    }
    header strong { font-size: 19px; }
    select {
      max-width: 145px; background: #222433; color: white;
      border: 1px solid #45465a; border-radius: 9px; padding: 9px;
    }
    #messages {
      flex: 1; width: 100%; max-width: 850px; margin: 0 auto;
      padding: 25px 18px 150px;
    }
    .welcome { text-align: center; padding: 13vh 0 25px; }
    .orb {
      margin: 0 auto 20px; width: 68px; height: 68px;
      display: grid; place-items: center; border-radius: 22px;
      font-size: 35px; background: linear-gradient(135deg,#7668ff,#24c8cf);
    }
    .welcome h1 { font-size: clamp(27px,5vw,42px); margin: 10px 0; }
    .welcome p { color: #b3b3c8; line-height: 1.7; }
    .suggestions {
      display: grid; grid-template-columns: repeat(2,minmax(0,1fr));
      gap: 10px; margin-top: 25px;
    }
    .suggestions button {
      background: #1b1d2b; color: #eeeefa; border: 1px solid #35374b;
      border-radius: 13px; padding: 15px; text-align: left;
    }
    .message { margin: 16px 0; line-height: 1.7; overflow-wrap: anywhere; }
    .message .who { font-weight: bold; color: #b8b0ff; margin-bottom: 5px; }
    .message .bubble { white-space: pre-wrap; }
    .composer-wrap {
      position: fixed; bottom: 0; left: 245px; right: 0;
      padding: 16px; background: linear-gradient(transparent,#10111b 22%);
    }
    .composer { max-width: 850px; margin: 0 auto; }
    .input-box {
      display: flex; gap: 8px; align-items: flex-end;
      background: #202231; border: 1px solid #414359;
      border-radius: 18px; padding: 10px;
    }
    textarea {
      flex: 1; min-width: 0; resize: vertical; max-height: 140px;
      min-height: 45px; background: transparent; color: white;
      border: 0; outline: none; padding: 12px 5px;
    }
    .icon-btn {
      min-width: 43px; height: 43px; border: 0; border-radius: 12px;
      background: #34364a; color: white;
    }
    .send { background: #8174ff; color: #fff; font-weight: bold; }
    .hint { text-align: center; font-size: 11px; color: #9697ad; padding: 10px 0 0; }
    #status { color: #a9a1ff; font-size: 12px; min-height: 17px; }
    .menu-btn { display: none; }
    @media(max-width:650px) {
      aside { display: none; }
      aside.open {
        display: flex; position: fixed; z-index: 5; top: 0; bottom: 0;
        left: 0; box-shadow: 10px 0 30px #0008;
      }
      .menu-btn { display: inline-block; }
      header { padding: 12px; }
      .composer-wrap { left: 0; padding: 10px; }
      #messages { padding: 18px 13px 155px; }
      .welcome { padding-top: 9vh; }
      .suggestions { grid-template-columns: 1fr; }
      .input-box { gap: 5px; }
      .icon-btn { min-width: 39px; }
    }
  </style>
</head>
<body>
<div class="app">
  <aside id="sidebar">
    <div class="brand">✦ AI SAMEER</div>
    <button class="new-chat" id="newChat">＋ కొత్త చాట్ / New Chat</button>
    <div class="side-label">చాట్ హిస్టరీ / History</div>
    <div id="history"></div>
    <div style="margin-top:auto;color:#999ab1;font-size:12px;line-height:1.6">
      AI Sameer<br>మీ వ్యక్తిగత AI సహాయకుడు
    </div>
  </aside>

  <main class="main">
    <header>
      <div style="display:flex;align-items:center;gap:10px">
        <button class="icon-btn menu-btn" id="menu" aria-label="Menu">☰</button>
        <strong>✦ AI Sameer</strong>
      </div>
      <select id="language" aria-label="Language">
        <option value="te">తెలుగు</option>
        <option value="en">English</option>
        <option value="hi">हिन्दी</option>
        <option value="kn">ಕನ್ನಡ</option>
        <option value="ur">اردو</option>
      </select>
    </header>

    <section id="messages" aria-live="polite">
      <div class="welcome" id="welcome">
        <div class="orb">✦</div>
        <h1 id="greeting">నమస్కారం! 👋</h1>
        <p id="subtitle">నేను AI Sameer. ఈరోజు మీకు ఎలా సహాయం చేయగలను?</p>
        <div class="suggestions" id="suggestions">
          <button data-prompt="నాకు ఒక మంచి YouTube వీడియో ఐడియా ఇవ్వండి">🎬 YouTube వీడియో ఐడియా</button>
          <button data-prompt="నాకు ఒక ప్రొఫెషనల్ వెబ్‌సైట్ కోడ్ ఇవ్వండి">💻 వెబ్‌సైట్ కోడ్</button>
          <button data-prompt="ఇంగ్లీష్ నేర్చుకోవడంలో సహాయం చేయండి">📚 ఇంగ్లీష్ నేర్చుకుందాం</button>
          <button data-prompt="కృత్రిమ మేధస్సు అంటే ఏమిటి?">✨ AI గురించి తెలుసుకుందాం</button>
        </div>
      </div>
    </section>

    <div class="composer-wrap">
      <div class="composer">
        <div class="input-box">
          <textarea id="prompt" rows="1" placeholder="మీ ప్రశ్నను ఇక్కడ టైప్ చేయండి..."></textarea>
          <button class="icon-btn" id="voice" aria-label="Voice input" title="వాయిస్ ఇన్‌పుట్">🎙️</button>
          <button class="icon-btn send" id="send" aria-label="Send">➤</button>
        </div>
        <div id="status"></div>
        <div class="hint">AI సమాధానాల కోసం AI సర్వీస్‌ను కనెక్ట్ చేయాలి.</div>
      </div>
    </div>
  </main>
</div>

<script>
  const $ = id => document.getElementById(id);
  let chats = [];
  let currentChat = [];
  let recognition = null;

  const words = {
    te: {
      greeting: "నమస్కారం! 👋",
      subtitle: "నేను AI Sameer. ఈరోజు మీకు ఎలా సహాయం చేయగలను?",
      placeholder: "మీ ప్రశ్నను ఇక్కడ టైప్ చేయండి...",
      empty: "దయచేసి ముందుగా ఒక ప్రశ్న టైప్ చేయండి.",
      noAI: "ఇది AI Sameer డెమో వెర్షన్. ప్రస్తుతం నిజమైన AI సమాధానాల సర్వీస్ కనెక్ట్ కాలేదు. AI సమాధానాల కోసం సురక్షితమైన బ్యాకెండ్‌ను జోడించాలి.",
      you: "మీరు", assistant: "AI Sameer",
      listening: "మీ మాట వింటున్నాను...", voiceError: "వాయిస్ ఇన్‌పుట్ అందుబాటులో లేదు. దయచేసి టైప్ చేయండి."
    },
    en: {
      greeting: "Hello there! 👋",
      subtitle: "I'm AI Sameer. How can I help you today?",
      placeholder: "Type your question here...",
      empty: "Please type a question first.",
      noAI: "This is the AI Sameer demo. A real AI service is not connected yet. A secure backend is needed for AI-generated answers.",
      you: "You", assistant: "AI Sameer",
      listening: "Listening...", voiceError: "Voice input is unavailable. Please type instead."
    },
    hi: {
      greeting: "नमस्ते! 👋",
      subtitle: "मैं AI Sameer हूँ। आज आपकी क्या मदद करूँ?",
      placeholder: "अपना सवाल यहाँ लिखें...",
      empty: "कृपया पहले सवाल लिखें।",
      noAI: "यह AI Sameer का डेमो है। असली AI उत्तरों के लिए सुरक्षित बैकएंड जोड़ना होगा।",
      you: "आप", assistant: "AI Sameer",
      listening: "सुन रहा हूँ...", voiceError: "वॉइस इनपुट उपलब्ध नहीं है। कृपया टाइप करें।"
    },
    kn: {
      greeting: "ನಮಸ್ಕಾರ! 👋",
      subtitle: "ನಾನು AI Sameer. ಇಂದು ನಿಮಗೆ ಹೇಗೆ ಸಹಾಯ ಮಾಡಲಿ?",
      placeholder: "ನಿಮ್ಮ ಪ್ರಶ್ನೆಯನ್ನು ಇಲ್ಲಿ ಬರೆಯಿರಿ...",
      empty: "ದಯವಿಟ್ಟು ಮೊದಲು ಪ್ರಶ್ನೆ ಬರೆಯಿರಿ.",
      noAI: "ಇದು AI Sameer ಡೆಮೊ. ನಿಜವಾದ AI ಉತ್ತರಗಳಿಗಾಗಿ ಸುರಕ್ಷಿತ ಬ್ಯಾಕೆಂಡ್ ಅಗತ್ಯವಿದೆ.",
      you: "ನೀವು", assistant: "AI Sameer",
      listening: "ಕೇಳುತ್ತಿದ್ದೇನೆ...", voiceError: "ಧ್ವನಿ ಇನ್‌ಪುಟ್ ಲಭ್ಯವಿಲ್ಲ. ದಯವಿಟ್ಟು ಟೈಪ್ ಮಾಡಿ."
    },
    ur: {
      greeting: "السلام علیکم! 👋",
      subtitle: "میں AI Sameer ہوں۔ آج میں آپ کی کیا مدد کر سکتا ہوں؟",
      placeholder: "اپنا سوال یہاں لکھیں...",
      empty: "براہ کرم پہلے سوال لکھیں۔",
      noAI: "یہ AI Sameer کا ڈیمو ہے۔ حقیقی AI جوابات کے لیے محفوظ بیک اینڈ درکار ہے۔",
      you: "آپ", assistant: "AI Sameer",
      listening: "سن رہا ہوں...", voiceError: "وائس ان پٹ دستیاب نہیں۔ براہ کرم ٹائپ کریں۔"
    }
  };

  function lang() { return words[$("language").value] || words.te; }

  function applyLanguage() {
    const w = lang();
    $("greeting").textContent = w.greeting;
    $("subtitle").textContent = w.subtitle;
    $("prompt").placeholder = w.placeholder;
    document.documentElement.lang = $("language").value;
  }

  function addMessage(role, text) {
    const welcome = $("welcome");
    if (welcome) welcome.remove();

    const box = document.createElement("div");
    box.className = "message";
    const who = document.createElement("div");
    who.className = "who";
    who.textContent = role === "user" ? lang().you : lang().assistant;
    const body = document.createElement("div");
    body.className = "bubble";
    body.textContent = text;
    box.append(who, body);
    $("messages").appendChild(box);
    window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
  }

  function renderHistory() {
    $("history").replaceChildren();
    chats.slice().reverse().forEach((chat, index) => {
      const btn = document.createElement("button");
      btn.className = "history-item";
      btn.textContent = chat.title || ("Chat " + (chats.length - index));
      btn.onclick = () => {
        currentChat = chat.messages.slice();
        $("messages").replaceChildren();
        currentChat.forEach(m => addMessage(m.role, m.text));
        $("sidebar").classList.remove("open");
      };
      $("history").appendChild(btn);
    });
  }

  function saveChat() {
    if (!currentChat.length) return;
    const title = currentChat.find(m => m.role === "user")?.text.slice(0, 32) || "New chat";
    const old = chats.findIndex(c => c.id === currentChat.id);
    const id = currentChat.id || Date.now();
    currentChat.id = id;
    const item = { id, title, messages: currentChat.slice() };
    const idx = chats.findIndex(c => c.id === id);
    if (idx >= 0) chats[idx] = item;
    else chats.push(item);
    try { localStorage.setItem("sameerChats", JSON.stringify(chats)); } catch (e) {}
    renderHistory();
  }

  function newChat() {
    saveChat();
    currentChat = [];
    $("messages").innerHTML = "";
    const welcome = document.createElement("div");
    welcome.className = "welcome";
    welcome.id = "welcome";
    welcome.innerHTML = '<div class="orb">✦</div><h1 id="greeting"></h1><p id="subtitle"></p><div class="suggestions" id="suggestions"><button data-prompt="నాకు ఒక మంచి YouTube వీడియో ఐడియా ఇవ్వండి">🎬 YouTube వీడియో ఐడియా</button><button data-prompt="నాకు ఒక ప్రొఫెషనల్ వెబ్‌సైట్ కోడ్ ఇవ్వండి">💻 వెబ్‌సైట్ కోడ్</button><button data-prompt="ఇంగ్లీష్ నేర్చుకోవడంలో సహాయం చేయండి">📚 ఇంగ్లీష్ నేర్చుకుందాం</button><button data-prompt="కృత్రిమ మేధస్సు అంటే ఏమిటి?">✨ AI గురించి తెలుసుకుందాం</button></div>';
    $("messages").appendChild(welcome);
    applyLanguage();
  }

  function sendMessage(text) {
    text = (text || $("prompt").value).trim();
    if (!text) { $("status").textContent = lang().empty; return; }
    $("status").textContent = "";
    $("prompt").value = "";
    currentChat.push({ role: "user", text });
    addMessage("user", text);
    const reply = lang().noAI;
    currentChat.push({ role: "assistant", text: reply });
    addMessage("assistant", reply);
    saveChat();
  }

  $("send").addEventListener("click", () => sendMessage());
  $("prompt").addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });
  $("newChat").addEventListener("click", newChat);
  $("menu").addEventListener("click", () => $("sidebar").classList.toggle("open"));
  $("language").addEventListener("change", applyLanguage);

  $("suggestions").addEventListener("click", e => {
    const button = e.target.closest("button[data-prompt]");
    if (button) sendMessage(button.dataset.prompt);
  });
  $("messages").addEventListener("click", e => {
    const button = e.target.closest("button[data-prompt]");
    if (button) sendMessage(button.dataset.prompt);
  });

  $("voice").addEventListener("click", () => {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
      $("status").textContent = lang().voiceError;
      return;
    }
    recognition = new SpeechRecognition();
    recognition.lang = {
      te: "te-IN", en: "en-IN", hi: "hi-IN", kn: "kn-IN", ur: "ur-PK"
    }[$("language").value] || "te-IN";
    recognition.onstart = () => $("status").textContent = lang().listening;
    recognition.onresult = e => {
      $("prompt").value = e.results[0][0].transcript;
      $("status").textContent = "";
    };
    recognition.onerror = () => $("status").textContent = lang().voiceError;
    recognition.onend = () => {
      if ($("status").textContent === lang().listening) $("status").textContent = "";
    };
    recognition.start();
  });

  try {
    chats = JSON.parse(localStorage.getItem("sameerChats") || "[]");
  } catch (e) { chats = []; }
  renderHistory();
  applyLanguage();
</script>
</body>
</html>
