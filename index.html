
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080b14">
<title>AI SAMEER</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --bg: #080b14;
  --panel: #111827;
  --border: #263147;
  --text: #f5f7ff;
  --muted: #9ca9c0;
  --blue: #6685ff;
  --purple: #a16bff;
}

body {
  font-family: Arial, sans-serif;
  background:
    radial-gradient(ellipse at 50% 25%, #18234b 0%, transparent 48%),
    var(--bg);
  color: var(--text);
  min-height: 100vh;
  min-height: 100dvh;
}

button, textarea, input {
  font: inherit;
}

button {
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.app {
  width: 100%;
  max-width: 1000px;
  height: 100vh;
  height: 100dvh;
  margin: auto;
  display: flex;
  flex-direction: column;
  padding: 16px;
  gap: 14px;
}

/* HEADER */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 48px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 19px;
  font-weight: 800;
  letter-spacing: 1px;
}

.logo {
  width: 39px;
  height: 39px;
  border-radius: 13px;
  display: grid;
  place-items: center;
  font-size: 21px;
  background: linear-gradient(135deg, #7190ff, #9c5cff);
  box-shadow: 0 0 24px #657fff55;
}

.status {
  display: flex;
  align-items: center;
  gap: 7px;
  color: #9fe9c0;
  font-size: 12px;
}

.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #51e69a;
}

/* MAIN */
.main {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
}

.hero {
  text-align: center;
  margin-bottom: 27px;
}

.ai-icon {
  width: 86px;
  height: 86px;
  border-radius: 28px;
  margin: 0 auto 20px;
  display: grid;
  place-items: center;
  font-size: 43px;
  background: linear-gradient(140deg, #1e315e, #42256d);
  border: 1px solid #778dff66;
  box-shadow: 0 0 60px #695cff25;
}

.hero h1 {
  font-size: clamp(30px, 7vw, 46px);
  font-weight: 800;
  letter-spacing: -1px;
}

.hero h1 span {
  background: linear-gradient(90deg, #83a4ff, #c19aff);
  color: transparent;
  background-clip: text;
  -webkit-background-clip: text;
}

.hero p {
  margin-top: 12px;
  color: var(--muted);
  font-size: 14px;
  line-height: 1.7;
}

/* CHAT */
.chat {
  width: 100%;
  max-width: 760px;
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 15px;
  padding: 8px 2px;
  scrollbar-width: thin;
}

.message {
  max-width: 88%;
  padding: 13px 15px;
  border: 1px solid var(--border);
  border-radius: 17px;
  font-size: 14px;
  line-height: 1.65;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.message.user {
  align-self: flex-end;
  background: #25345c;
  border-color: #405b9c;
  border-bottom-right-radius: 5px;
}

.message.ai {
  align-self: flex-start;
  background: #121a2b;
  border-bottom-left-radius: 5px;
}

.message.error {
  border-color: #75424c;
}

.message img {
  display: block;
  max-width: 100%;
  max-height: 220px;
  margin-top: 10px;
  border-radius: 10px;
}

.message audio {
  max-width: 100%;
  margin-top: 10px;
}

.typing {
  color: var(--muted);
  font-size: 13px;
  padding: 8px;
}

/* COMPOSER */
.composer-wrap {
  width: 100%;
  max-width: 760px;
  margin: 0 auto;
}

.composer {
  padding: 10px;
  background: #111827;
  border: 1px solid #35415b;
  border-radius: 23px;
  box-shadow: 0 10px 45px #0004;
}

textarea {
  display: block;
  width: 100%;
  min-height: 45px;
  max-height: 140px;
  resize: none;
  padding: 12px 10px;
  border: 0;
  outline: none;
  background: transparent;
  color: var(--text);
  font-size: 15px;
  line-height: 1.5;
}

textarea::placeholder {
  color: #8793aa;
}

.tools {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 5px 2px 1px;
}

.tool-btn {
  width: 43px;
  height: 43px;
  flex-shrink: 0;
  border-radius: 14px;
  display: grid;
  place-items: center;
  color: #e3e9ff;
  background: #202a3e;
  border: 1px solid #34415a;
  font-size: 21px;
  transition: 0.2s;
}

.tool-btn:active {
  transform: scale(.94);
}

.tool-btn:hover {
  background: #303e5c;
}

.tool-btn.active {
  background: #713b53;
  border-color: #ff779c;
  color: #fff;
}

.tool-label {
  font-size: 12px;
  color: var(--muted);
  margin-right: auto;
}

.send-btn {
  background: linear-gradient(135deg, #6687ff, #9361f4);
  border: 0;
  color: white;
  font-size: 20px;
}

.send-btn:disabled {
  opacity: .5;
  cursor: not-allowed;
}

.footer {
  text-align: center;
  font-size: 11px;
  color: #77839b;
  padding: 10px 0 2px;
}

/* ATTACHMENT */
#fileInput {
  display: none;
}

.attachments {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  padding: 5px 8px;
}

.file-chip {
  background: #26334e;
  border-radius: 9px;
  padding: 7px 9px;
  font-size: 12px;
  display: flex;
  align-items: center;
  gap: 7px;
}

.file-chip button {
  border: 0;
  background: transparent;
  color: white;
}

/* CONTENTS PANEL */
.overlay {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 20;
  background: #0009;
}

.overlay.show {
  display: block;
}

.drawer {
  position: absolute;
  top: 0;
  right: 0;
  width: min(340px, 88vw);
  height: 100%;
  padding: 22px;
  background: #111827;
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.drawer-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.drawer h2 {
  font-size: 20px;
}

.close-btn {
  width: 37px;
  height: 37px;
  background: #26334a;
  border: 0;
  color: white;
  border-radius: 11px;
  font-size: 21px;
}

.content-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  overflow-y: auto;
}

.content-item {
  text-align: left;
  color: white;
  background: #1b263b;
  border: 1px solid #34415a;
  border-radius: 12px;
  padding: 13px;
  line-height: 1.5;
}

.content-item small {
  color: var(--muted);
}

.empty {
  color: var(--muted);
  font-size: 13px;
  line-height: 1.7;
}

@media (min-width: 700px) {
  .app {
    padding: 22px 28px;
  }
}

@media (max-height: 650px) {
  .hero {
    margin-bottom: 12px;
  }

  .ai-icon {
    width: 58px;
    height: 58px;
    font-size: 30px;
    margin-bottom: 10px;
    border-radius: 19px;
  }

  .hero p {
    margin-top: 5px;
  }
}
</style>
</head>

<body>
<div class="app">

  <header class="header">
    <div class="brand">
      <div class="logo">✦</div>
      <div>AI SAMEER</div>
    </div>

    <div class="status">
      <span class="dot"></span>
      <span>Interface Ready</span>
    </div>
  </header>

  <main class="main">

    <section class="hero" id="hero">
      <div class="ai-icon">✧</div>
      <h1>AI <span>SAMEER</span></h1>
      <p>Your AI assistant, ready to help.<br>
      Type a message or use your microphone.</p>
    </section>

    <section class="chat" id="chat"
      role="log" aria-live="polite" aria-label="Chat messages">
    </section>

    <div class="composer-wrap">
      <div class="composer">

        <div class="attachments" id="attachments"></div>

        <textarea id="prompt"
          rows="1"
          placeholder="Message AI Sameer..."
          aria-label="Write your message"></textarea>

        <div class="tools">
          <button class="tool-btn" id="plusBtn"
            title="Attach a file" aria-label="Attach a file">＋</button>

          <button class="tool-btn" id="contentsBtn"
            title="My Contents" aria-label="My Contents">▤</button>

          <span class="tool-label" id="micStatus">Ready to chat</span>

          <button class="tool-btn" id="micBtn"
            title="Voice input" aria-label="Start microphone">🎙</button>

          <button class="tool-btn send-btn" id="sendBtn"
            title="Send message" aria-label="Send message">➤</button>
        </div>
      </div>

      <input type="file" id="fileInput" multiple
        accept="image/*,.pdf,.txt,.doc,.docx,.csv">

      <div class="footer">
        AI SAMEER · Your personal assistant interface
      </div>
    </div>
  </main>
</div>

<!-- MY CONTENTS -->
<div class="overlay" id="overlay">
  <aside class="drawer" role="dialog"
    aria-modal="true" aria-label="My Contents">
    <div class="drawer-head">
      <h2>My Contents</h2>
      <button class="close-btn" id="closeDrawer"
        aria-label="Close">×</button>
    </div>

    <p class="empty" id="contentsHelp">
      Your saved conversations will appear here.
    </p>

    <div class="content-list" id="contentList"></div>

    <button class="content-item" id="newChatBtn">
      ＋ New Chat
    </button>

    <button class="content-item" id="clearBtn">
      🗑 Clear Chat History
    </button>
  </aside>
</div>

<script>
(function () {
  "use strict";

  const $ = id => document.getElementById(id);

  const promptBox = $("prompt");
  const chat = $("chat");
  const hero = $("hero");
  const sendBtn = $("sendBtn");
  const fileInput = $("fileInput");
  const attachments = $("attachments");
  const micBtn = $("micBtn");
  const micStatus = $("micStatus");
  const overlay = $("overlay");
  const contentList = $("contentList");
  const contentsHelp = $("contentsHelp");

  let selectedFiles = [];
  let recognition = null;
  let isListening = false;
  let busy = false;
  let messages = [];

  // Local conversation history for this browser session.
  try {
    const saved = sessionStorage.getItem("sameer_chat");
    if (saved) messages = JSON.parse(saved);
  } catch (e) {
    messages = [];
  }

  function saveMessages() {
    try {
      sessionStorage.setItem(
        "sameer_chat",
        JSON.stringify(messages.slice(-100))
      );
    } catch (e) {}
  }

  function scrollChat() {
    chat.scrollTop = chat.scrollHeight;
  }

  function addMessage(role, text, files) {
    const item = document.createElement("div");
    item.className = "message " + role;
    item.textContent = text;

    if (files && files.length) {
      files.forEach(file => {
        if (file.type && file.type.startsWith("image/")) {
          const img = document.createElement("img");
          img.alt = file.name;
          img.src = URL.createObjectURL(file);
          item.appendChild(img);
        } else {
          const info = document.createElement("div");
          info.textContent = "📎 " + file.name;
          item.appendChild(info);
        }
      });
    }

    chat.appendChild(item);
    scrollChat();
    return item;
  }

  function renderHistory() {
    chat.replaceChildren();

    messages.forEach(m => {
      addMessage(m.role, m.text);
    });

    hero.style.display = messages.length ? "none" : "block";
    scrollChat();
  }

  function updateContents() {
    contentList.replaceChildren();

    if (!messages.length) {
      contentsHelp.style.display = "block";
      return;
    }

    contentsHelp.style.display = "none";

    const firstUser = messages.find(m => m.role === "user");

    const button = document.createElement("button");
    button.className = "content-item";
    button.textContent = firstUser
      ? firstUser.text.slice(0, 100)
      : "Conversation";

    const small = document.createElement("small");
    small.textContent = messages.length + " messages";
    button.appendChild(document.createElement("br"));
    button.appendChild(small);

    button.addEventListener("click", () => {
      renderHistory();
      overlay.classList.remove("show");
    });

    contentList.appendChild(button);
  }

  function setBusy(value) {
    busy = value;
    sendBtn.disabled = value;
    sendBtn.textContent = value ? "…" : "➤";
  }

  async function sendMessage() {
    if (busy) return;

    const text = promptBox.value.trim();
    const files = selectedFiles.slice();

    if (!text && !files.length) {
      promptBox.focus();
      return;
    }

    hero.style.display = "none";

    const displayText = text || "Please look at the attached file.";
    addMessage("user", displayText, files);

    messages.push({
      role: "user",
      text: displayText
    });
    saveMessages();

    promptBox.value = "";
    promptBox.style.height = "45px";

    selectedFiles = [];
    attachments.replaceChildren();

    setBusy(true);

    const typing = addMessage("ai", "One moment…");

    try {
      /*
       * FRONT-END DEMO:
       * No AI API is connected yet.
       * Replace this section later with your Cloudflare Worker API.
       */
      await new Promise(resolve => setTimeout(resolve, 450));

      typing.textContent =
        "Your message was received successfully! " +
        "The AI interface is working. To receive real AI-generated " +
        "answers, connect your AI API endpoint in this HTML code.";

      messages.push({
        role: "ai",
        text: typing.textContent
      });

      saveMessages();
      updateContents();

    } catch (error) {
      typing.classList.add("error");
      typing.textContent =
        "Something went wrong. Please try again.";
    } finally {
      setBusy(false);
      promptBox.focus();
      scrollChat();
    }
  }

  // Send button
  sendBtn.addEventListener("click", sendMessage);

  // Enter to send; Shift+Enter for a new line.
  promptBox.addEventListener("keydown", event => {
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      sendMessage();
    }
  });

  // Automatically expand the message box.
  promptBox.addEventListener("input", () => {
    promptBox.style.height = "45px";
    promptBox.style.height =
      Math.min(promptBox.scrollHeight, 140) + "px";
  });

  // Plus button: choose photos and files.
  $("plusBtn").addEventListener("click", () => {
    fileInput.click();
  });

  fileInput.addEventListener("change", () => {
    selectedFiles = selectedFiles.concat(
      Array.from(fileInput.files || [])
    );

    renderAttachments();
    fileInput.value = "";
  });

  function renderAttachments() {
    attachments.replaceChildren();

    selectedFiles.forEach((file, index) => {
      const chip = document.createElement("div");
      chip.className = "file-chip";

      const name = document.createElement("span");
      name.textContent = "📎 " + file.name.slice(0, 24);

      const remove = document.createElement("button");
      remove.type = "button";
      remove.textContent = "×";
      remove.setAttribute("aria-label", "Remove " + file.name);

      remove.addEventListener("click", () => {
        selectedFiles.splice(index, 1);
        renderAttachments();
      });

      chip.append(name, remove);
      attachments.appendChild(chip);
    });
  }

  // My Contents panel.
  $("contentsBtn").addEventListener("click", () => {
    updateContents();
    overlay.classList.add("show");
  });

  $("closeDrawer").addEventListener("click", () => {
    overlay.classList.remove("show");
  });

  overlay.addEventListener("click", event => {
    if (event.target === overlay) {
      overlay.classList.remove("show");
    }
  });

  $("newChatBtn").addEventListener("click", () => {
    messages = [];
    saveMessages();
    chat.replaceChildren();
    hero.style.display = "block";
    overlay.classList.remove("show");
    updateContents();
    promptBox.focus();
  });

  $("clearBtn").addEventListener("click", () => {
    if (!confirm("Clear all saved chat history?")) return;

    messages = [];
    saveMessages();
    chat.replaceChildren();
    hero.style.display = "block";
    updateContents();
  });

  // Microphone: use the browser's speech recognition.
  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = "te-IN";
    recognition.continuous = false;
    recognition.interimResults = true;

    recognition.onstart = () => {
      isListening = true;
      micBtn.classList.add("active");
      micStatus.textContent = "Listening…";
    };

    recognition.onresult = event => {
      let transcript = "";

      for (let i = event.resultIndex;
           i < event.results.length; i++) {
        transcript += event.results[i][0].transcript;
      }

      promptBox.value = transcript;
      promptBox.dispatchEvent(new Event("input"));
    };

    recognition.onerror = event => {
      micStatus.textContent =
        event.error === "not-allowed"
          ? "Allow microphone access"
          : "Voice input unavailable";
    };

    recognition.onend = () => {
      isListening = false;
      micBtn.classList.remove("active");

      if (micStatus.textContent === "Listening…") {
        micStatus.textContent = "Ready to chat";
      }
    };

    micBtn.addEventListener("click", () => {
      if (isListening) {
        recognition.stop();
        return;
      }

      try {
        recognition.start();
      } catch (error) {
        micStatus.textContent = "Please try again";
      }
    });
  } else {
    micBtn.addEventListener("click", () => {
      micStatus.textContent =
        "Voice recognition is not supported in this browser";
    });
  }

  renderHistory();
  updateContents();
})();
</script>
</body>
</html>
