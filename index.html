
<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07111f">
<title>AI Sameer</title>

<style>
:root {
  --bg:#07111f;
  --panel:#0d1b2d;
  --panel2:#142840;
  --line:#263d57;
  --text:#f3f7ff;
  --muted:#9aafc8;
  --blue:#48b9ff;
  --cyan:#55edda;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:Arial,sans-serif;height:100dvh;overflow:hidden
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
button:focus-visible,textarea:focus-visible,select:focus-visible{
  outline:2px solid var(--blue);outline-offset:2px
}
.app{height:100%;display:flex;flex-direction:column}
.topbar{
  height:64px;flex-shrink:0;display:flex;align-items:center;
  justify-content:space-between;padding:0 14px;
  border-bottom:1px solid var(--line);background:#091626
}
.brand{display:flex;align-items:center;gap:10px;font-weight:bold}
.logo{
  height:38px;width:38px;display:grid;place-items:center;
  border-radius:13px;background:linear-gradient(135deg,#168aff,#55edda);
  color:#061323;font-size:23px
}
.top-actions{display:flex;align-items:center;gap:8px}
.icon-btn,.round{
  border:1px solid var(--line);background:var(--panel2);
  color:var(--text);display:grid;place-items:center
}
.icon-btn{width:42px;height:42px;border-radius:13px;font-size:20px}
.model-select{
  background:var(--panel2);color:var(--text);
  border:1px solid var(--line);border-radius:12px;padding:10px;
  max-width:145px
}
.workspace{display:flex;flex:1;min-height:0;position:relative}
.sidebar{
  width:255px;flex-shrink:0;background:#091626;
  border-right:1px solid var(--line);padding:14px;
  display:flex;flex-direction:column;gap:7px;overflow:auto
}
.side-brand{display:flex;align-items:center;gap:10px;padding:8px 4px 16px}
.side-brand small{display:block;color:var(--muted);margin-top:4px}
.side-btn{
  display:flex;align-items:center;gap:12px;width:100%;
  text-align:left;padding:12px;border-radius:12px;
  color:var(--text);background:transparent;border:1px solid transparent
}
.side-btn:hover,.side-btn.active{background:var(--panel2);border-color:var(--line)}
.side-btn span:first-child{width:22px;text-align:center}
.side-bottom{margin-top:auto;border-top:1px solid var(--line);padding-top:12px}
.account{font-size:13px;color:var(--muted);padding:12px 8px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.chat{flex:1;min-height:0;overflow-y:auto;padding:20px 14px}
.welcome{
  min-height:100%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;padding:16px
}
.banana{
  font-size:76px;animation:bananaFloat 2s ease-in-out infinite;
  filter:drop-shadow(0 0 22px #ffd54f30)
}
@keyframes bananaFloat{
  0%,100%{transform:translateY(0) rotate(-4deg)}
  50%{transform:translateY(-12px) rotate(4deg)}
}
.welcome h1{font-size:clamp(28px,4vw,44px);margin:18px 0 8px}
.gradient{
  background:linear-gradient(90deg,#51baff,#55edda);
  color:transparent;background-clip:text;-webkit-background-clip:text
}
.welcome p{color:var(--muted);margin:0 0 24px}
.suggestions{display:flex;flex-wrap:wrap;justify-content:center;gap:9px}
.suggestion{
  padding:11px 14px;border-radius:14px;background:var(--panel);
  color:var(--text);border:1px solid var(--line)
}
.suggestion:hover{border-color:var(--blue)}
.messages{max-width:850px;margin:auto;display:flex;flex-direction:column;gap:18px}
.message{display:flex;flex-direction:column;gap:7px}
.message.user{align-items:flex-end}
.bubble{
  max-width:min(90%,700px);padding:13px 16px;border-radius:17px;
  white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65
}
.user .bubble{background:#123e62;border:1px solid #28618b}
.assistant .bubble{background:#0d1b2d;border:1px solid var(--line)}
.message img{max-width:280px;max-height:240px;object-fit:contain;border-radius:12px}
.message-actions{display:flex;gap:6px;flex-wrap:wrap}
.message-actions button{
  background:transparent;color:var(--muted);
  border:1px solid var(--line);border-radius:9px;padding:6px 9px
}
.composer-area{padding:10px 15px 15px}
.composer-wrap{max-width:850px;margin:auto;position:relative}
.composer{
  display:flex;align-items:flex-end;gap:9px;padding:10px;
  background:#0e1d30;border:1px solid #2c4763;border-radius:24px
}
.composer textarea{
  flex:1;min-width:0;max-height:140px;resize:none;
  background:transparent;color:var(--text);border:0;outline:none;
  padding:11px 2px;line-height:1.5
}
.composer textarea::placeholder{color:#8fa6bf}
.round{width:43px;height:43px;flex-shrink:0;border-radius:50%;font-size:20px}
.send{background:linear-gradient(135deg,#188aff,#55edda);color:#061323;border:0}
.send:disabled{opacity:.5}
.disclaimer{text-align:center;font-size:11px;color:#71869e;margin-top:9px}
.menu{
  position:absolute;bottom:68px;left:0;width:min(300px,90vw);
  padding:8px;background:#102137;border:1px solid var(--line);
  border-radius:16px;box-shadow:0 15px 50px #0008;z-index:25
}
.menu button{
  display:block;width:100%;text-align:left;padding:12px;
  border:0;border-radius:10px;background:transparent;color:var(--text)
}
.menu button:hover{background:var(--panel2)}
.hidden{display:none!important}
.overlay{
  position:fixed;inset:0;background:#0009;z-index:50;
  display:flex;align-items:center;justify-content:center;padding:14px
}
.dialog{
  width:min(560px,100%);max-height:85dvh;overflow:auto;
  background:#0d1b2d;border:1px solid var(--line);
  border-radius:19px;padding:20px
}
.dialog h2{margin:0 0 16px}
.dialog input,.dialog textarea{
  width:100%;padding:12px;margin:7px 0;
  background:var(--bg);color:var(--text);
  border:1px solid var(--line);border-radius:10px
}
.primary,.secondary,.danger{
  border-radius:10px;padding:10px 13px;
  border:1px solid var(--line);color:var(--text);background:var(--panel2)
}
.primary{background:#168aff;color:white}
.danger{color:#ffb1b1}
.list-item{
  display:flex;gap:9px;align-items:center;
  padding:11px 0;border-bottom:1px solid var(--line)
}
.item-title{flex:1;min-width:0;overflow-wrap:anywhere}
.list-item small{display:block;color:var(--muted);margin-top:4px}
.list-item img{width:48px;height:48px;object-fit:cover;border-radius:8px}
.toast{
  position:fixed;bottom:100px;left:50%;transform:translateX(-50%);
  background:#e5f5ff;color:#07111f;padding:11px 16px;
  border-radius:12px;z-index:100;max-width:90vw
}
@media(max-width:760px){
  .sidebar{
    position:fixed;top:64px;bottom:0;left:0;width:min(285px,85vw);
    z-index:40;transform:translateX(-110%);
    transition:transform .2s;box-shadow:10px 0 40px #0005
  }
  .sidebar.open{transform:translateX(0)}
  .topbar{padding:0 9px}
  .model-select{max-width:112px;padding:9px 4px}
  .chat{padding:14px 10px}
  .composer-area{padding:8px 9px 12px}
  .bubble{max-width:95%}
}
</style>
</head>

<body>
<div class="app">
  <header class="topbar">
    <div class="top-actions">
      <button class="icon-btn" id="sidebarToggle" aria-label="Menu">☰</button>
      <div class="brand"><div class="logo">✦</div><span>AI Sameer</span></div>
    </div>
    <div class="top-actions">
      <select class="model-select" id="modelSelect" aria-label="Model">
        <option value="default">AI Sameer ▾</option>
        <option value="creative">Creative</option>
        <option value="quick">Quick Answer</option>
        <option value="learning">Learning</option>
      </select>
      <button class="icon-btn" id="newChatTop" title="New Chat">＋</button>
    </div>
  </header>

  <div class="workspace">
    <aside class="sidebar" id="sidebar">
      <div class="side-brand">
        <div class="logo">✦</div>
        <div><strong>AI Sameer</strong><small>Your AI companion</small></div>
      </div>

      <button class="side-btn" data-action="new"><span>＋</span>New Chat</button>
      <button class="side-btn" data-action="search"><span>⌕</span>Search Chats</button>
      <button class="side-btn" data-action="contents"><span>▤</span>My Contents</button>
      <button class="side-btn" data-action="images"><span>▧</span>Images / Photos</button>
      <button class="side-btn" data-action="library"><span>▣</span>Library</button>
      <button class="side-btn" data-action="settings"><span>⚙</span>Settings</button>
      <button class="side-btn" data-action="help"><span>?</span>Help & Feedback</button>

      <div class="side-bottom">
        <button class="side-btn" data-action="account"><span>👤</span>Account</button>
        <div class="account">Shaik Mahammad<br>AI Sameer User</div>
      </div>
    </aside>

    <main class="main">
      <section class="chat" id="chat">
        <div class="welcome" id="welcome">
          <div class="banana">🍌</div>
          <h1>Hi! I am <span class="gradient">AI Sameer</span></h1>
          <p>ఈరోజు మనం దేనిపై దృష్టి పెట్టాలి?</p>
          <div class="suggestions">
            <button class="suggestion" data-prompt="ఒక మంచి YouTube వీడియో ఐడియా ఇవ్వండి">🎬 వీడియో ఐడియా</button>
            <button class="suggestion" data-prompt="నాకు ఒక మంచి కథ రాయండి">✍️ కథ రాయండి</button>
            <button class="suggestion" data-prompt="నాకు ఇంగ్లీష్ నేర్పించండి">📚 నేర్చుకోవడం</button>
            <button class="suggestion" data-prompt="ఒక AI ఫోటో కోసం మంచి prompt రాయండి">🖼️ AI Photo Prompt</button>
          </div>
        </div>
        <div class="messages" id="messages"></div>
      </section>

      <section class="composer-area">
        <div class="composer-wrap">
          <div class="menu hidden" id="plusMenu">
            <button data-plus="photos">🖼️ Photos / Images</button>
            <button data-plus="camera">📷 Camera</button>
            <button data-plus="avatar">👤 Avatar</button>
            <button data-plus="music">🎵 Music</button>
            <button data-plus="canvas">▧ Canvas</button>
            <button data-plus="research">🔎 Deep Research</button>
            <button data-plus="learning">📘 Guided Learning</button>
            <button data-plus="personal">✦ Personal Intelligence</button>
          </div>

          <div class="composer">
            <button class="round" id="plusBtn" title="More options">＋</button>
            <textarea id="messageInput" rows="1" placeholder="AI Sameer ని ఏదైనా అడగండి..." aria-label="Message"></textarea>
            <button class="round" id="micBtn" title="Voice typing">🎙</button>
            <button class="round send" id="sendBtn" title="Send">➤</button>
          </div>
          <div class="disclaimer">AI Sameer తప్పులు చేయవచ్చు. ముఖ్యమైన సమాచారాన్ని తనిఖీ చేయండి.</div>
        </div>
      </section>
    </main>
  </div>
</div>

<input type="file" id="photoPicker" accept="image/*" multiple hidden>
<input type="file" id="cameraPicker" accept="image/*" capture="environment" hidden>
<div id="modalRoot"></div>
<div id="toast" class="toast hidden" role="status"></div>

<script>
"use strict";

/* Cloudflare Worker API URL */
const API_URL = "https://ai-sameer-api.shaikmahammed757.workers.dev";

const $ = id => document.getElementById(id);
const sidebar = $("sidebar");
const chat = $("chat");
const messages = $("messages");
const welcome = $("welcome");
const input = $("messageInput");
const sendBtn = $("sendBtn");
const plusMenu = $("plusMenu");
const photoPicker = $("photoPicker");
const cameraPicker = $("cameraPicker");
const modalRoot = $("modalRoot");
const toastEl = $("toast");

const KEYS = {
  chats: "ai_sameer_chats_v1",
  images: "ai_sameer_images_v1"
};

let currentId = makeId();
let currentMessages = [];
let selectedImages = [];
let toastTimer;

function makeId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function loadData(key, fallback) {
  try {
    return JSON.parse(localStorage.getItem(key)) || fallback;
  } catch {
    return fallback;
  }
}

function saveData(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(value));
    return true;
  } catch {
    showToast("స్టోరేజ్ నిండింది. కొన్ని పాత ఫోటోలను తొలగించండి.");
    return false;
  }
}

function showToast(text) {
  toastEl.textContent = text;
  toastEl.classList.remove("hidden");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.add("hidden"), 3200);
}

function closeSidebar() {
  sidebar.classList.remove("open");
}

$("sidebarToggle").addEventListener("click", () => {
  sidebar.classList.toggle("open");
});

function closePlusMenu() {
  plusMenu.classList.add("hidden");
}

$("plusBtn").addEventListener("click", event => {
  event.stopPropagation();
  plusMenu.classList.toggle("hidden");
});

document.addEventListener("click", event => {
  if (!plusMenu.contains(event.target) && event.target !== $("plusBtn")) {
    closePlusMenu();
  }
});

function saveCurrentChat() {
  if (!currentMessages.length) return;

  const chats = loadData(KEYS.chats, []);
  const first = currentMessages.find(item => item.role === "user");

  const record = {
    id: currentId,
    title: (first?.text || "కొత్త చాట్").slice(0, 70),
    updatedAt: Date.now(),
    messages: currentMessages
  };

  const index = chats.findIndex(item => item.id === currentId);
  if (index >= 0) chats[index] = record;
  else chats.unshift(record);

  chats.sort((a, b) => b.updatedAt - a.updatedAt);
  saveData(KEYS.chats, chats.slice(0, 80));
}

function renderConversation() {
  messages.replaceChildren();
  welcome.classList.toggle("hidden", currentMessages.length > 0);
  currentMessages.forEach(item => renderMessage(item, false));
  chat.scrollTop = chat.scrollHeight;
}

function renderMessage(item, scroll = true) {
  welcome.classList.add("hidden");

  const wrapper = document.createElement("div");
  wrapper.className = "message " + item.role;

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = item.text || "";
  wrapper.appendChild(bubble);

  if (item.imageData) {
    const image = document.createElement("img");
    image.src = item.imageData;
    image.alt = "ఎంచుకున్న ఫోటో";
    wrapper.appendChild(image);
  }

  if (item.role === "assistant") {
    const actions = document.createElement("div");
    actions.className = "message-actions";

    const copy = document.createElement("button");
    copy.textContent = "📋 Copy";
    copy.addEventListener("click", () => copyText(item.text || ""));

    const like = document.createElement("button");
    const dislike = document.createElement("button");

    function updateFeedback() {
      like.textContent = item.feedback === "like" ? "👍 Selected" : "👍";
      dislike.textContent = item.feedback === "dislike" ? "👎 Selected" : "👎";
    }

    like.addEventListener("click", () => {
      item.feedback = item.feedback === "like" ? "" : "like";
      updateFeedback();
      saveCurrentChat();
    });

    dislike.addEventListener("click", () => {
      item.feedback = item.feedback === "dislike" ? "" : "dislike";
      updateFeedback();
      saveCurrentChat();
    });

    updateFeedback();
    actions.append(copy, like, dislike);
    wrapper.appendChild(actions);
  }

  messages.appendChild(wrapper);
  if (scroll) chat.scrollTop = chat.scrollHeight;
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    showToast("కాపీ అయింది.");
  } catch {
    const temp = document.createElement("textarea");
    temp.value = text;
    document.body.appendChild(temp);
    temp.select();
    try {
      document.execCommand("copy");
      showToast("కాపీ అయింది.");
    } catch {
      showToast("కాపీ చేయలేకపోయాను.");
    }
    temp.remove();
  }
}

function addMessage(role, text, imageData = null) {
  const item = {
    id: makeId(),
    role,
    text,
    imageData,
    time: Date.now()
  };
  currentMessages.push(item);
  renderMessage(item);
  saveCurrentChat();
  return item;
}

async function askAISameer(message) {
  const response = await fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      message,
      model: $("modelSelect").value
    })
  });

  let data;
  try {
    data = await response.json();
  } catch {
    throw new Error("API నుంచి సరైన సమాధానం రాలేదు.");
  }

  if (!response.ok || data.success === false) {
    throw new Error(data.error || "AI API లో సమస్య వచ్చింది.");
  }

  const answer = data.answer || data.response || data.text;
  if (!answer) throw new Error("AI సమాధానం ఖాళీగా వచ్చింది.");
  return String(answer);
}

async function sendMessage() {
  const text = input.value.trim();

  if (!text && !selectedImages.length) {
    showToast("మెసేజ్ టైప్ చేయండి లేదా ఫోటో ఎంచుకోండి.");
    return;
  }

  const image = selectedImages.shift() || null;
  const userText = text || "ఈ ఫోటోను చూడండి.";

  input.value = "";
  resizeInput();
  closePlusMenu();
  sendBtn.disabled = true;

  addMessage("user", userText, image);

  const waiting = addMessage("assistant", "AI Sameer సమాధానం సిద్ధం చేస్తోంది…");

  try {
    let prompt = userText;

    if (image) {
      prompt += "\nగమనిక: ఒక ఫోటో జోడించబడింది. ప్రస్తుత Worker టెక్స్ట్‌ను మాత్రమే AI provider‌కు పంపుతుంది. ఫోటోను విశ్లేషించడానికి vision API కనెక్షన్ అవసరం.";
    }

    waiting.text = await askAISameer(prompt);
  } catch (error) {
    waiting.text = "సమాధానం పొందలేకపోయాను.\n" +
      error.message +
      "\n\nCloudflare Worker Deploy అయిందో, AI_API_KEY, AI_API_URL, AI_MODEL సెట్ చేశారో తనిఖీ చేయండి.";
  }

  renderConversation();
  saveCurrentChat();
  sendBtn.disabled = false;
  input.focus();
}

$("sendBtn").addEventListener("click", sendMessage);

input.addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
});

function resizeInput() {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 140) + "px";
}

input.addEventListener("input", resizeInput);

function newChat() {
  saveCurrentChat();
  currentId = makeId();
  currentMessages = [];
  selectedImages = [];
  input.value = "";
  resizeInput();
  renderConversation();
  closePlusMenu();
  closeSidebar();
  showToast("కొత్త చాట్ ప్రారంభమైంది.");
}

$("newChatTop").addEventListener("click", newChat);

document.querySelectorAll("[data-prompt]").forEach(button => {
  button.addEventListener("click", () => {
    input.value = button.dataset.prompt;
    resizeInput();
    input.focus();
  });
});

/* Photos and camera */
function readImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(new Error("ఫోటో తెరవలేకపోయాను."));
    reader.readAsDataURL(file);
  });
}

async function handleFiles(fileList) {
  const files = Array.from(fileList || [])
    .filter(file => file.type.startsWith("image/"));

  if (!files.length) {
    showToast("ఫోటోను ఎంచుకోండి.");
    return;
  }

  for (const file of files) {
    try {
      const data = await readImage(file);
      selectedImages.push(data);

      // Save only smaller images to avoid filling browser storage.
      if (data.length < 500000) {
        const images = loadData(KEYS.images, []);
        images.unshift({
          id: makeId(),
          name: file.name,
          dataUrl: data,
          time: Date.now()
        });
        saveData(KEYS.images, images.slice(0, 12));
      }
    } catch {
      showToast("ఫోటో చదవలేకపోయాను.");
    }
  }

  showToast("ఫోటో ఎంచుకున్నారు. మెసేజ్‌తో పాటు Send నొక్కండి.");
}

$("photoPicker").addEventListener("change", async event => {
  await handleFiles(event.target.files);
