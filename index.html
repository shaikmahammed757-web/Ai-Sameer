<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sameer Puzzle</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            color: #333333;
            font-family: Arial, sans-serif;
            text-align: center;
            height: 100%;
        }
        .header-title {
            background-color: #111122;
            color: #00ffff;
            font-size: 15px;
            font-weight: bold;
            padding: 6px;
            letter-spacing: 1px;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #e6f0ff;
            padding: 10px 15px;
            border-bottom: 2px solid #b3d1ff;
        }
        .balance-box {
            font-weight: bold;
            font-size: 16px;
            color: #000;
        }
        .withdraw-btn {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        .info-bar {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background-color: #f8f9fa;
            padding: 8px;
            border-bottom: 1px solid #ddd;
            font-size: 14px;
        }
        .hearts {
            color: #ff3366;
            font-size: 16px;
        }
        canvas {
            display: block;
            margin: 10px auto;
            background-color: #ffffff;
            border: 2px solid #333333;
            border-radius: 8px;
        }
        .popup-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            justify-content: center;
            align-items: center;
        }
        .popup-card {
            background: #ffffff;
            color: #000;
            width: 85%;
            max-width: 340px;
            padding: 20px;
            border-radius: 16px;
            border: 2px solid #ddd;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            text-align: center;
        }
        .money-text {
            color: #28a745;
            font-size: 20px;
            font-weight: bold;
        }
        .btn-double {
            background: #ffc107;
            color: #000;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            margin-top: 15px;
            cursor: pointer;
        }
        .btn-next {
            background: #00bcd4;
            color: #fff;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            margin-top: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header-title">SAMEER PUZZLE - FLOW ADVENTURE</div>

    <div class="top-bar">
        <div class="balance-box" id="walletBalance">₹0.00</div>
        <button class="withdraw-btn" onclick="alert('KYC Required for Withdrawal!')">Withdraw</button>
    </div>

    <div class="info-bar">
        <div class="hearts">❤️❤️❤️</div>
        <div style="font-weight: bold;" id="levelDisplay">Level 1</div>
        <div style="color: #666;" id="linesCount">6/6 lines</div>
    </div>

    <canvas id="puzzleCanvas" width="340" height="360"></canvas>

    <div class="popup-overlay" id="winPopup">
        <div class="popup-card">
            <div style="font-size: 35px;">🏆</div>
            <h3>STAGE CLEARED</h3>
            <p style="color: #666; font-size: 13px;" id="popupLevelText">Level 1 Completed!</p>
            
            <div style="background: #f1f3f5; padding: 10px; border-radius: 8px; margin: 15px 0;">
                <div style="font-size: 12px; color: #555;">Earned Reward</div>
                <div class="money-text" id="rewardText">+₹0.50</div>
            </div>

            <button class="btn-double" id="doubleBtn" onclick="doubleReward()">WATCH AD TO DOUBLE (+₹1.00)</button>
            <button class="btn-next" onclick="nextLevel()">NEXT STAGE ➔</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('puzzleCanvas');
        const ctx = canvas.getContext('2d');

        let currentLevel = 1;
        let totalBalance = 0.00;
        let currentReward = 0.50;

        // బోర్డు నిండా ఉండే పూర్తి స్థాయి లైన్లు మరియు బాణాలు
        let levelDesigns = [
            // Level 1 Paths
            [
                { points: [{x: 40, y: 40}, {x: 160, y: 40}, {x: 160, y: 120}, {x: 80, y: 120}], dir: 'LEFT' },
                { points: [{x: 200, y: 40}, {x: 280, y: 40}, {x: 280, y: 160}, {x: 200, y: 160}], dir: 'LEFT' },
                { points: [{x: 40, y: 200}, {x: 120, y: 200}, {x: 120, y: 280}, {x: 240, y: 280}], dir: 'RIGHT' },
                { points: [{x: 300, y: 100}, {x: 300, y: 240}, {x: 180, y: 240}], dir: 'LEFT' },
                { points: [{x: 40, y: 320}, {x: 160, y: 320}, {x: 160, y: 300}], dir: 'UP' }
            ],
            // Level 2 Paths
            [
                { points: [{x: 60, y: 60}, {x: 220, y: 60}, {x: 220, y: 140}, {x: 100, y: 140}], dir: 'LEFT' },
                { points: [{x: 280, y: 60}, {x: 280, y: 200}, {x: 140, y: 200}], dir: 'LEFT' },
                { points: [{x: 60, y: 260}, {x: 180, y: 260}, {x: 180, y: 320}, {x: 280, y: 320}], dir: 'RIGHT' }
            ]
        ];

        let activePaths = [];

        function loadLevel() {
            let index = (currentLevel - 1) % levelDesigns.length;
            activePaths = JSON.parse(JSON.stringify(levelDesigns[index]));
            document.getElementById('levelDisplay').innerText = "Level " + currentLevel;
            document.getElementById('linesCount').innerText = activePaths.length + "/" + activePaths.length + " lines";
            drawGame();
        }

        function drawGame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // గ్రిడ్ డాట్స్
            ctx.fillStyle = '#bbbbbb';
            for (let x = 40; x < canvas.width; x += 40) {
                for (let y = 40; y < canvas.height; y += 40) {
                    ctx.fillRect(x, y, 2, 2);
                }
            }

            // నల్లటి లైన్లు మరియు బాణాలు
            activePaths.forEach((item) => {
                ctx.strokeStyle = '#111111';
                ctx.lineWidth = 4;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
