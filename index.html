
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>AI Sameer</title>

<style>
*{box-sizing:border-box}
:root{
  color-scheme:dark;
  --bg:#000;
  --panel:#1d1d1f;
  --border:#303036;
  --text:#f5f5f7;
  --muted:#a1a1aa;
  --blue:#536dfe;
}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
  min-height:100dvh;overflow:hidden;
}
button,input,textarea{font:inherit}
button{cursor:pointer;color:inherit}
button:focus-visible,textarea:focus-visible{
  outline:2px solid #8ca0ff;outline-offset:3px
}
.topbar{
  height:72px;display:flex;align-items:center;
  padding:0 18px;gap:18px;border-bottom:1px solid #202024;
}
.icon-btn{
  border:0;background:transparent;border-radius:50%;
  min-width:46px;min-height:46px;font-size:27px;
  display:grid;place-items:center;
}
.brand{font-size:25px;font-weight:700;flex:1}
.chat-area{
  position:absolute;top:73px;bottom:205px;
  left:0;right:0;overflow-y:auto;padding:20px 16px;
}
.welcome{
  position:absolute;left:18px;right:18px;top:50%;
  transform:translateY(-50%);text-align:center;
}
.logo{
  width:76px;height:76px;margin:0 auto 25px;
  background:linear-gradient(135deg,#45d7a0,#4d91ff,#9a63ff);
  clip-path:polygon(50% 0%,63% 37%,100% 50%,63% 63%,
  50% 100%,37% 63%,0% 50%,37% 37%);
}
.welcome h1{font-size:34px;margin:0 0 14px;letter-spacing:-1px}
.welcome p{color:var(--muted);font-size:16px;line-height:1.6}
.message{margin:12px 0 22px;display:flex;flex-direction:column;gap:9px}
.user-msg{
  align-self:flex-end;background:#202638;border-radius:24px 24px 5px 24px;
  padding:14px 17px;max-width:88%;white-space:pre-wrap;
  overflow-wrap:anywhere;line-height:1.55
}
.answer{
  align-self:stretch;line-height:1.75;white-space:pre-wrap;
  overflow-wrap:anywhere;font-size:16px;padding:8px 2px;
}
.answer-actions{
  display:flex;gap:12px;flex-wrap:wrap;
  border-top:1px solid #29292d;padding-top:12px;
}
.small-btn{
  border:0;background:transparent;padding:8px;font-size:20px;
  border-radius:12px;
}
.small-btn:hover,.icon-btn:hover{background:#29292d}
.composer{
  position:absolute;bottom:20px;left:16px;right:16px;
  background:var(--panel);border:1px solid var(--border);
  border-radius:32px;padding:16px 14px 12px;
  box-shadow:0 0 0 1px #171719;
}
#prompt{
  display:block;width:100%;resize:none;min-height:48px;max-height:120px;
  background:transparent;border:0;color:white;outline:none;
  padding:8px 10px;font-size:17px;line-height:1.5;
}
#prompt::placeholder{color:#a0a0a5}
.controls{display:flex;align-items:center;gap:10px;margin-top:7px}
.round{
  flex:0 0 48px;width:48px;height:48px;border:0;
  border-radius:50%;display:grid;place-items:center;
  background:transparent;font-size:27px;
}
.round:hover{background:#333338}
#sendBtn{
  margin-left:auto;background:var(--blue);color:#050714;
  font-size:25px;font-weight:bold;
}
#sendBtn:disabled{opacity:.55}
#micBtn.listening{background:#633c43}
.status{font-size:12px;color:var(--muted);padding:5px 10px}
#fileInput{display:none}
.overlay{
  display:none;position:fixed;inset:0;background:#0009;z-index:5;
}
.overlay.open{display:block}
.drawer{
  position:absolute;left:0;right:0;bottom:0;max-height:82dvh;
  overflow:auto;background:#1d1d1f;border:1px solid #39393e;
  border-radius:30px 30px 0 0;padding:15px 18px 28px;
}
.handle{width:64px;height:5px;border-radius:10px;background:#777;margin:0 auto 24px}
.drawer-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.drawer-head h2{font-size:21px;margin:0}
.feature-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.feature{
  min-height:104px;border:0;border-radius:25px;background:#29292b;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:9px;font-size:15px;padding:10px 4px;
}
.feature span:first-child{font-size:29px}
.feature-list{margin-top:15px;display:grid;gap:4px}
.feature-row{
  width:100%;display:flex;gap:18px;align-items:center;text-align:left;
  background:transparent;border:0;border-radius:16px;padding:13px 10px;
}
.feature-row:hover{background:#29292b}
.feature-icon{font-size:25px;width:38px;text-align:center}
.feature-row strong{display:block;font-weight:500;font-size:16px}
.feature-row small{display:block;color:var(--muted);margin-top:5px;font-size:13px}
.toast{
  position:fixed;bottom:190px;left:50%;transform:translateX(-50%);
  background:#333;color:white;padding:11px 16px;border-radius:15px;
  display:none;z-index:10;max-width:90%;text-align:center;
}
.toast.show{display:block}
@media(min-width:700px){
  .topbar{padding:0 28px}
  .chat-area{left:calc((100% - 760px)/2);right:calc((100% - 760px)/2)}
  .composer{max-width:760px;left:50%;right:auto;width:calc(100% - 32px);transform:translateX(-50%)}
}
</style>
</head>

<body>

<header class="topbar">
  <button class="icon-btn" id="menuBtn" aria-label="Open menu">☰</button>
  <div class="brand">AI Sameer</div>
  <button class="icon-btn" id="newChatBtn" aria-label="New chat">✎</button>
</header>

<main class="chat-area" id="chatArea">
  <section class="welcome" id="welcome">
    <div class="logo" aria-label="AI Sameer logo"></div>
    <h1>AI Sameer</h1>
    <p>Ask anything. Let's figure it out together.</p>
  </section>
  <div id="messages"></div>
</main>

<section class="composer" aria-label="Message composer">
  <textarea id="prompt" rows="1" placeholder="Ask AI Sameer..."
    aria-label="Ask AI Sameer"></textarea>

  <div class="controls">
    <button class="round" id="plusBtn" aria-label="Add content" title="Add content">+</button>
    <button class="round" id="micBtn" aria-label="Voice input" title="Voice input">🎙️</button>
    <button class="round" id="shareBtn" aria-label="Share" title="Share">↗</button>
    <button class="round" id="sendBtn" aria-label="Send message" title="Send">➤</button>
  </div>
  <div class="status" id="status" aria-live="polite"></div>
</section>

<input id="fileInput" type="file" accept="image/*,.pdf,.txt,.doc,.docx" multiple>
<input id="cameraInput" type="file" accept="image/*" capture="environment" hidden>

<div class="overlay" id="featureOverlay">
  <section class="drawer" role="dialog" aria-modal="true" aria-label="AI Sameer features">
    <div class="handle"></div>
    <div class="drawer-head">
      <h2>AI Sameer</h2>
      <button class="icon-btn" id="closeFeatures" aria-label="Close">✕</button>
    </div>

    <div class="feature-grid">
      <button class="feature" data-feature="Photos"><span>🖼️</span><span>Photos</span></button>
      <button class="feature" data-feature="Camera"><span>📸</span><span>Camera</span></button>
      <button class="feature" data-feature="Avatar"><span>😊</span><span>Avatar</span></button>
    </div>

    <div class="feature-list">
      <button class="feature-row" data-feature="Images">
        <span class="feature-icon">🎨</span>
        <span><strong>Images</strong><small>Create and edit images with an image AI backend</small></span>
      </button>
      <button class="feature-row" data-feature="Music">
        <span class="feature-icon">🎵</span>
        <span><strong>Music</strong><small>Music creation feature</small></span>
      </button>
      <button class="feature-row" data-feature="Canvas">
        <span class="feature-icon">▣</span>
        <span><strong>Canvas</strong><small>Code, write or make slides</small></span>
      </button>
      <button class="feature-row" data-feature="Deep Research">
        <span class="feature-icon">◎</span>
        <span><strong>Deep Research</strong><small>Research with reliable sources</small></span>
      </button>
      <button class="feature-row" data-feature="Guided Learning">
        <span class="feature-icon">📖</span>
        <span><strong>Guided Learning</strong><small>Get step-by-step help</small></span>
      </button>
    </div>
  </section>
</div>

<div class="toast" id="toast" role="status"></div>

<script>
"use strict";

/*
 IMPORTANT:
 This is the FRONTEND. For real AI answers, connect your secure
 Cloudflare Worker endpoint below. Never put an OpenAI API key here.
 Your Worker must accept POST JSON {message:"..."} and return JSON
 containing {answer:"..."} or {choices:[{message:{content:"..."}}]}.
*/
const API_URL = "PASTE_YOUR_CLOUDFLARE_WORKER_CHAT_URL_HERE";

const $ = id => document.getElementById(id);
const promptBox = $("prompt");
const messages = $("messages");
const welcome = $("welcome");
const statusBox = $("status");
let selectedFiles = [];
let lastAnswer = "";
let busy = false;
let recognition = null;

function toast(message){
  const el = $("toast");
  el.textContent = message;
  el.classList.add("show");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(()=>el.classList.remove("show"),3000);
}

function openFeatures(){
  $("featureOverlay").classList.add("open");
}
function closeFeatures(){
  $("featureOverlay").classList.remove("open");
}
$("plusBtn").addEventListener("click",openFeatures);
$("closeFeatures").addEventListener("click",closeFeatures);
$("featureOverlay").addEventListener("click",e=>{
  if(e.target === $("featureOverlay")) closeFeatures();
});
$("menuBtn").addEventListener("click",openFeatures);

function addMessage(text, type){
  welcome.style.display = "none";
  const wrap = document.createElement("article");
  wrap.className = "message";

  if(type === "user"){
    const bubble = document.createElement("div");
    bubble.className = "user-msg";
    bubble.textContent = text;
    wrap.appendChild(bubble);
  } else {
    const answer = document.createElement("div");
    answer.className = "answer";
    answer.textContent = text;
    wrap.appendChild(answer);

    const actions = document.createElement("div");
    actions.className = "answer-actions";

    const copy = document.createElement("button");
    copy.className = "small-btn";
    copy.textContent = "📋";
    copy.title = "Copy answer";
    copy.addEventListener("click",async()=>{
      try{
        await navigator.clipboard.writeText(text);
        toast("Answer copied");
      }catch{
        toast("Copy unavailable. Please select the answer and copy it.");
      }
    });

    const like = document.createElement("button");
    like.className = "small-btn";
    like.textContent = "👍";
    like.title = "Helpful";
    like.addEventListener("click",()=>toast("Thank you for your feedback"));

    const dislike = document.createElement("button");
    dislike.className = "small-btn";
    dislike.textContent = "👎";
    dislike.title = "Not helpful";
    dislike.addEventListener("click",()=>toast("Feedback received"));

    const speak = document.createElement("button");
    speak.className = "small-btn";
    speak.textContent = "🔊";
    speak.title = "Read answer aloud";
    speak.addEventListener("click",()=>{
      if(!("speechSynthesis" in window)){
        toast("Speech is not supported in this browser");return;
      }
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(new SpeechSynthesisUtterance(text));
    });

    const share = document.createElement("button");
    share.className = "small-btn";
    share.textContent = "↗";
    share.title = "Share answer";
    share.addEventListener("click",()=>shareText(text));

    actions.append(copy,like,dislike,speak,share);
    wrap.appendChild(actions);
    lastAnswer = text;
  }

  messages.appendChild(wrap);
  $("chatArea").scrollTop = $("chatArea").scrollHeight;
}

async function shareText(text){
  try{
    if(navigator.share){
      await navigator.share({title:"AI Sameer",text});
    }else if(navigator.clipboard){
      await navigator.clipboard.writeText(text);
      toast("Copied. You can paste and share it.");
    }else{
      toast("Sharing is not available in this browser");
    }
  }catch(err){
    if(err.name !== "AbortError") toast("Unable to share right now");
  }
}
$("shareBtn").addEventListener("click",()=>{
  const text = lastAnswer || promptBox.value.trim();
  if(!text){toast("Ask a question first, then share it");return;}
  shareText(text);
});

function setBusy(value){
  busy = value;
  $("sendBtn").disabled = value;
  $("sendBtn").textContent = value ? "…" : "➤";
  statusBox.textContent = value ? "AI Sameer is thinking…" : "";
}

function extractAnswer(data){
  if(typeof data.answer === "string") return data.answer;
  if(typeof data.output_text === "string") return data.output_text;
  if(data.choices && data.choices[0] &&
     data.choices[0].message &&
     typeof data.choices[0].message.content === "string"){
    return data.choices[0].message.content;
  }
  if(data.error){
    return typeof data.error === "string" ? data.error :
      (data.error.message || "The AI service returned an error.");
  }
  return "";
}

async function sendMessage(){
  if(busy) return;
  const question = promptBox.value.trim();
  if(!question && selectedFiles.length === 0){
    toast("Please type a question or attach a file");return;
  }

  let displayQuestion = question;
  if(selectedFiles.length){
    displayQuestion += (displayQuestion ? "\n" : "") +
      "Attachments: " + selectedFiles.map(f=>f.name).join(", ");
  }
  addMessage(displayQuestion,"user");
  promptBox.value = "";
  promptBox.style.height = "48px";
  setBusy(true);

  if(!API_URL || API_URL.includes("PASTE_YOUR_")){
    addMessage(
      "AI backend is not connected yet. The buttons and chat interface are working, but real AI answers require your deployed Cloudflare Worker URL. Configure the worker endpoint in index.html before sending questions.",
      "assistant"
    );
    setBusy(false);
    selectedFiles = [];
    return;
  }

  try{
    const response = await fetch(API_URL,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        message:question,
        files:selectedFiles.map(f=>({name:f.name,type:f.type,size:f.size}))
      })
    });

    const raw = await response.text();
    let data;
    try{data=JSON.parse(raw)}
    catch{throw new Error("The AI server returned an invalid response. Check your Worker URL and server configuration.")}

    if(!response.ok){
      throw new Error(data.error?.message || data.error ||
        "AI server error ("+response.status+"). Check the Worker logs and API credits.");
    }

    const answer = extractAnswer(data);
    if(!answer) throw new Error("The server responded but did not return an answer. Check the Worker response format.");
    addMessage(answer,"assistant");
  }catch(err){
    addMessage("AI connection error: "+err.message,"assistant");
  }finally{
    selectedFiles = [];
    setBusy(false);
  }
}

$("sendBtn").addEventListener("click",sendMessage);
promptBox.addEventListener("keydown",e=>{
  if(e.key === "Enter" && !e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
});
promptBox.addEventListener("input",()=>{
  promptBox.style.height = "48px";
  promptBox.style.height = Math.min(promptBox.scrollHeight,120)+"px";
});

$("newChatBtn").addEventListener("click",()=>{
  if(busy){toast("Please wait for the current response");return;}
  messages.replaceChildren();
  welcome.style.display = "block";
  promptBox.value = "";
  lastAnswer = "";
  selectedFiles = [];
  statusBox.textContent = "";
  toast("New chat started");
});

function chooseFiles(){
  $("fileInput").click();
}
$("fileInput").addEventListener("change",e=>{
  const files = Array.from(e.target.files || []);
  selectedFiles.push(...files);
  if(files.length) toast(files.length+" file(s) selected");
  e.target.value = "";
});
$("cameraInput").addEventListener("change",e=>{
  const files = Array.from(e.target.files || []);
  selectedFiles.push(...files);
  if(files.length) toast("Photo selected");
  e.target.value = "";
});

document.querySelectorAll("[data-feature]").forEach(btn=>{
  btn.addEventListener("click",()=>{
    const feature = btn.dataset.feature;
    closeFeatures();

    if(feature === "Photos" || feature === "Images"){
      chooseFiles();
    }else if(feature === "Camera"){
      $("cameraInput").click();
    }else if(feature === "Avatar"){
      toast("Avatar creation needs an image-generation service");
    }else{
      promptBox.value = feature + ": ";
      promptBox.focus();
      toast("Describe what you want to do, then press Send");
    }
  });
});

$("micBtn").addEventListener("click",()=>{
  const SpeechRecognition = window.SpeechRecognition ||
                            window.webkitSpeechRecognition;
  if(!SpeechRecognition){
    toast("Voice input is not supported in this browser. Try Chrome.");
    return;
  }
  if(recognition){
    recognition.stop();
    return;
  }
  recognition = new SpeechRecognition();
  recognition.lang = "te-IN";
  recognition.interimResults = true;
  recognition.continuous = false;
  $("micBtn").classList.add("listening");
  statusBox.textContent = "Listening… Speak now";

  recognition.onresult = event=>{
    let text = "";
    for(let i=0;i<event.results.length;i++){
      text += event.results[i][0].transcript;
    }
    promptBox.value = text;
    promptBox.dispatchEvent(new Event("input"));
  };
  recognition.onerror = ()=>{
    toast("Microphone failed. Allow microphone permission in Chrome.");
  };
  recognition.onend = ()=>{
    recognition = null;
    $("micBtn").classList.remove("listening");
    statusBox.textContent = "";
  };
  try{recognition.start();}
  catch{recognition=null;$("micBtn").classList.remove("listening");}
});
</script>
</body>
</html>
