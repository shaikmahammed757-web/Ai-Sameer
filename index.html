<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SK MD Bike Puzzle & Earn</title>

<style>
body{
    font-family: Arial, sans-serif;
    text-align:center;
    background:#1e3c72;
    color:white;
    margin:0;
}

h1{
    margin-top:20px;
}

#score{
    font-size:22px;
    margin:10px;
}

.puzzle-container{
    width:300px;
    height:300px;
    margin:20px auto;
    display:grid;
    grid-template-columns:repeat(3,100px);
    grid-template-rows:repeat(3,100px);
    border:4px solid white;
}

.tile{
    width:100px;
    height:100px;
    border:1px solid #fff;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:30px;
    background:#4caf50;
    cursor:pointer;
}

.empty{
    background:black;
}

button{
    padding:10px 20px;
    font-size:18px;
    cursor:pointer;
    border:none;
    border-radius:8px;
}

#message{
    font-size:24px;
    color:yellow;
    margin-top:15px;
}
</style>
</head>
<body>

<h1>🏍️ SK MD Bike Puzzle & Earn</h1>

<div id="score">Coins: 0</div>

<div class="puzzle-container" id="board"></div>

<button onclick="shuffle()">Shuffle Puzzle</button>

<div id="message"></div>

<script>
let board = [1,2,3,4,5,6,7,8,0];
let coins = 0;

const boardDiv = document.getElementById("board");

function drawBoard(){
    boardDiv.innerHTML = "";

    board.forEach((num,index)=>{
        let tile = document.createElement("div");
        tile.classList.add("tile");

        if(num===0){
            tile.classList.add("empty");
            tile.innerHTML="";
        }else{
            tile.innerHTML=num;
            tile.onclick=()=>moveTile(index);
        }

        boardDiv.appendChild(tile);
    });

    checkWin();
}

function moveTile(index){
    let emptyIndex = board.indexOf(0);

    let validMoves = [
        emptyIndex-1,
        emptyIndex+1,
        emptyIndex-3,
        emptyIndex+3
    ];

    if(validMoves.includes(index)){
        [board[index], board[emptyIndex]] =
        [board[emptyIndex], board[index]];
        drawBoard();
    }
}

function shuffle(){
    for(let i=0;i<200;i++){
        let emptyIndex = board.indexOf(0);

        let moves = [
            emptyIndex-1,
            emptyIndex+1,
            emptyIndex-3,
            emptyIndex+3
        ].filter(x=>x>=0 && x<9);

        let randomMove =
            moves[Math.floor(Math.random()*moves.length)];

        [board[randomMove], board[emptyIndex]] =
        [board[emptyIndex], board[randomMove]];
    }
    document.getElementById("message").innerHTML="";
    drawBoard();
}

function checkWin(){
    let win = [1,2,3,4,5,6,7,8,0];

    if(JSON.stringify(board) === JSON.stringify(win)){
        coins += 100;
        document.getElementById("score").innerHTML =
            "Coins: " + coins;

        document.getElementById("message").innerHTML =
            "🎉 Puzzle Completed! You Earned 100 Coins!";
    }
}

drawBoard();
</script>

</body>
</html>
