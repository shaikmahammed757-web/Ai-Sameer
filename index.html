<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AI Sameer</title>
  <meta name="theme-color" content="#000000" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="logo.png" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: #000;
      color: #fff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      background: #000;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .menu-btn, .edit-btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 22px;
      cursor: pointer;
    }

    .model-name {
      font-size: 17px;
      font-weight: 500;
    }

    /* Home Screen */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      text-align: center;
    }

    .sparkle {
      font-size: 42px;
      margin-bottom: 18px;
      background: linear-gradient(135deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .greeting {
      font-size: 28px;
      font-weight: 400;
      color: #e0e0e0;
      margin-bottom: 8px;
    }

    .sub-text {
      font-size: 15px;
      color: #888;
    }

    /* Chat Area */
    #chat-area {
      display: none;
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      flex-direction: column;
      gap: 20px;
    }

    .message {
      max-width: 85%;
      padding: 14px 18px;
      border-radius: 18px;
      font-size: 15px;
      line-height: 1.5;
    }

    .user-msg {
      align-self: flex-end;
      background: #1e3a5f;
      border-radius: 18px 18px 4px 18px;
    }

    .ai-msg {
      align-self: flex-start;
      background: #1e1e1e;
      border-radius: 18px 18px 18px 4px;
    }

    .ai-actions {
      display: flex;
      gap: 18px;
      margin-top: 10px;
      margin-left: 6px;
      color: #888;
      font-size: 18px;
    }

    .ai-actions span {
      cursor: pointer;
    }

    .disclaimer {
      font-size: 12px;
      color: #666;
      margin-top: 8px;
      margin-left: 6px;
    }

    /* Input Area */
    .input-area {
      padding: 12px 16px 28px;
      background: #000;
    }

    .input-box {
      display: flex;
      align-items: center;
      background: #1e1e1e;
      border-radius: 28px;
      padding: 8px 8px 8px 18px;
      gap: 10px;
    }

    .input-box input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 16px;
      padding: 10px 0;
    }

    .input-box input::placeholder {
      color: #777;
    }

    .icon-btn {
      background: none;
      border: none;
      color: #aaa;
      font-size: 22px;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .send-btn {
      background: #3b82f6;
      color: white;
      border: none;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    /* Side Menu */
    .side-menu {
      position: fixed;
      top: 0;
      left: -280px;
      width: 280px;
      height: 100%;
      background: #111;
      z-index: 1000;
      transition: 0.3s;
      padding: 20px 0;
      overflow-y: auto;
    }

    .side-menu.open {
      left: 0;
    }

    .menu-item {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 24px;
      color: #ddd;
      font-size: 16px;
      cursor: pointer;
    }

    .menu-item:hover {
      background: #1a1a1a;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 999;
      display: none;
    }

    .overlay.show {
      display: block;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <button class="menu-btn" onclick="toggleMenu()">☰</button>
      <span class="model-name">AI Sameer</span>
    </div>
    <button class="edit-btn">✎</button>
  </div>

  <!-- Home Screen -->
  <div class="main" id="home-screen">
    <div class="sparkle">✦</div>
    <div class="greeting">Ask away, Shaik!</div>
    <div class="sub-text">Your personal AI assistant</div>
  </div>

  <!-- Chat Area -->
  <div id="chat-area"></div>

  <!-- Input -->
  <div class="input-area">
    <div class="input-box">
      <button class="icon-btn">+</button>
      <input type="text" id="user-input" placeholder="Ask AI Sameer..." autocomplete="off" />
      <button class="icon-btn">🎤</button>
      <button class="send-btn" onclick="sendMessage()">➤</button>
    </div>
  </div>

  <!-- Side Menu -->
  <div class="overlay" id="overlay" onclick="toggleMenu()"></div>
  <div class="side-menu" id="side-menu">
    <div class="menu-item" onclick="newChat()">✏️ New chat</div>
    <div class="menu-item">🔍 Search chats</div>
    <div class="menu-item">🖼️ Images</div>
    <div class="menu-item">📚 Library</div>
    <div style="height:20px"></div>
    <div class="menu-item">📷 Photos</div>
    <div class="menu-item">📸 Camera</div>
    <div class="menu-item">👤 Avatar</div>
    <div class="menu-item">🎨 Create images</div>
    <div class="menu-item">🎵 Create music</div>
    <div class="menu-item">📝 Canvas</div>
    <div class="menu-item">🔬 Deep Research</div>
    <div class="menu-item">📖 Guided Learning</div>
    <div class="menu-item">🧠 Personal Intelligence</div>
  </div>

  <script>
    function toggleMenu() {
      document.getElementById('side-menu').classList.toggle('open');
      document.getElementById('overlay').classList.toggle('show');
    }

    function newChat() {
      document.getElementById('home-screen').style.display = 'flex';
      document.getElementById('chat-area').style.display = 'none';
      document.getElementById('chat-area').innerHTML = '';
      toggleMenu();
    }

    function sendMessage() {
      const input = document.getElementById('user-input');
      const text = input.value.trim();
      if (!text) return;

      document.getElementById('home-screen').style.display = 'none';
      const chatArea = document.getElementById('chat-area');
      chatArea.style.display = 'flex';

      // User message
      const userDiv = document.createElement('div');
      userDiv.className = 'message user-msg';
      userDiv.textContent = text;
      chatArea.appendChild(userDiv);

      input.value = '';
      chatArea.scrollTop = chatArea.scrollHeight;

      // AI reply
      setTimeout(() => {
        const wrapper = document.createElement('div');
        wrapper.style.maxWidth = '90%';
        wrapper.style.alignSelf = 'flex-start';

        const aiDiv = document.createElement('div');
        aiDiv.className = 'message ai-msg';
        aiDiv.textContent = "I'm AI Sameer. Real Gemini connection will be added next. You asked: " + text;
        wrapper.appendChild(aiDiv);

        const actions = document.createElement('div');
        actions.className = 'ai-actions';
        actions.innerHTML = `
          <span>👍</span>
          <span>👎</span>
          <span>↻</span>
          <span>📋</span>
          <span>⋯</span>
          <span>🔊</span>
        `;
        wrapper.appendChild(actions);

        const disclaimer = document.createElement('div');
        disclaimer.className = 'disclaimer';
        disclaimer.textContent = 'AI Sameer is AI and can make mistakes.';
        wrapper.appendChild(disclaimer);

        chatArea.appendChild(wrapper);
        chatArea.scrollTop = chatArea.scrollHeight;
      }, 600);
    }

    document.getElementById('user-input').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') sendMessage();
    });
  </script>
</body>
</html>
