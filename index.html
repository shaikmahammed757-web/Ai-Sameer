
<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f7f8fc">
<title>AI Sameer</title>
<style>
:root {
  --bg:#f7f8fc;
  --panel:#ffffff;
  --text:#202124;
  --muted:#737783;
  --line:#e5e7ef;
  --accent:#5267e8;
  --soft:#eef0ff;
  --answer:#f0f2f8;
}
body.dark {
  --bg:#13151b;
  --panel:#1c1f27;
  --text:#f1f3f9;
  --muted:#a5aaba;
  --line:#303440;
  --accent:#a6b1ff;
  --soft:#292e49;
  --answer:#242832;
}
* {box-sizing:border-box}
body {
  margin:0;
  font-family:system-ui,-apple-system,"Noto Sans Telugu",sans-serif;
  background:var(--bg);
  color:var(--text);
  height:100dvh;
  overflow:hidden;
}
button,input,textarea {font:inherit}
button {cursor:pointer;color:inherit}
button:disabled {opacity:.5;cursor:not-allowed}
.app {height:100dvh;display:flex;flex-direction:column}
header {
  width:100%;min-height:64px;display:flex;align-items:center;
  justify-content:space-between;padding:10px 16px;
  background:var(--panel);border-bottom:1px solid var(--line);
  gap:12px;flex-shrink:0;
}
.brand {display:flex;align-items:center;gap:10px;font-size:19px;font-weight:750}
.logo {
  width:38px;height:38px;border-radius:14px;display:grid;
  place-items:center;color:white;font-weight:800;
  background:linear-gradient(135deg,#6479ff,#a25af5);
}
.header-actions {display:flex;align-items:center;gap:7px}
.icon-btn {
  border:0;background:transparent;border-radius:12px;
  width:42px;height:42px;display:grid;place-items:center;
  font-size:21px;
}
.icon-btn:hover,.tool:hover {background:var(--soft)}
.layout {display:flex;flex:1;min-height:0}
.sidebar {
  width:270px;flex-shrink:0;background:var(--bg);
  border-right:1px solid var(--line);padding:14px;
  display:flex;flex-direction:column;gap:10px;overflow:auto;
}
.primary-btn {
  border:0;border-radius:24px;padding:13px 17px;
  background:var(--soft);text-align:left;font-weight:650;
}
.sidebar-title {font-size:13px;color:var(--muted);padding:10px 7px 3px}
.history-list {display:flex;flex-direction:column;gap:4px}
.history-item {
  display:flex;align-items:center;gap:6px;
  padding:9px 10px;border-radius:12px;min-width:0;
}
.history-item.active {background:var(--soft)}
.history-open {
  border:0;background:transparent;text-align:left;flex:1;
  min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.delete-history {border:0;background:transparent;font-size:16px}
.main {flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.messages {
  flex:1;overflow-y:auto;padding:26px 18px 20px;
  scroll-behavior:smooth;
}
.welcome {max-width:760px;margin:8vh auto 30px}
.welcome h1 {
  font-size:clamp(28px,5vw,43px);line-height:1.25;margin:0 0 10px;
  background:linear-gradient(90deg,#5572ed,#a052ce);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.welcome p {color:var(--muted);font-size:16px}
.suggestions {
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;margin-top:26px;
}
.suggestion {
  background:var(--panel);border:1px solid var(--line);
  padding:15px;border-radius:17px;text-align:left;
  min-height:80px;
}
.suggestion strong {display:block;margin-bottom:5px}
.suggestion span {font-size:13px;color:var(--muted)}
.message {max-width:820px;margin:0 auto 24px}
.message.user {display:flex;justify-content:flex-end}
.bubble {
  max-width:min(100%,720px);padding:14px 17px;border-radius:20px;
  line-height:1.75;overflow-wrap:anywhere;white-space:pre-wrap;
}
.user .bubble {background:var(--soft);border-bottom-right-radius:6px}
.assistant .bubble {background:var(--answer);border-bottom-left-radius:6px}
.message-label {font-size:13px;color:var(--muted);margin:0 0 6px 3px}
.answer-actions {display:flex;gap:3px;margin:5px 0 0 3px;flex-wrap:wrap}
.tool {
  border:0;background:transparent;border-radius:9px;
  padding:7px 10px;font-size:14px;
}
.tool.selected {background:var(--soft)}
.status {font-size:13px;color:var(--muted);padding:8px 4px}
.composer-wrap {
  padding:10px 16px 5px;background:var(--bg);
  flex-shrink:0;
}
.composer {
  max-width:850px;margin:auto;background:var(--panel);
  border:1px solid var(--line);border-radius:27px;
  padding:10px 12px 9px;box-shadow:0 5px 24px #00000008;
}
#prompt {
  width:100%;border:0;outline:0;resize:none;max-height:180px;
  min-height:38px;padding:8px;background:transparent;color:var(--text);
  line-height:1.6;
}
.composer-bottom {display:flex;justify-content:space-between;align-items:center;gap:8px}
.composer-tools {display:flex;gap:5px;align-items:center}
.send-btn {
  border:0;border-radius:50%;width:43px;height:43px;
  background:var(--accent);color:white;font-size:20px;
}
.send-btn.recording {background:#e34558;animation:pulse 1s infinite}
@keyframes pulse {50%{opacity:.55}}
.tiny-note {
  max-width:850px;margin:7px auto 0;text-align:center;
  color:var(--muted);font-size:11px;padding-bottom:5px;
}
.plus-wrap {position:relative}
.popup {
  display:none;position:absolute;bottom:52px;left:0;z-index:20;
  background:var(--panel);border:1px solid var(--line);
  border-radius:16px;padding:7px;width:235px;
  box-shadow:0 10px 35px #0002;
}
.popup.open {display:block}
.popup button {
  display:block;width:100%;border:0;background:transparent;
  text-align:left;padding:12px;border-radius:10px;
}
.popup button:hover {background:var(--soft)}
.attach-preview {
  display:none;margin:4px 5px 10px;padding:9px 12px;
  background:var(--soft);border-radius:12px;font-size:13px;
}
.attach-preview img {max-width:100px;max-height:90px;display:block;margin-top:7px;border-radius:8px}
#fileInput {display:none}
#sidebarOverlay {display:none}
@media(max-width:700px) {
  header {min-height:58px;padding:7px 10px}
  .brand {font-size:17px}
  .logo {width:34px;height:34px}
  .sidebar {
    position:fixed;top:58px;bottom:0;left:0;z-index:50;
    transform:translateX(-105%);transition:transform .2s;
    width:min(290px,85vw);background:var(--panel);
  }
  .sidebar.open {transform:translateX(0)}
  #sidebarOverlay {
    position:fixed;inset:58px 0 0;z-index:40;background:#0005;
  }
  #sidebarOverlay.open {display:block}
  .messages {padding:18px 12px}
  .welcome {margin:7vh auto 20px}
  .suggestions {grid-template-columns:1fr}
  .suggestion {min-height:66px;padding:12px}
  .composer-wrap {padding:8px 9px 3px}
  .tiny-note {font-size:10px}
  .bubble {padding:12px 14px}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="header-actions">
      <button class="icon-btn" id="menuBtn" aria-label="మెనూ">☰</button>
      <div class="brand"><div class="logo">S</div><span>AI Sameer</span></div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="newChatBtn" title="కొత్త చాట్">＋</button>
      <button class="icon-btn" id="themeBtn" title="థీమ్ మార్చండి">☼</button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <button class="primary-btn" id="sidebarNewChat">＋　కొత్త చాట్</button>
      <div class="sidebar-title">ఇటీవలి చాట్‌లు</div>
      <div class="history-list" id="historyList"></div>
      <div style="flex:1"></div>
      <button class="primary-btn" id="clearHistoryBtn">చాట్ హిస్టరీ క్లియర్ చేయండి</button>
    </aside>
    <div id="sidebarOverlay"></div>

    <main class="main">
      <section class="messages" id="messages">
        <div class="welcome" id="welcome">
          <h1>నమస్కారం! 👋</h1>
          <h2 style="font-size:21px;font-weight:550">నేను AI Sameer.</h2>
          <p>మీకు ఈరోజు నేను ఎలా సహాయం చేయగలను?</p>
          <div class="suggestions">
            <button class="suggestion" data-prompt="నాకు ఇంగ్లీష్ నేర్చుకోవడానికి రోజువారీ ప్రణాళిక ఇవ్వండి.">
              <strong>📚 ఇంగ్లీష్ నేర్చుకోవడం</strong><span>రోజువారీ అభ్యాసం, పదాలు</span>
            </button>
            <button class="suggestion" data-prompt="నా YouTube ఛానల్ కోసం కొత్త వీడియో ఐడియాలు ఇవ్వండి.">
              <strong>🎬 YouTube వీడియో ఐడియాలు</strong><span>కొత్త కంటెంట్ ఆలోచనలు</span>
            </button>
            <button class="suggestion" data-prompt="ఈ కోడ్‌లో సమస్యలను గుర్తించి సరిచేయండి.">
              <strong>💻 కోడింగ్ సహాయం</strong><span>కోడ్ రాయడం, డీబగ్గింగ్</span>
            </button>
            <button class="suggestion" data-prompt="నాకు ఉపయోగపడే ఐదు కొత్త ఆలోచనలు చెప్పండి.">
              <strong>💡 కొత్త ఆలోచనలు</strong><span>ప్రణాళికలు, సృజనాత్మకత</span>
            </button>
          </div>
        </div>
      </section>

      <div class="status" id="status" style="display:none"></div>

      <div class="composer-wrap">
        <div class="composer">
          <div class="attach-preview" id="attachPreview"></div>
          <textarea id="prompt" rows="1" placeholder="మీ ప్రశ్నను ఇక్కడ టైప్ చేయండి..." aria-label="మీ ప్రశ్న"></textarea>
          <div class="composer-bottom">
            <div class="composer-tools">
              <div class="plus-wrap">
                <button class="icon-btn" id="plusBtn" title="ఫైళ్లు జోడించండి">＋</button>
                <div class="popup" id="plusMenu">
                  <button id="photoBtn">🖼️ ఫోటో ఎంచుకోండి</button>
                  <button id="cameraBtn">📷 కెమెరా / ఫోటో</button>
                  <button id="documentBtn">📎 టెక్స్ట్ ఫైల్ జోడించండి</button>
                </div>
              </div>
              <button class="icon-btn" id="voiceBtn" title="మాట్లాడి టైప్ చేయండి">🎙️</button>
            </div>
            <button class="send-btn" id="sendBtn" title="పంపండి">➤</button>
          </div>
          <input id="fileInput" type="file" accept="image/*,.txt,.md,.csv,.json">
          <input id="cameraInput" type="file" accept="image/*" capture="environment" style="display:none">
        </div>
        <div class="tiny-note">AI Sameer తప్పులు చేయవచ్చు. ముఖ్యమైన సమాచారాన్ని ధృవీకరించండి.</div>
      </div>
    </main>
  </div>
</div>

<script>
(() => {
  "use strict";

  // మీ Cloudflare Worker URL
  const API_URL = "https://ai-sameer-api.shaikmahammed757.workers.dev";

  const $ = id => document.getElementById(id);
  const messagesEl = $("messages");
  const promptEl = $("prompt");
  const statusEl = $("status");
  const sendBtn = $("sendBtn");
  const plusMenu = $("plusMenu");
  const fileInput = $("fileInput");
  const cameraInput = $("cameraInput");
  const attachPreview = $("attachPreview");

  let chats = [];
  let currentChatId = null;
  let pendingFile = null;
  let sending = false;
  let recognition = null;
  let recording = false;

  try {
    chats = JSON.parse(localStorage.getItem("aiSameerChats") || "[]");
    if (!Array.isArray(chats)) chats = [];
  } catch (_) { chats = []; }

  function saveChats() {
    try {
      localStorage.setItem("aiSameerChats", JSON.stringify(chats));
    } catch (_) {
      showStatus("చాట్ హిస్టరీ సేవ్ కాలేదు. బ్రౌజర్ స్టోరేజ్ నిండిపోయి ఉండవచ్చు.");
    }
  }

  function newChat() {
    currentChatId = null;
    pendingFile = null;
    attachPreview.style.display = "none";
    attachPreview.textContent = "";
    promptEl.value = "";
    renderChat();
    closeSidebar();
  }

  function getCurrentChat() {
    return chats.find(c => c.id === currentChatId);
  }

  function ensureChat(text) {
    let chat = getCurrentChat();
    if (!chat) {
      chat = {
        id: String(Date.now()) + Math.random().toString(36).slice(2, 7),
        title: text.slice(0, 36) || "కొత్త చాట్",
        messages: [],
        updatedAt: Date.now()
      };
      chats.unshift(chat);
      currentChatId = chat.id;
    }
    return chat;
  }

  function renderHistory() {
    const list = $("historyList");
    list.replaceChildren();

    chats.forEach(chat => {
      const row = document.createElement("div");
      row.className = "history-item" + (chat.id === currentChatId ? " active" : "");

      const open = document.createElement("button");
      open.className = "history-open";
      open.textContent = "💬 " + (chat.title || "కొత్త చాట్");
      open.title = chat.title || "కొత్త చాట్";
      open.onclick = () => {
        currentChatId = chat.id;
        renderChat();
        closeSidebar();
      };

      const del = document.createElement("button");
      del.className = "delete-history";
      del.textContent = "×";
      del.title = "ఈ చాట్ తొలగించండి";
      del.onclick = () => {
        chats = chats.filter(c => c.id !== chat.id);
        if (currentChatId === chat.id) currentChatId = null;
        saveChats();
        renderChat();
      };

      row.append(open, del);
      list.append(row);
    });
  }

  function renderChat() {
    messagesEl.replaceChildren();
    const chat = getCurrentChat();

    if (!chat || chat.messages.length === 0) {
      const welcome = $("welcome");
      // Build the welcome panel again safely from the initial markup.
      const panel = document.createElement("div");
      panel.className = "welcome";

      const h1 = document.createElement("h1");
      h1.textContent = "నమస్కారం! 👋";
      const h2 = document.createElement("h2");
      h2.style.cssText = "font-size:21px;font-weight:550";
      h2.textContent = "నేను AI Sameer.";
      const p = document.createElement("p");
      p.textContent = "మీకు ఈరోజు నేను ఎలా సహాయం చేయగలను?";
      const suggestions = document.createElement("div");
      suggestions.className = "suggestions";

      [
        ["📚 ఇంగ్లీష్ నేర్చుకోవడం", "రోజువారీ అభ్యాసం, పదాలు", "నాకు ఇంగ్లీష్ నేర్చుకోవడానికి రోజువారీ ప్రణాళిక ఇవ్వండి."],
        ["🎬 YouTube వీడియో ఐడియాలు", "కొత్త కంటెంట్ ఆలోచనలు", "నా YouTube ఛానల్ కోసం కొత్త వీడియో ఐడియాలు ఇవ్వండి."],
        ["💻 కోడింగ్ సహాయం", "కోడ్ రాయడం, డీబగ్గింగ్", "ఈ కోడ్‌లో సమస్యలను గుర్తించి సరిచేయండి."],
        ["💡 కొత్త ఆలోచనలు", "ప్రణాళికలు, సృజనాత్మకత", "నాకు ఉపయోగపడే ఐదు కొత్త ఆలోచనలు చెప్పండి."]
      ].forEach(item => {
        const b = document.createElement("button");
        b.className = "suggestion";
        const strong = document.createElement("strong");
        strong.textContent = item[0];
        const span = document.createElement("span");
        span.textContent = item[1];
        b.append(strong, span);
        b.onclick = () => { promptEl.value = item[2]; sendMessage(); };
        suggestions.append(b);
      });

      panel.append(h1, h2, p, suggestions);
      messagesEl.append(panel);
    } else {
      chat.messages.forEach((m, index) => {
        messagesEl.append(createMessage(m, index));
      });
    }

    renderHistory();
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function createMessage(message, index) {
    const wrap = document.createElement("div");
    wrap.className = "message " + (message.role === "user" ? "user" : "assistant");

    const inner = document.createElement("div");
    inner.style.maxWidth = "100%";

    const label = document.createElement("div");
    label.className = "message-label";
    label.textContent = message.role === "user" ? "మీరు" : "✦ AI Sameer";

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = message.content || "";

    inner.append(label, bubble);

    if (message.role === "assistant") {
      const actions = document.createElement("div");
      actions.className = "answer-actions";

      const makeAction = (labelText, fn, extraClass = "") => {
        const b = document.createElement("button");
        b.className = "tool " + extraClass;
        b.textContent = labelText;
        b.onclick = fn;
        return b;
      };

      actions.append(
        makeAction("📋 కాపీ", async () => {
          try {
            await navigator.clipboard.writeText(message.content);
            showStatus("సమాధానం కాపీ అయింది.");
          } catch (_) {
            fallbackCopy(message.content);
          }
        }),
        makeAction("👍", () => {
          message.feedback = message.feedback === "like" ? "" : "like";
          saveChats(); renderChat();
          showStatus("మీ అభిప్రాయం సేవ్ అయింది.");
        }, message.feedback === "like" ? "selected" : ""),
        makeAction("👎", () => {
          message.feedback = message.feedback === "dislike" ? "" : "dislike";
          saveChats(); renderChat();
          showStatus("మీ అభిప్రాయం సేవ్ అయింది.");
        }, message.feedback === "dislike" ? "selected" : ""),
        makeAction("📤 షేర్", async () => {
          try {
            if (navigator.share) {
              await navigator.share({ title: "AI Sameer", text: message.content });
            } else {
              await navigator.clipboard.writeText(message.content);
              showStatus("షేర్ చేయడానికి సమాధానం కాపీ అయింది.");
            }
          } catch (e) {
            if (e.name !== "AbortError") showStatus("షేర్ చేయలేకపోయాం.");
          }
        })
      );

      inner.append(actions);
    }

    wrap.append(inner);
    return wrap;
  }

  function fallbackCopy(text) {
    const temp = document.createElement("textarea");
    temp.value = text;
    temp.style.position = "fixed";
    temp.style.opacity = "0";
    document.body.append(temp);
    temp.select();
    try {
      document.execCommand("copy");
      showStatus("సమాధానం కాపీ అయింది.");
    } catch (_) {
      showStatus("కాపీ చేయలేకపోయాం. సమాధానాన్ని సెలెక్ట్ చేసి కాపీ చేయండి.");
    }
    temp.remove();
  }

  let statusTimer;
  function showStatus(text) {
    statusEl.textContent = text;
    statusEl.style.display = "block";
    clearTimeout(statusTimer);
    statusTimer = setTimeout(() => { statusEl.style.display = "none"; }, 5000);
  }

  function closeSidebar() {
    $("sidebar").classList.remove("open");
    $("sidebarOverlay").classList.remove("open");
  }

  function toggleSidebar() {
    $("sidebar").classList.toggle("open");
    $("sidebarOverlay").classList.toggle("open");
  }

  function setBusy(busy) {
    sending = busy;
    sendBtn.disabled = busy;
