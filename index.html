<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020b20">
<title>AI Sameer</title>

<style>
:root{
 --bg:#020817;
 --panel:#071a37;
 --blue:#087cff;
 --text:#edf5ff;
 --muted:#9bb9e8;
}
*{box-sizing:border-box}
body{
 margin:0;
 min-height:100vh;
 background:radial-gradient(ellipse at 50% 25%,#103c78,#03132e 48%,#020817 85%);
 color:var(--text);
 font-family:Arial,Helvetica,sans-serif;
}
button,input,textarea,select{font:inherit}
button{cursor:pointer;color:inherit}
button:disabled{opacity:.5}
.topbar{
 height:66px;position:sticky;top:0;z-index:10;
 display:flex;align-items:center;justify-content:space-between;
 padding:9px 13px;background:#020b1df2;
 border-bottom:1px solid #153968;
}
.iconbtn,.brand{
 border:1px solid #168bff;background:#061d3e;
 box-shadow:0 0 14px #087cff22;
}
.iconbtn{
 width:43px;height:43px;border-radius:14px;font-size:22px;
}
.brand{
 border-radius:25px;padding:10px 14px;
 font-size:17px;font-weight:bold;
}
main{max-width:850px;margin:auto;padding:16px 13px 175px}
.hero{text-align:center;padding:27px 0 22px}
.mascot{
 width:155px;height:155px;margin:auto;position:relative;
 display:grid;place-items:center;border:2px solid #078cff;
 border-radius:50%;background:radial-gradient(circle,#174d91,#061b3b 75%);
 box-shadow:0 0 28px #087cff80;
}
.banana{font-size:80px;filter:drop-shadow(0 0 12px #ffce36)}
.thumb{position:absolute;right:0;bottom:22px;font-size:30px}
.hero h1{font-size:clamp(29px,6vw,43px);margin:17px 0 7px;color:#8dbbff}
.hero p{color:#b6d5ff;font-size:16px}
#conversation{margin-top:18px}
.msg{
 padding:13px;border-radius:16px;margin:12px 0;
 white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65;
}
.user{background:#0b3261;border:1px solid #1859a1;margin-left:8%}
.bot{background:#071a34;border:1px solid #174a80;margin-right:2%}
.msghead{font-size:13px;color:#91bfff;margin-bottom:7px}
.msgtools{display:flex;flex-wrap:wrap;gap:12px;margin-top:9px}
.msgtools button{
 border:0;background:transparent;color:#9fc4ff;padding:5px;
}
.chatbar{
 position:fixed;bottom:0;left:0;right:0;z-index:20;
 padding:9px 11px calc(8px + env(safe-area-inset-bottom));
 background:linear-gradient(180deg,#020b1d00,#020b1dfc 22%);
}
.composer{
 max-width:850px;margin:auto;display:flex;align-items:center;gap:6px;
 padding:7px;border:1px solid #078cff;border-radius:28px;
 background:#061a37;box-shadow:0 0 18px #087cff35;
}
.smallbtn{
 flex:0 0 37px;width:37px;height:39px;border:0;border-radius:50%;
 background:#073779;color:#c8e4ff;font-size:21px;
 display:grid;place-items:center;
}
#message{
 flex:1;min-width:0;resize:none;max-height:110px;min-height:38px;
 padding:10px 3px;background:transparent;color:white;
 border:0;outline:none;
}
#message::placeholder{color:#91b4e9}
#send{background:#086cff}
.actions{
 max-width:500px;margin:5px auto 0;
 display:flex;justify-content:space-around;gap:2px;
}
.actions button{
 border:0;background:transparent;color:#9fc4ff;
 font-size:11px;padding:5px 2px;
}
.actions span{display:block;font-size:18px;margin-bottom:2px}
.overlay,.modal{
 position:fixed;inset:0;background:#000b;z-index:40;display:none;
}
.overlay.show{display:block}
.drawer{
 position:absolute;top:9px;bottom:9px;left:9px;
 width:min(320px,88vw);padding:14px;border-radius:18px;
 background:#04152f;border:1px solid #168bff;overflow:auto;
 box-shadow:0 0 35px #087cff35;
}
.drawer.right{left:auto;right:9px}
.drawer h3{color:#8fc3ff;margin:8px 7px 15px}
.menuitem{
 width:100%;padding:12px 9px;display:flex;gap:12px;
 align-items:center;border:0;border-radius:11px;
 background:transparent;text-align:left;color:#e4efff;
}
.menuitem:hover{background:#0b2b53}
.mi{width:27px;text-align:center;font-size:20px}
.modal{
 z-index:50;align-items:center;justify-content:center;padding:16px;
}
.modal.show{display:flex}
.modalbox{
 width:min(440px,100%);max-height:85vh;overflow:auto;padding:19px;
 border-radius:20px;background:#061833;border:1px solid #138cff;
}
.modalbox h2{margin:0 0 12px;color:#9ecbff;font-size:21px}
.modalbox p{color:#b6cfee;line-height:1.6}
.modalbox input,.modalbox textarea,.modalbox select{
 width:100%;padding:12px;margin:7px 0;background:#021027;
 color:white;border:1px solid #20528a;border-radius:10px;
}
.modal-actions{display:flex;gap:9px;margin-top:13px}
.primary,.secondary{
 padding:11px 14px;border-radius:11px;border:1px solid #168bff;
}
.primary{background:#086cff}
.secondary{background:#0a2344}
.option{
 display:block;width:100%;text-align:left;margin:7px 0;padding:12px;
 border-radius:12px;border:1px solid #174a80;
 background:#081e3c;color:white;
}
.option small{display:block;color:#9fc4ed;margin-top:4px}
#toast{
 position:fixed;left:50%;bottom:145px;transform:translateX(-50%);
 background:#12335c;border:1px solid #168bff;color:white;
 padding:11px 15px;border-radius:12px;z-index:70;
 display:none;max-width:90vw;text-align:center;
}
.hidden{display:none!important}
@media(max-width:620px){
 .topbar{height:63px;padding:8px 10px}
 .brand{font-size:15px;padding:9px 10px}
 main{padding:12px 10px 160px}
 .hero{padding:24px 0 12px}
 .mascot{width:140px;height:140px}
 .banana{font-size:73px}
 .smallbtn{flex-basis:34px;width:34px;height:36px;font-size:19px}
 .composer{gap:4px}
 .msg{padding:12px}
}
</style>
</head>

<body>

<header class="topbar">
 <button class="iconbtn" id="menuBtn" aria-label="Menu">☰</button>
 <button class="brand" id="modelBtn">AI Sameer ⌄</button>
 <button class="iconbtn" id="newBtn" aria-label="New chat">✏️</button>
</header>

<main>
 <section class="hero" id="home">
  <div class="mascot">
   <div class="banana">🍌</div>
   <div class="thumb">👍</div>
  </div>
  <h1>Hey Sameer</h1>
  <p>How can I help you today?</p>
 </section>
 <div id="conversation" aria-live="polite"></div>
</main>

<div class="chatbar">
 <div class="composer">
  <button class="smallbtn" id="plusBtn" aria-label="Features">＋</button>
  <textarea id="message" rows="1" placeholder="Ask AI Sameer..." aria-label="Message"></textarea>
  <button class="smallbtn" id="micBtn" aria-label="Microphone">🎙️</button>
  <button class="smallbtn" id="send" aria-label="Send">➤</button>
 </div>
 <div class="actions">
  <button id="copyBtn"><span>▢</span>Copy</button>
  <button id="likeBtn"><span>👍</span>Like</button>
  <button id="dislikeBtn"><span>👎</span>Dislike</button>
  <button id="shareBtn"><span>↗</span>Share</button>
  <button id="listenBtn"><span>🔊</span>Listen</button>
 </div>
</div>

<div class="overlay" id="overlay">
 <aside class="drawer">
  <h3>AI Sameer Menu</h3>
  <button class="menuitem" data-action="new"><span class="mi">＋</span>New Chat</button>
  <button class="menuitem" data-action="history"><span class="mi">🔎</span>Search Chats</button>
  <button class="menuitem" data-action="library"><span class="mi">📁</span>Library</button>
  <button class="menuitem" data-action="settings"><span class="mi">⚙️</span>Settings</button>
  <button class="menuitem" data-action="help"><span class="mi">❔</span>Help</button>
  <button class="menuitem" data-action="close"><span class="mi">✕</span>Close</button>
 </aside>
</div>

<div class="overlay" id="plusOverlay">
 <aside class="drawer right">
  <h3>Explore Features</h3>
  <button class="menuitem" data-action="photo"><span class="mi">🖼️</span>Photos & Files</button>
  <button class="menuitem" data-action="camera"><span class="mi">📷</span>Camera</button>
  <button class="menuitem" data-action="image"><span class="mi">🎨</span>Image Generation</button>
  <button class="menuitem" data-action="voice"><span class="mi">🎙️</span>Voice Chat</button>
  <button class="menuitem" data-action="search"><span class="mi">🔎</span>Live Search</button>
  <button class="menuitem" data-action="study"><span class="mi">🎓</span>Study & Learning</button>
  <button class="menuitem" data-action="document"><span class="mi">📄</span>Document Analysis</button>
  <button class="menuitem" data-action="code"><span class="mi">💻</span>Code Assistant</button>
  <button class="menuitem" data-action="writing"><span class="mi">🖊️</span>Creative Writing</button>
  <button class="menuitem" data-action="music"><span class="mi">🎵</span>Music Ideas</button>
  <button class="menuitem" data-action="avatar"><span class="mi">🧐</span>Avatar</button>
  <button class="menuitem" data-action="youtube"><span class="mi">▶️</span>YouTube</button>
  <button class="menuitem" data-action="maps"><span class="mi">📍</span>Google Maps</button>
  <button class="menuitem" data-action="instagram"><span class="mi">📸</span>Instagram</button>
  <button class="menuitem" data-action="research"><span class="mi">🔬</span>Deep Research</button>
  <button class="menuitem" data-action="canvas"><span class="mi">📝</span>Canvas</button>
  <button class="menuitem" data-action="closePlus"><span class="mi">✕</span>Close</button>
 </aside>
</div>

<div class="modal" id="modal">
 <div class="modalbox">
  <h2 id="modalTitle">AI Sameer</h2>
  <div id="modalContent"></div>
  <div class="modal-actions">
   <button class="primary" id="modalOk">Continue</button>
   <button class="secondary" id="modalCancel">Close</button>
  </div>
 </div>
</div>

<input type="file" id="fileInput" hidden multiple accept="image/*,.pdf,.txt,.doc,.docx">
<input type="file" id="cameraInput" hidden accept="image/*" capture="environment">
<div id="toast"></div>

<script>
(function(){
"use strict";

/* YOUR CLOUDFLARE WORKER */
const WORKER_URL =
 "https://ai-sameer-api.shaikmahammed757.workers.dev/";

const $ = id => document.getElementById(id);
const conversation = $("conversation");
const message = $("message");
const overlay = $("overlay");
const plusOverlay = $("plusOverlay");
const modal = $("modal");

let busy = false;
let currentModel = "Fast";
let lastReply = "";
let recognition = null;
let selectedFiles = [];
let chatHistory = [];

function toast(text){
 const el = $("toast");
 el.textContent = text;
 el.style.display = "block";
 clearTimeout(toast.timer);
 toast.timer = setTimeout(()=>el.style.display="none",3000);
}

function hideMenus(){
 overlay.classList.remove("show");
 plusOverlay.classList.remove("show");
}

function showModal(title,html,callback,label){
 $("modalTitle").textContent = title;
 $("modalContent").innerHTML = html;
 $("modalOk").textContent = label || "Continue";
 modal.classList.add("show");
 $("modalOk").onclick = function(){
  modal.classList.remove("show");
  if(callback) callback();
 };
}

$("modalCancel").onclick = ()=>modal.classList.remove("show");

modal.addEventListener("click",e=>{
 if(e.target===modal) modal.classList.remove("show");
});

function addMessage(text,who){
 const div = document.createElement("div");
 div.className = "msg " + who;

 const head = document.createElement("div");
 head.className = "msghead";
 head.textContent = who==="user" ? "You" : "AI Sameer";

 const body = document.createElement("div");
 body.textContent = text;
 div.append(head,body);
 conversation.appendChild(div);

 if(who==="bot"){
  const tools = document.createElement("div");
  tools.className = "msgtools";

  const copy = document.createElement("button");
  copy.textContent = "▢ Copy";
  copy.onclick = ()=>copyText(body.textContent);

  const listen = document.createElement("button");
  listen.textContent = "🔊 Listen";
  listen.onclick = ()=>speak(body.textContent);

  tools.append(copy,listen);
  div.appendChild(tools);
 }

 div.scrollIntoView({behavior:"smooth",block:"nearest"});
 return {div,body};
}

function copyText(text){
 if(!text) return toast("ముందుగా సమాధానం పొందండి");

 if(navigator.clipboard && navigator.clipboard.writeText){
  navigator.clipboard.writeText(text)
   .then(()=>toast("కాపీ అయింది"))
   .catch(()=>fallbackCopy(text));
 }else{
  fallbackCopy(text);
 }
}

function fallbackCopy(text){
 const el = document.createElement("textarea");
 el.value = text;
 el.style.position = "fixed";
 el.style.opacity = "0";
 document.body.appendChild(el);
 el.select();

 try{
  document.execCommand("copy");
  toast("కాపీ అయింది");
 }catch(e){
  toast("సమాధానాన్ని నొక్కి పట్టుకొని కాపీ చేయండి");
 }

 el.remove();
}

function speak(text){
 if(!text) return toast("ముందుగా AI సమాధానం పొందండి");

 if(!("speechSynthesis" in window)){
  return toast("ఈ బ్రౌజర్‌లో Read Aloud అందుబాటులో లేదు");
 }

 window.speechSynthesis.cancel();
 const u = new SpeechSynthesisUtterance(text);
 u.lang = /[\u0C00-\u0C7F]/.test(text) ? "te-IN" : "en-IN";
 window.speechSynthesis.speak(u);
}

function setBusy(value){
 busy = value;
 $("send").disabled = value;
 $("send").textContent = value ? "…" : "➤";
}

async function sendMessage(overrideText){
 let text = (overrideText !== undefined ? overrideText : message.value).trim();

 if(busy) return;

 if(!text && selectedFiles.length){
  text = "నేను ఎంచుకున్న ఫైళ్లను విశ్లేషించడానికి సహాయం చేయండి.";
 }

 if(!text) return;

 if(selectedFiles.length){
  text += "\n\nSelected file names: " +
   selectedFiles.map(f=>f.name).join(", ") +
   "\nగమనిక: ఈ వెర్షన్‌లో ఫైల్ పేర్లు మాత్రమే చేర్చబడ్డాయి. ఫైల్ కంటెంట్‌ను నిజంగా విశ్లేషించడానికి అదనపు backend సదుపాయం అవసరం.";
  selectedFiles = [];
 }

 message.value = "";
 message.style.height = "38px";

 $("home").style.paddingTop = "8px";

 addMessage(text,"user");
 chatHistory.push({role:"user",text});

 setBusy(true);
 const loading = addMessage("సమాధానం తయారు చేస్తున్నాను…","bot");

 try{
  const response = await fetch(WORKER_URL,{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({
    message:text,
    model:currentModel
   })
  });

  const raw = await response.text();
  let data;

  try{
   data = JSON.parse(raw);
  }catch(e){
   throw new Error("Worker JSON సమాధానం ఇవ్వలేదు. Cloudflare Worker కోడ్ చెక్ చేయండి.");
  }

  if(!response.ok){
   throw new Error(data.error || data.message || ("HTTP Error "+response.status));
  }

  if(data.error){
   throw new Error(data.error);
  }

  const reply = data.reply || data.answer || data.response || data.text;

  if(typeof reply !== "string" || !reply.trim()){
   throw new Error("AI సమాధానం ఖాళీగా ఉంది. Worker API కోడ్ చెక్ చేయండి.");
  }

  loading.body.textContent = reply;
  lastReply = reply;
  chatHistory.push({role:"assistant",text:reply});

 }catch(err){
  const reason = err && err.message ? err.message : "Network error";

  loading.body.textContent =
   "AI కనెక్షన్ సమస్య: " + reason +
   "\n\n1. Cloudflare Worker Deploy అయిందో చూడండి." +
   "\n2. GEMINI_API_KEY Secret సరిగ్గా ఉందో చూడండి." +
   "\n3. Worker POST అభ్యర్థులకు AI సమాధానం ఇస్తోందో పరీక్షించండి." +
   "\n4. CORS లేదా Network Error ఉందో పరిశీలించండి.";

  toast("AI కనెక్షన్ సమస్య");
 }finally{
  setBusy(false);
 }
}

$("send").onclick = ()=>sendMessage();

message.addEventListener("keydown",e=>{
 if(e.key==="Enter" && !e.shiftKey){
  e.preventDefault();
  sendMessage();
 }
});

message.addEventListener("input",()=>{
 message.style.height = "38px";
 message.style.height = Math.min(message.scrollHeight,110)+"px";
});

$("menuBtn").onclick = ()=>{
 hideMenus();
 overlay.classList.add("show");
};

$("plusBtn").onclick = ()=>{
 hideMenus();
 plusOverlay.classList.add("show");
};

$("closeMenu").onclick = ()=>overlay.classList.remove("show");
$("closePlus").onclick = ()=>plusOverlay.classList.remove("show");

overlay.addEventListener("click",e=>{
 if(e.target===overlay) overlay.classList.remove("show");
});

plusOverlay.addEventListener("click",e=>{
 if(e.target===plusOverlay) plusOverlay.classList.remove("show");
});

function newChat(){
 if(busy) return toast("సమాధానం వచ్చే వరకు వేచి ఉండండి");

 conversation.innerHTML = "";
 message.value = "";
 lastReply = "";
 chatHistory = [];
 selectedFiles = [];

 $("home").style.paddingTop = "27px";
 hideMenus();

 if("speechSynthesis" in window) window.speechSynthesis.cancel();

 toast("కొత్త చాట్ ప్రారంభమైంది");
}

$("newBtn").onclick = newChat;

$("modelBtn").onclick = ()=>{
 showModal(
  "Choose AI Sameer Mode",
  '<button class="option" data-model="Fast">⚡ Fast<small>Quick responses</small></button>'+
  '<button class="option" data-model="Pro">👑 Pro<small>General assistance</small></button>'+
  '<button class="option" data-model="Creative">🎨 Creative<small>Creative writing and ideas</small></button>'+
  '<button class="option" data-model="Reasoning">🧠 Reasoning<small>Logical explanations</small></button>'+
  '<button class="option" data-model="Research">🔬 Research<small>Research assistance</small></button>'+
  '<p>మోడ్ మార్పు Worker మద్దతుపై ఆధారపడి ఉంటుంది.</p>',
  null,
  "Done"
 );

 document.querySelectorAll("[data-model]").forEach(btn=>{
  btn.onclick = ()=>{
   currentModel = btn.dataset.model;
   $("modelBtn").textContent = "AI Sameer · "+currentModel+" ⌄";
   modal.classList.remove("show");
   toast(currentModel+" mode selected");
  };
 });
};

/* Voice input */
$("micBtn").onclick = ()=>{
 const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

 if(!SR){
  showModal(
   "Voice Input",
   "<p>ఈ బ్రౌజర్‌లో Speech Recognition అందుబాటులో లేదు. Chromeలో మైక్రోఫోన్ అనుమతి ఇవ్వండి. కీబోర్డ్ మైక్ కూడా ఉపయోగించవచ్చు.</p>",
   null,
   "OK"
  );
  return;
 }

 if(recognition){
  recognition.stop();
  recognition = null;
  $("micBtn").textContent = "🎙️";
  return;
 }

 recognition = new SR();
 recognition.lang = "te-IN";
 recognition.interimResults = true;
 recognition.continuous = false;

 recognition.onstart = ()=>{
  $("micBtn").textContent = "⏹";
  toast("మాట్లాడండి…");
 };

 recognition.onresult = e=>{
  let result = "";
  for(let i=e.resultIndex;i<e.results.length;i++){
   result += e.results[i][0].transcript;
  }
  message.value = result;
 };

 recognition.onerror = e=>{
  toast("మైక్ సమస్య: "+e.error);
 };

 recognition.onend = ()=>{
  $("micBtn").textContent = "🎙️";
  recognition = null;
 };

 try{
  recognition.start();
 }catch(e){
  toast("మైక్రోఫోన్ మళ్లీ ప్రయత్నించండి");
 }
};

/* Bottom action buttons */
$("copyBtn").onclick = ()=>copyText(lastReply);

$("likeBtn").onclick = ()=>toast("ధన్యవాదాలు! 👍");

$("dislikeBtn").onclick = ()=>toast("మీ ఫీడ్‌బ్యాక్‌కు ధన్యవాదాలు");

$("listenBtn").onclick = ()=>speak(lastReply);

$("shareBtn").onclick = async ()=>{
 const text = lastReply || "AI Sameer";

 if(navigator.share){
  try{
   await navigator.share({title:"AI Sameer",text:text});
  }catch(e){}
 }else{
  copyText(text);
 }
};

/* File selection */
$("fileInput").onchange = e=>{
