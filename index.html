
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020b20">
<title>AI Sameer</title>
<style>
:root{--bg:#020b1d;--panel:#071a37;--blue:#087cff;--text:#edf5ff;--muted:#9bb9e8}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 50% 35%,#082c64,#03132e 43%,var(--bg) 80%);color:var(--text);font-family:Arial,Helvetica,sans-serif;min-height:100vh}
button,input,textarea,select{font:inherit}
button{cursor:pointer;color:inherit}
button:disabled{opacity:.5;cursor:wait}
.topbar{height:70px;display:flex;align-items:center;justify-content:space-between;padding:10px 15px;position:sticky;top:0;z-index:10;background:#020b1dee;backdrop-filter:blur(16px);border-bottom:1px solid #103466}
.iconbtn,.brand{border:1px solid #168bff;background:#061d3e;color:#d8ebff;box-shadow:0 0 16px #087cff25}
.iconbtn{width:44px;height:44px;border-radius:14px;font-size:23px}
.brand{border-radius:28px;padding:10px 17px;font-size:19px;font-weight:bold}
main{max-width:850px;margin:auto;padding:18px 15px 165px}
.hero{text-align:center;padding:27px 0 20px}
.mascot{width:165px;height:165px;max-width:50vw;margin:auto;display:grid;place-items:center;position:relative;border:2px solid #078cff;border-radius:50%;box-shadow:0 0 22px #087cff;background:radial-gradient(circle,#164c91,#061b3b 72%)}
.banana{font-size:88px;filter:drop-shadow(0 0 13px #ffce36)}
.thumb{position:absolute;right:2px;bottom:28px;font-size:34px}
.hero h1{font-size:clamp(30px,6vw,45px);margin:17px 0 8px;color:#8dbbff;text-shadow:0 0 18px #167cff}
.hero p{font-size:17px;color:#b6d5ff;margin:0}
#conversation{margin:20px 0}
.msg{padding:14px;border-radius:17px;margin:12px 0;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6}
.user{background:#0b3261;border:1px solid #1859a1;margin-left:9%}
.bot{background:#071a34;border:1px solid #174a80;margin-right:2%}
.msghead{font-size:13px;color:#91bfff;margin-bottom:8px}
.msgtools{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px}
.msgtools button{border:0;background:transparent;color:#9fc4ff;padding:5px;font-size:13px}
.chatbar{position:fixed;bottom:0;left:0;right:0;z-index:20;padding:10px 12px calc(9px + env(safe-area-inset-bottom));background:linear-gradient(180deg,#020b1d00,#020b1df8 20%)}
.composer{max-width:850px;margin:auto;display:flex;align-items:center;gap:7px;padding:8px;border:1px solid #078cff;border-radius:28px;background:#061a37;box-shadow:0 0 18px #087cff35}
.smallbtn{flex:0 0 39px;width:39px;height:39px;border:0;border-radius:50%;background:#073779;color:#c8e4ff;font-size:21px;display:grid;place-items:center}
#message{flex:1;min-width:0;resize:none;max-height:110px;min-height:38px;padding:10px 4px;background:transparent;color:white;border:0;outline:none}
#message::placeholder{color:#91b4e9}
#send{background:#086cff}
.actions{max-width:500px;margin:5px auto 0;display:flex;justify-content:space-around;gap:3px}
.actions button{border:0;background:transparent;color:#9fc4ff;font-size:12px;padding:5px 3px;min-width:43px}
.actions span{display:block;font-size:18px;margin-bottom:2px}
.overlay,.modal{position:fixed;inset:0;background:#000b;z-index:40;display:none}
.overlay.show{display:block}
.drawer{position:absolute;top:10px;bottom:10px;left:10px;width:min(320px,87vw);padding:15px;border-radius:18px;background:#04152f;border:1px solid #168bff;overflow:auto;box-shadow:0 0 35px #087cff35}
.drawer.right{left:auto;right:10px}
.drawer h3{color:#8fc3ff;margin:7px 8px 15px}
.menuitem{width:100%;padding:13px 10px;display:flex;gap:13px;align-items:center;border:0;border-radius:11px;background:transparent;text-align:left;color:#e4efff}
.menuitem:active,.menuitem:hover{background:#0b2b53}
.mi{width:28px;text-align:center;font-size:21px}
.modal{z-index:50;align-items:center;justify-content:center;padding:18px}
.modal.show{display:flex}
.modalbox{width:min(430px,100%);max-height:85vh;overflow:auto;padding:20px;border-radius:20px;background:#061833;border:1px solid #138cff;box-shadow:0 0 30px #087cff30}
.modalbox h2{margin:0 0 12px;color:#9ecbff;font-size:21px}
.modalbox p{color:#b6cfee;line-height:1.55}
.modalbox input,.modalbox textarea,.modalbox select{width:100%;padding:12px;margin:8px 0;background:#021027;color:white;border:1px solid #20528a;border-radius:10px}
.modal-actions{display:flex;gap:9px;margin-top:14px}
.primary,.secondary{padding:11px 14px;border-radius:11px;border:1px solid #168bff}
.primary{background:#086cff}.secondary{background:#0a2344}
.option{display:block;width:100%;text-align:left;margin:7px 0;padding:13px;border-radius:12px;border:1px solid #174a80;background:#081e3c;color:white}
.option small{display:block;color:#9fc4ed;margin-top:4px}
#toast{position:fixed;left:50%;bottom:145px;transform:translateX(-50%);background:#12335c;border:1px solid #168bff;color:white;padding:11px 15px;border-radius:12px;z-index:70;display:none;max-width:90vw;text-align:center}
.hidden{display:none!important}
@media(max-width:620px){
 .topbar{height:65px;padding:9px 12px}.brand{font-size:17px;padding:9px 12px}
 main{padding:12px 12px 160px}.hero{padding:24px 0 12px}
 .mascot{width:145px;height:145px}.banana{font-size:78px}.thumb{font-size:30px}
 .hero p{font-size:16px}.smallbtn{flex-basis:36px;width:36px;height:36px;font-size:19px}
 .composer{gap:5px}.msg{padding:12px}
}
</style>
</head>
<body>

<header class="topbar">
  <button class="iconbtn" id="menuBtn" aria-label="Open menu">☰</button>
  <button class="brand" id="modelBtn">AI Sameer ⌄</button>
  <button class="iconbtn" id="newBtn" aria-label="New chat">✏️</button>
</header>

<main>
  <section class="hero" id="home">
    <div class="mascot">
      <div class="banana">🍌</div>
      <div class="thumb">👍</div>
    </div>
    <h1>Hey Sameer</h1>
    <p>How can I help you today?</p>
  </section>
  <div id="conversation" aria-live="polite"></div>
</main>

<div class="chatbar">
  <div class="composer">
    <button class="smallbtn" id="plusBtn" aria-label="More features">＋</button>
    <textarea id="message" rows="1" placeholder="Ask AI Sameer..." aria-label="Message"></textarea>
    <button class="smallbtn" id="micBtn" aria-label="Voice input">🎙️</button>
    <button class="smallbtn" id="send" aria-label="Send message">➤</button>
  </div>
  <div class="actions">
    <button id="copyBtn"><span>▢</span>Copy</button>
    <button id="likeBtn"><span>👍</span>Like</button>
    <button id="dislikeBtn"><span>👎</span>Dislike</button>
    <button id="shareBtn"><span>↗</span>Share</button>
    <button id="listenBtn"><span>🔊</span>Listen</button>
  </div>
</div>

<div class="overlay" id="overlay">
 <aside class="drawer">
  <h3>AI Sameer Menu</h3>
  <button class="menuitem" data-action="new"><span class="mi">＋</span>New Chat</button>
  <button class="menuitem" data-action="history"><span class="mi">🔎</span>Search Chats</button>
  <button class="menuitem" data-action="library"><span class="mi">📁</span>Library</button>
  <button class="menuitem" data-action="settings"><span class="mi">⚙️</span>Settings</button>
  <button class="menuitem" data-action="help"><span class="mi">❔</span>Help</button>
  <button class="menuitem" id="closeMenu"><span class="mi">✕</span>Close</button>
 </aside>
</div>

<div class="overlay" id="plusOverlay">
 <aside class="drawer right">
  <h3>Explore Features</h3>
  <button class="menuitem" data-action="photo"><span class="mi">🖼️</span>Photos & Files</button>
  <button class="menuitem" data-action="camera"><span class="mi">📷</span>Camera</button>
  <button class="menuitem" data-action="image"><span class="mi">🎨</span>Image Generation</button>
  <button class="menuitem" data-action="voice"><span class="mi">🎙️</span>Voice Chat</button>
  <button class="menuitem" data-action="search"><span class="mi">🔎</span>Live Search</button>
  <button class="menuitem" data-action="study"><span class="mi">🎓</span>Study & Guided Learning</button>
  <button class="menuitem" data-action="document"><span class="mi">📄</span>Document Analysis</button>
  <button class="menuitem" data-action="code"><span class="mi">💻</span>Code Assistant</button>
  <button class="menuitem" data-action="writing"><span class="mi">🖊️</span>Creative Writing</button>
  <button class="menuitem" data-action="music"><span class="mi">🎵</span>Music Ideas</button>
  <button class="menuitem" data-action="avatar"><span class="mi">🧐</span>Avatar</button>
  <button class="menuitem" data-action="youtube"><span class="mi">▶️</span>YouTube</button>
  <button class="menuitem" data-action="maps"><span class="mi">📍</span>Google Maps</button>
  <button class="menuitem" data-action="instagram"><span class="mi">📸</span>Instagram</button>
  <button class="menuitem" data-action="research"><span class="mi">🔬</span>Deep Research</button>
  <button class="menuitem" data-action="canvas"><span class="mi">📝</span>Canvas</button>
  <button class="menuitem" id="closePlus"><span class="mi">✕</span>Close</button>
 </aside>
</div>

<div class="modal" id="modal">
 <div class="modalbox">
  <h2 id="modalTitle">AI Sameer</h2>
  <div id="modalContent"></div>
  <div class="modal-actions">
   <button class="primary" id="modalOk">Continue</button>
   <button class="secondary" id="modalCancel">Close</button>
  </div>
 </div>
</div>

<input type="file" id="fileInput" hidden accept="image/*,.pdf,.txt,.doc,.docx" multiple>
<input type="file" id="cameraInput" hidden accept="image/*" capture="environment">
<div id="toast"></div>

<script>
(() => {
"use strict";

/* Cloudflare Worker URL */
const WORKER_URL = "https://ai-sameer-api.shaikmahammed757.workers.dev/";

const $ = id => document.getElementById(id);
const overlay = $("overlay");
const plusOverlay = $("plusOverlay");
const modal = $("modal");
const message = $("message");
const conversation = $("conversation");

let currentModel = "Fast";
let lastReply = "";
let busy = false;
let recognition = null;
let latestAssistantMessage = null;
let selectedFiles = [];

function toast(text) {
 const el = $("toast");
 el.textContent = text;
 el.style.display = "block";
 clearTimeout(toast.timer);
 toast.timer = setTimeout(() => el.style.display = "none", 3000);
}
function hideMenus() {
 overlay.classList.remove("show");
 plusOverlay.classList.remove("show");
}
function showModal(title, html, actionLabel, callback) {
 $("modalTitle").textContent = title;
 $("modalContent").innerHTML = html;
 $("modalOk").textContent = actionLabel || "Continue";
 modal.classList.add("show");
 $("modalOk").onclick = () => {
  modal.classList.remove("show");
  if (callback) callback();
 };
}
$("modalCancel").onclick = () => modal.classList.remove("show");
modal.addEventListener("click", e => {
 if (e.target === modal) modal.classList.remove("show");
});

function addMessage(text, who) {
 const div = document.createElement("div");
 div.className = "msg " + who;
 const head = document.createElement("div");
 head.className = "msghead";
 head.textContent = who === "user" ? "You" : "AI Sameer";
 const body = document.createElement("div");
 body.textContent = text;
 div.append(head, body);
 conversation.appendChild(div);
 if (who === "bot") {
  latestAssistantMessage = body;
  const tools = document.createElement("div");
  tools.className = "msgtools";
  const copy = document.createElement("button");
  copy.textContent = "Copy";
  copy.onclick = () => copyText(body.textContent);
  const listen = document.createElement("button");
  listen.textContent = "🔊 Listen";
  listen.onclick = () => speak(body.textContent);
  tools.append(copy, listen);
  div.appendChild(tools);
 }
 div.scrollIntoView({behavior:"smooth",block:"nearest"});
 return {div, body};
}
function copyText(text) {
 if (!text) return toast("ఇంకా సమాధానం లేదు");
 if (navigator.clipboard && navigator.clipboard.writeText) {
  navigator.clipboard.writeText(text)
   .then(() => toast("కాపీ అయింది"))
   .catch(() => fallbackCopy(text));
 } else fallbackCopy(text);
}
function fallbackCopy(text) {
 const input = document.createElement("textarea");
 input.value = text;
 input.style.position = "fixed";
 input.style.opacity = "0";
 document.body.appendChild(input);
 input.select();
 try {
  document.execCommand("copy");
  toast("కాపీ అయింది");
 } catch (_) {
  toast("టెక్స్ట్‌ను నొక్కి పట్టుకొని కాపీ చేయండి");
 }
 input.remove();
}
function speak(text) {
 if (!text) return toast("ముందుగా AI సమాధానం పొందండి");
 if (!("speechSynthesis" in window)) return toast("మీ బ్రౌజర్‌లో Read Aloud మద్దతు లేదు");
 window.speechSynthesis.cancel();
 const utterance = new SpeechSynthesisUtterance(text);
 utterance.lang = /[\u0C00-\u0C7F]/.test(text) ? "te-IN" : "en-IN";
 window.speechSynthesis.speak(utterance);
}
function setBusy(value) {
 busy = value;
 $("send").disabled = value;
 $("send").textContent = value ? "…" : "➤";
}

async function sendMessage(overrideText) {
 let text = (overrideText !== undefined ? overrideText : message.value).trim();
 if (busy) return;
 if (!text && selectedFiles.length) {
  text = "దయచేసి నేను ఎంచుకున్న ఫైళ్లను విశ్లేషించడానికి ఏం చేయాలో అడగండి.";
 }
 if (!text) return;
 if (selectedFiles.length) {
  text += "\n\nఎంచుకున్న ఫైళ్లు: " + selectedFiles.map(f => f.name).join(", ") +
   "\nగమనిక: ఫైల్ పేర్లు మాత్రమే పంపబడ్డాయి; ఫైల్ కంటెంట్ ఈ టెక్స్ట్ APIకి పంపబడలేదు.";
  selectedFiles = [];
 }
 message.value = "";
 message.style.height = "38px";
 addMessage(text, "user");
 setBusy(true);
 const loading = addMessage("సమాధానం తయారు చేస్తున్నాను…", "bot");

 try {
  const response = await fetch(WORKER_URL, {
   method: "POST",
   headers: {"Content-Type":"application/json"},
   body: JSON.stringify({
    message: text,
    model: currentModel
   })
  });
  const raw = await response.text();
  let data;
  try { data = JSON.parse(raw); }
  catch (_) { throw new Error("Worker సరైన JSON సమాధానం ఇవ్వలేదు. Cloudflareలో సరైన Worker కోడ్ Deploy చేయండి."); }

  if (!response.ok) {
   throw new Error(data.error || data.message || ("Server error " + response.status));
  }
  if (data.error) throw new Error(data.error);
  const reply = data.reply || data.answer || data.response || data.text;
  if (typeof reply !== "string" || !reply.trim()) {
   throw new Error("AI సమాధానం రాలేదు. Worker కోడ్ మరియు Gemini API Secret చెక్ చేయండి.");
  }
  loading.body.textContent = reply;
  lastReply = reply;
  latestAssistantMessage = loading.body;
 } catch (err) {
  loading.body.textContent =
   "AI కనెక్షన్ సమస్య: " + (err.message || "Network error") +
   "\n\nCloudflare Workerలో GEMINI_API_KEY Secret ఉందా, Gemini Worker కోడ్ Deploy చేశారా చెక్ చేయండి.";
  toast("AI కనెక్షన్ సమస్య");
 } finally {
  setBusy(false);
 }
}

$("send").onclick = () => sendMessage();
message.addEventListener("keydown", e => {
 if (e.key === "Enter" && !e.shiftKey) {
  e.preventDefault();
  sendMessage();
 }
});
message.addEventListener("input", () => {
 message.style.height = "38px";
 message.style.height = Math.min(message.scrollHeight,110) + "px";
});

$("menuBtn").onclick = () => {
 hideMenus();
 overlay.classList.add("show");
};
$("plusBtn").onclick = () => {
 hideMenus();
 plusOverlay.classList.add("show");
};
$("closeMenu").onclick = () => overlay.classList.remove("show");
$("closePlus").onclick = () => plusOverlay.classList.remove("show");
overlay.addEventListener("click", e => {
 if (e.target === overlay) overlay.classList.remove("show");
});
plusOverlay.addEventListener("click", e => {
 if (e.target === plusOverlay) plusOverlay.classList.remove("show");
});

function newChat() {
 if (busy) return toast("సమాధానం వచ్చే వరకు వేచి ఉండండి");
 conversation.innerHTML = "";
 message.value = "";
 lastReply = "";
 latestAssistantMessage = null;
 selectedFiles = [];
 hideMenus();
 if ("speechSynthesis" in window) window.speechSynthesis.cancel();
 toast("కొత్త చాట్ ప్రారంభమైంది");
}
$("newBtn").onclick = newChat;

$("modelBtn").onclick = () => {
 showModal("Choose AI Sameer Mode", `
  <button class="option" data-model="Fast">⚡ Fast<small>Quick responses</small></button>
  <button class="option" data-model="Pro">👑 Pro<small>General assistance</small></button>
  <button class="option" data-model="Creative">🎨 Creative<small>Creative ideas and writing</small></button>
  <button class="option" data-model="Reasoning">🧠 Reasoning<small>Logical explanations</small></button>
  <p>ఇవి AI Sameer ఇంటర్‌ఫేస్ మోడ్‌లు. నిజమైన మోడల్ మార్పు Worker మద్దతుపై ఆధారపడి ఉంటుంది.</p>
 `,"Close",null);
 document.querySelectorAll("[data-model]").forEach(btn => {
  btn.onclick = () => {
   currentModel = btn.dataset.model;
   $("modelBtn").textContent = "AI Sameer · " + currentModel + " ⌄";
   modal.classList.remove("show");
   toast(currentModel + " mode selected");
  };
 });
};

/* Voice input: requires browser support and microphone permission. */
$("micBtn").onclick = () => {
 const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
 if (!SpeechRecognition) {
  showModal("Voice Input", "<p>ఈ బ్రౌజర్‌లో Speech Recognition అందుబాటులో లేదు. Chromeలో సైట్ తెరిచి మైక్రోఫోన్ అనుమతి ఇవ్వండి. కీబోర్డ్‌లోని మైక్‌తో కూడా మాట్లాడవచ్చు.</p>", "OK");
  return;
 }
 if (recognition) {
  recognition.stop();
  recognition = null;
  $("micBtn").textContent = "🎙️";
  return;
 }
 recognition = new SpeechRecognition();
 recognition.lang = "te-IN";
 recognition.interimResults = true;
 recognition.continuous = false;
 recognition.onstart = () => {
  $("micBtn").textContent = "⏹";
  toast("మాట్లాడండి…");
 };
 recognition.onresult = e => {
  let transcript = "";
  for (let i = e.resultIndex; i < e.results.length; i++) {
   transcript += e.results[i][0].transcript;
  }
  message.value = transcript;
 };
 recognition.onerror = e => toast("మైక్ సమస్య: " + e.error);
 recognition.onend = () => {
  $("micBtn").textContent = "🎙️";
  recognition = null;
 };
 try { recognition.start(); }
 catch (_) { toast("మైక్రోఫోన్ మళ్లీ ప్రయత్నించండి"); }
};

$("copyBtn").onclick = () => copyText(lastReply);
$("likeBtn").onclick = () => toast("ధన్యవాదాలు! 👍");
$("dislikeBtn").onclick = () => toast("ఫీడ్‌బ్యాక్‌కు ధన్యవాదాలు");
$("listenBtn").onclick = () => speak(lastReply);
$("shareBtn").onclick = async () => {
 const text = lastReply || "AI Sameer";
 if (navigator.share) {
  try { await navigator.share({title:"AI Sameer",text}); }
  catch (_) {}
 } else copyText(text);
};

$("fileInput").onchange = e => {
 selectedFiles = Array.from(e.target.files || []);
 if (selectedFiles.length) {
  toast(selectedFiles.length + " ఫైల్(లు) ఎంచుకున్నారు");
  message.value = (message.value ? message.value + "\n" : "") +
   "ఈ ఫైల్(ల) గురించి సహాయం చేయండి: " +
   selectedFiles.map(f => f.name).join(", ");
 }
 e.target.value = "";
};
$("cameraInput").onchange = e => {
 selectedFiles = Array.from(e.target.files || []);
 if (selectedFiles.length) {
  message.value = (message.value ? message.value + "\n" : "") +
   "నా కెమెరా ఫోటో గురించి సహాయం చేయండి: " +
   selectedFiles.map(f => f.name).join(", ");
