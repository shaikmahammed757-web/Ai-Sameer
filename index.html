
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>AI Sameer</title>

<style>
*{box-sizing:border-box}
:root{
  color-scheme:dark;
  --bg:#000;
  --panel:#1c1c1e;
  --line:#303038;
  --text:#f5f5f7;
  --muted:#9b9ba4;
  --blue:#536dfe;
}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
  height:100dvh;
  overflow:hidden;
}
button,input,textarea{font:inherit}
button{color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{
  outline:2px solid #8094ff;
  outline-offset:3px
}
.topbar{
  height:76px;
  padding:0 18px;
  display:flex;
  align-items:center;
  gap:18px;
  border-bottom:1px solid #17171b;
}
.iconbtn{
  border:0;
  background:transparent;
  min-width:44px;
  min-height:44px;
  font-size:27px;
  display:grid;
  place-items:center;
  border-radius:50%;
}
.iconbtn:active,.tool:active{background:#333}
.brand{
  display:flex;
  align-items:center;
  gap:11px;
  font-size:25px;
  font-weight:600;
  letter-spacing:-.5px;
}
.brand-mark{
  display:none;
  width:35px;
  height:35px;
  border-radius:50%;
  background:linear-gradient(135deg,#477cff,#bd6bff);
  color:white;
  place-items:center;
  font-size:20px;
}
.top-spacer{flex:1}
main{
  height:calc(100dvh - 76px);
  display:flex;
  flex-direction:column;
  position:relative;
}
.messages{
  flex:1;
  overflow-y:auto;
  padding:20px 16px 24px;
  scroll-behavior:smooth;
}
.welcome{
  min-height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:15px 10px 35px;
}
.sparkle{
  font-size:67px;
  line-height:1.2;
  background:linear-gradient(135deg,#ffcd57,#44dc9b,#5c87ff,#d38bff);
  color:transparent;
  background-clip:text;
  -webkit-background-clip:text;
  margin-bottom:20px;
}
.welcome h1{
  margin:0;
  font-size:clamp(29px,6vw,43px);
  font-weight:500;
  letter-spacing:-1.3px;
}
.welcome p{
  color:var(--muted);
  font-size:16px;
  line-height:1.6;
  margin-top:15px;
}
.message{
  max-width:850px;
  width:100%;
  margin:0 auto 23px;
  line-height:1.75;
  font-size:17px;
  overflow-wrap:anywhere;
}
.user-message{
  display:flex;
  justify-content:flex-end;
}
.user-bubble{
  background:#202434;
  border-radius:25px 25px 7px 25px;
  padding:14px 18px;
  max-width:88%;
  white-space:pre-wrap;
}
.answer{
  border:1px solid #292d3a;
  background:#11141e;
  border-radius:22px;
  padding:19px;
  white-space:pre-wrap;
}
.answer-actions{
  display:flex;
  flex-wrap:wrap;
  gap:9px;
  border-top:1px solid #30313a;
  padding-top:13px;
  margin-top:15px;
}
.smallbtn{
  border:0;
  border-radius:12px;
  background:transparent;
  padding:8px 10px;
  font-size:19px;
}
.smallbtn:hover{background:#292d3a}
.composer-wrap{
  padding:12px 16px max(14px,env(safe-area-inset-bottom));
  background:#000;
}
.composer{
  max-width:900px;
  margin:auto;
  border:1px solid #303035;
  background:var(--panel);
  border-radius:34px;
  padding:14px 14px 12px 20px;
  box-shadow:0 0 0 1px rgba(255,255,255,.015);
}
#prompt{
  display:block;
  width:100%;
  min-height:42px;
  max-height:150px;
  resize:none;
  border:0;
  outline:0;
  color:var(--text);
  background:transparent;
  font-size:18px;
  padding:7px 0 12px;
}
#prompt::placeholder{color:#a2a2a7}
.composer-row{
  display:flex;
  align-items:center;
  gap:10px;
}
.action-btn{
  flex:0 0 48px;
  height:48px;
  width:48px;
  border:0;
  border-radius:50%;
  background:transparent;
  display:grid;
  place-items:center;
  font-size:27px;
}
.action-btn:hover{background:#303035}
.action-btn:disabled{opacity:.5;cursor:wait}
#sendBtn{
  background:#526dff;
  color:#071024;
  font-size:25px;
  font-weight:bold;
  margin-left:auto;
}
#sendBtn:hover{background:#7890ff}
#micBtn.listening{background:#8d2525;color:white}
.status{
  color:var(--muted);
  font-size:12px;
  text-align:center;
  padding-top:8px;
}
.file-name{
  display:none;
  color:#bfcaff;
  font-size:13px;
  padding:5px 0 10px;
  overflow-wrap:anywhere;
}
.overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.66);
  z-index:10;
}
.overlay.open{display:block}
.drawer{
  position:absolute;
  inset:0 auto 0 0;
  width:min(310px,86vw);
  background:#111114;
  padding:20px 15px;
  overflow-y:auto;
  box-shadow:10px 0 35px #0008;
}
.drawer-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  font-size:21px;
  font-weight:600;
  padding:0 4px 22px;
}
.drawer-item{
  display:flex;
  align-items:center;
  width:100%;
  min-height:53px;
  padding:12px;
  margin:4px 0;
  gap:13px;
  border:0;
  border-radius:14px;
  background:#1c1c20;
  text-align:left;
  font-size:16px;
}
.drawer-item:hover{background:#303038}
.drawer-item span{font-size:21px}
.sheet{
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  max-height:83dvh;
  overflow-y:auto;
  padding:12px 18px max(22px,env(safe-area-inset-bottom));
  background:#1c1c1e;
  border:1px solid #36363b;
  border-radius:30px 30px 0 0;
  box-shadow:0 -15px 50px #0007;
}
.handle{
  width:60px;
  height:5px;
  border-radius:10px;
  background:#777;
  margin:0 auto 23px;
}
.quick-tools{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:12px;
  margin-bottom:19px;
}
.tool{
  min-height:112px;
  border:0;
  border-radius:25px;
  background:#28282b;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:10px;
  font-size:15px;
}
.tool-icon{font-size:34px}
.feature{
  width:100%;
  display:flex;
  align-items:center;
  gap:17px;
  text-align:left;
  border:0;
  border-radius:16px;
  background:transparent;
  padding:13px 10px;
  min-height:75px;
}
.feature:hover{background:#29292d}
.feature-icon{
  width:42px;
  flex-shrink:0;
  text-align:center;
  font-size:27px;
}
.feature strong{display:block;font-size:17px;font-weight:500}
.feature small{display:block;color:var(--muted);font-size:14px;margin-top:5px}
.feature .arrow{margin-left:auto;color:#aaa}
.toast{
  position:fixed;
  z-index:30;
  bottom:150px;
  left:50%;
  transform:translateX(-50%);
  background:#29292d;
  color:white;
  border:1px solid #45454b;
  border-radius:15px;
  padding:12px 17px;
  width:max-content;
  max-width:90vw;
  font-size:14px;
  display:none;
}
.toast.show{display:block}
.typing{color:#a9b6ff}
@media(min-width:700px){
  .messages{padding-top:30px}
  .composer-wrap{padding-left:25px;padding-right:25px}
  .welcome{padding-bottom:20px}
  .sheet{left:auto;right:18px;bottom:100px;width:min(450px,calc(100vw - 36px));border-radius:28px;max-height:75dvh}
}
</style>
</head>

<body>

<header class="topbar">
  <button class="iconbtn" id="menuBtn" aria-label="Open menu">☰</button>
  <div class="brand">
    <span class="brand-mark">✦</span>
    <span>AI Sameer</span>
  </div>
  <div class="top-spacer"></div>
  <button class="iconbtn" id="newChatBtn" aria-label="New chat">✎</button>
</header>

<main>
  <section class="messages" id="messages" aria-live="polite">
    <div class="welcome" id="welcome">
      <div class="sparkle">✦</div>
      <h1>AI Sameer</h1>
      <p>Ask anything. Let's figure it out together.</p>
    </div>
  </section>

  <div class="composer-wrap">
    <form class="composer" id="chatForm">
      <div class="file-name" id="fileName"></div>
      <textarea id="prompt" rows="1" placeholder="Ask AI Sameer..." aria-label="Ask AI Sameer"></textarea>
      <div class="composer-row">
        <button type="button" class="action-btn" id="plusBtn" aria-label="Open features">＋</button>
        <button type="button" class="action-btn" id="micBtn" aria-label="Voice input">🎙</button>
        <button type="button" class="action-btn" id="shareBtn" aria-label="Share website">↗</button>
        <button type="submit" class="action-btn" id="sendBtn" aria-label="Send message">➤</button>
      </div>
    </form>
    <div class="status" id="status"></div>
  </div>
</main>

<input type="file" id="fileInput" hidden accept="image/*,.pdf,.txt,.doc,.docx" multiple>
<input type="file" id="cameraInput" hidden accept="image/*" capture="environment">

<div class="overlay" id="menuOverlay">
  <nav class="drawer">
    <div class="drawer-head">
      <span>AI Sameer</span>
      <button class="iconbtn closeOverlay" aria-label="Close menu">×</button>
    </div>
    <button class="drawer-item" id="drawerNew"><span>✎</span>New chat</button>
    <button class="drawer-item" id="searchChats"><span>⌕</span>Search chats</button>
    <button class="drawer-item" data-feature="Images"><span>🖼️</span>Images</button>
    <button class="drawer-item" id="historyBtn"><span>◷</span>Chat history</button>
    <button class="drawer-item" id="clearBtn"><span>🗑️</span>Clear current chat</button>
  </nav>
</div>

<div class="overlay" id="featureOverlay">
  <section class="sheet" aria-label="AI Sameer features">
    <div class="handle"></div>
    <div class="quick-tools">
      <button class="tool" data-feature="Photos"><span class="tool-icon">🖼️</span>Photos</button>
      <button class="tool" data-feature="Camera"><span class="tool-icon">📸</span>Camera</button>
      <button class="tool" data-feature="Avatar"><span class="tool-icon">😊</span>Avatar</button>
    </div>

    <button class="feature" data-feature="Images">
      <span class="feature-icon">🎨</span>
      <span><strong>Images</strong><small>Create and edit</small></span>
      <span class="arrow">›</span>
    </button>
    <button class="feature" data-feature="Music">
      <span class="feature-icon">🎵</span>
      <span><strong>Music</strong><small>Make audio tracks</small></span>
      <span class="arrow">›</span>
    </button>
    <button class="feature" data-feature="Canvas">
      <span class="feature-icon">▣</span>
      <span><strong>Canvas</strong><small>Code, write or make slides</small></span>
      <span class="arrow">›</span>
    </button>
    <button class="feature" data-feature="Deep Research">
      <span class="feature-icon">◎</span>
      <span><strong>Deep Research</strong><small>Explore a topic in detail</small></span>
      <span class="arrow">›</span>
    </button>
    <button class="feature" data-feature="Guided Learning">
      <span class="feature-icon">📖</span>
      <span><strong>Guided Learning</strong><small>Get step-by-step help</small></span>
      <span class="arrow">›</span>
    </button>
  </section>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";

/*
  This URL points to your existing Cloudflare Worker.
  Keep API keys in the Worker, never in this HTML file.
*/
const API_URL = "https://ai-sameer-api.shaikmahammed757.workers.dev";

const $ = id => document.getElementById(id);
const messages = $("messages");
const promptBox = $("prompt");
const chatForm = $("chatForm");
const statusBox = $("status");
const toastBox = $("toast");
const fileInput = $("fileInput");
const cameraInput = $("cameraInput");

let conversation = [];
let selectedFiles = [];
let busy = false;
let recognition = null;
let listening = false;

function toast(text) {
  toastBox.textContent = text;
  toastBox.classList.add("show");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => toastBox.classList.remove("show"), 2800);
}

function setStatus(text) {
  statusBox.textContent = text || "";
}

function openOverlay(id) {
  $(id).classList.add("open");
}

function closeOverlay(id) {
  $(id).classList.remove("open");
}

$("menuBtn").addEventListener("click", () => openOverlay("menuOverlay"));
$("plusBtn").addEventListener("click", () => openOverlay("featureOverlay"));

document.querySelectorAll(".closeOverlay").forEach(button => {
  button.addEventListener("click", () => closeOverlay("menuOverlay"));
});

$("menuOverlay").addEventListener("click", event => {
  if (event.target === $("menuOverlay")) closeOverlay("menuOverlay");
});

$("featureOverlay").addEventListener("click", event => {
  if (event.target === $("featureOverlay")) closeOverlay("featureOverlay");
});

function showWelcome() {
  if (!$("welcome")) {
    const welcome = document.createElement("div");
    welcome.className = "welcome";
    welcome.id = "welcome";
    welcome.innerHTML =
      '<div class="sparkle">✦</div><h1>AI Sameer</h1>' +
      '<p>Ask anything. Let\\'s figure it out together.</p>';
    messages.appendChild(welcome);
  }
}

function startNewChat() {
  conversation = [];
  messages.innerHTML = "";
  showWelcome();
  promptBox.value = "";
  selectedFiles = [];
  $("fileName").style.display = "none";
  $("fileName").textContent = "";
  setStatus("");
  closeOverlay("menuOverlay");
  promptBox.focus();
}

$("newChatBtn").addEventListener("click", startNewChat);
$("drawerNew").addEventListener("click", startNewChat);

$("clearBtn").addEventListener("click", () => {
  if (confirm("Clear this conversation?")) startNewChat();
});

$("searchChats").addEventListener("click", () => {
  closeOverlay("menuOverlay");
  const term = prompt("Search text in this conversation:");
  if (!term) return;
  const found = [...messages.querySelectorAll(".message")]
    .some(el => el.textContent.toLowerCase().includes(term.toLowerCase()));
  toast(found ? "Matching text found in this chat." : "No match in this chat.");
});

$("historyBtn").addEventListener("click", () => {
  closeOverlay("menuOverlay");
  toast("Chat history is not stored between sessions in this version.");
});

function removeWelcome() {
  const welcome = $("welcome");
  if (welcome) welcome.remove();
}

function addMessage(role, text, options = {}) {
  removeWelcome();

  const wrap = document.createElement("div");
  wrap.className = "message " + (role === "user" ? "user-message" : "assistant-message");

  if (role === "user") {
    const bubble = document.createElement("div");
    bubble.className = "user-bubble";
    bubble.textContent = text;
    wrap.appendChild(bubble);
  } else {
    const answer = document.createElement("div");
    answer.className = "answer";
    answer.textContent = text;
    wrap.appendChild(answer);

    if (!options.noActions) {
      const actions = document.createElement("div");
      actions.className = "answer-actions";

      const copy = document.createElement("button");
      copy.className = "smallbtn";
      copy.textContent = "📋";
      copy.title = "Copy answer";
      copy.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(text);
          toast("Answer copied.");
        } catch {
          toast("Copy unavailable. Please select the answer and copy it.");
        }
      });

      const like = document.createElement("button");
      like.className = "smallbtn";
      like.textContent = "👍";
      like.title = "Helpful";
      like.addEventListener("click", () => {
        like.textContent = "👍 ✓";
        toast("Thanks for your feedback.");
      });

      const dislike = document.createElement("button");
      dislike.className = "smallbtn";
      dislike.textContent = "👎";
      dislike.title = "Not helpful";
      dislike.addEventListener("click", () => {
        dislike.textContent = "👎 ✓";
        toast("Feedback recorded for this page.");
      });

      const speak = document.createElement("button");
      speak.className = "smallbtn";
      speak.textContent = "🔊";
      speak.title = "Read answer aloud";
      speak.addEventListener("click", () => speakText(text));

      const share = document.createElement("button");
      share.className = "smallbtn";
      share.textContent = "↗";
      share.title = "Share answer";
      share.addEventListener("click", async () => {
        try {
          if (navigator.share) {
            await navigator.share({ title: "AI Sameer", text });
          } else {
            await navigator.clipboard.writeText(text);
            toast("Answer copied. You can share it in another app.");
          }
        } catch (error) {
          if (error.name !== "AbortError") toast("Sharing was not available.");
        }
      });

      actions.append(copy, like, dislike, speak, share);
      wrap.appendChild(actions);
    }
  }

  messages.appendChild(wrap);
  messages.scrollTop = messages.scrollHeight;
  return wrap;
}

function speakText(text) {
  if (!("speechSynthesis" in window)) {
    toast("Voice playback is not supported by this browser.");
    return;
  }
  speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = /[\u0C00-\u0C7F]/.test(text) ? "te-IN" : "en-IN";
  speechSynthesis.speak(utterance);
}

async function sendMessage(event) {
  if (event) event.preventDefault();
  if (busy) return;

  const text = promptBox.value.trim();
  if (!text && selectedFiles.length === 0) {
    toast("Please type a message first.");
    return;
  }

  const outgoing = text || "Please help me understand the attached file.";
  addMessage("user", outgoing);

  conversation.push({ role: "user", content: outgoing });

  promptBox.value = "";
  promptBox.style.height = "42px";

  if (selectedFiles.length) {
    const names = selectedFiles.map(f => f.name).join(", ");
    addMessage("assistant",
      "Selected file(s): " + names +
      "\nFile upload and image/document analysis must also be implemented in your secure backend before the AI can read these files.");
    selectedFiles = [];
    $("fileName").style.display = "none";
    $("fileName").textContent = "";
  }

  busy = true;
  $("sendBtn").disabled = true;
  setStatus("AI Sameer is thinking...");

  const loading = addMessage("assistant", "Thinking...", { noActions: true });
  loading.firstChild.classList.add("typing");

  try {
    const response = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: conversation })
    });

    const raw = await response.text();
    let data;

    try {
      data = JSON.parse(raw);
    } catch {
      throw new Error("The AI server returned an invalid response. Check the Cloudflare Worker.");
    }

    if (!response.ok) {
      const detail = data.error?.message || data.message || data.error || "";
      throw new Error(
        "AI server error (" + response.status + "). " +
        (typeof detail === "string" ? detail : JSON.stringify(detail))
      );
    }

    const answer = data.answer || data.reply ||
      data.output_text || data.response ||
      data.choices?.[0]?.message?.content;

    if (!answer || typeof answer !== "string") {
      if (data.status === "ready") {
        throw new Error("The Worker is running, but it returned a status message instead of an AI answer. Check its AI API route.");
      }
      throw new Error("The server did not return an answer. Check the Worker response format.");
    }

    loading.remove();
    conversation.push({ role: "assistant", content: answer });
    addMessage("assistant", answer);
  } catch (error) {
    loading.remove();
    const message = error.message || "Unknown connection error.";

    addMessage("assistant",
      "AI Sameer could not get an AI answer.\n\n" + message +
      "\n\nPlease check the Cloudflare Worker, its API connection, and available API credits.");

    setStatus("Connection or API problem");
  } finally {
    busy = false;
    $("sendBtn").disabled = false;
    if (!statusBox.textContent.includes("problem")) setStatus("");
    messages.scrollTop = messages.scrollHeight;
  }
}

chatForm.addEventListener("submit", sendMessage);

promptBox.addEventListener("input", () => {
  promptBox.style.height = "42px";
  promptBox.style.height = Math.min(promptBox.scrollHeight, 150) + "px";
});

promptBox.addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
});

$("shareBtn").addEventListener("click", async () => {
  try {
    if (navigator.share) {
      await navigator.share({
        title: "AI Sameer",
