<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bharat Chakravyuh</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(#FF9933,#ffffff,#138808);
min-height:100vh;
}

#home{
padding:15px;
text-align:center;
}

.top{
display:flex;
justify-content:space-between;
margin-bottom:20px;
}

.box{
background:#0d47a1;
color:#fff;
padding:12px 20px;
border-radius:15px;
font-size:20px;
font-weight:bold;
}

.title{
font-size:42px;
font-weight:bold;
color:#ff6f00;
text-shadow:2px 2px 4px #000;
}

.sub{
font-size:22px;
color:#000;
margin-bottom:20px;
}

.preview{
height:250px;
background:#fff;
border:5px solid #0d47a1;
border-radius:20px;
display:flex;
align-items:center;
justify-content:center;
font-size:34px;
font-weight:bold;
}

.cards{
display:flex;
gap:10px;
margin-top:15px;
}

.card{
flex:1;
background:#0d47a1;
color:#fff;
padding:20px;
border-radius:15px;
font-size:18px;
}

.play{
width:100%;
margin-top:20px;
padding:18px;
font-size:30px;
background:#2ecc40;
color:#fff;
border:none;
border-radius:20px;
font-weight:bold;
}

#game{
display:none;
text-align:center;
}

#level{
font-size:28px;
font-weight:bold;
padding:10px;
background:#fff;
}

canvas{
background:#fff;
display:block;
margin:auto;
touch-action:none;
}
</style>
</head>

<body>

<div id="home">

<div class="top">
<div class="box">🪙 1250</div>
<div class="box">❤️ 3</div>
</div>

<div class="title">🇮🇳 BHARAT</div>
<div class="sub">🌀 Chakravyuh Puzzle</div>

<div class="preview">
🏹 1000+ Levels
</div>

<div class="cards">
<div class="card">🎁 Reward</div>
<div class="card">💡 Hint</div>
</div>

<button class="play" onclick="startGame()">
▶ PLAY
</button>

</div>

<div id="game">

<div id="level">
Level 1
</div>

<canvas id="mazeCanvas"></canvas>

</div>

<script>

let level=1;

const canvas=
document.getElementById("mazeCanvas");

const ctx=
canvas.getContext("2d");

function startGame(){

document.getElementById("home").style.display="none";
document.getElementById("game").style.display="block";

generateMaze();

}

function generateMaze(){

canvas.width=window.innerWidth;
canvas.height=window.innerHeight-70;

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);

ctx.fillStyle="white";
ctx.fillRect(
0,
0,
canvas.width,
canvas.height
);

ctx.strokeStyle="#000080";
ctx.lineWidth=5;

let walls=80+(level*2);

for(let i=0;i<walls;i++){

let x=Math.random()*canvas.width;
let y=Math.random()*canvas.height;

ctx.beginPath();

ctx.moveTo(x,y);

ctx.lineTo(
x+Math.random()*100,
y
);

ctx.lineTo(
x+Math.random()*100,
y+Math.random()*100
);

ctx.stroke();
}

ctx.fillStyle="green";

ctx.fillRect(
canvas.width-60,
canvas.height-60,
35,
35
);

document.getElementById(
"level"
).innerHTML=
"🏹 Level "+level;

}

canvas.addEventListener(
"click",
function(){

level++;

generateMaze();

}
);

window.addEventListener(
"resize",
generateMaze
);

</script>

</body>
</html>
