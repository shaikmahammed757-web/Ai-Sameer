
<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#10111a">
<title>AI Sameer - Your AI Assistant</title>
<style>
:root {
  --bg:#10111a;
  --panel:#181a27;
  --panel2:#222437;
  --text:#f5f5fb;
  --muted:#a3a7bd;
  --accent:#8175ff;
  --border:#303247;
  --user:#343052;
}
* { box-sizing:border-box; }
body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,"Noto Sans Telugu",sans-serif;
  min-height:100vh;
}
button,input,textarea,select { font:inherit; }
button { cursor:pointer; }
.app { display:flex; min-height:100vh; }
.sidebar {
  width:260px;
  flex-shrink:0;
  background:#141520;
  border-right:1px solid var(--border);
  padding:18px;
  display:flex;
  flex-direction:column;
  gap:15px;
}
.brand {
  display:flex;
  align-items:center;
  gap:10px;
  font-size:21px;
  font-weight:800;
}
.logo {
  width:42px;height:42px;border-radius:14px;
  display:grid;place-items:center;
  background:linear-gradient(135deg,#8b5cf6,#3b82f6);
  color:white;font-size:22px;
}
.new-chat,.side-btn {
  border:1px solid var(--border);
  background:var(--panel);
  color:var(--text);
  border-radius:12px;
  padding:12px;
  text-align:left;
  width:100%;
}
.new-chat:hover,.side-btn:hover { background:var(--panel2); }
.section-label {
  color:var(--muted);
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:1px;
  margin:8px 0 0;
}
.history {
  display:flex;
  flex-direction:column;
  gap:6px;
  overflow:auto;
  max-height:45vh;
}
.history-item {
  padding:10px;
  border-radius:9px;
  background:transparent;
  border:0;
  color:var(--muted);
  text-align:left;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}
.history-item:hover { background:var(--panel2);color:white; }
.sidebar-bottom { margin-top:auto; }
.main {
  min-width:0;
  flex:1;
  display:flex;
  flex-direction:column;
  min-height:100vh;
}
.topbar {
  min-height:68px;
  padding:12px 22px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}
.top-left { display:flex;align-items:center;gap:12px; }
.topbar h2 { font-size:17px;margin:0; }
.status { color:#78dfac;font-size:12px;margin-top:3px; }
.language {
  background:var(--panel);
  color:var(--text);
  border:1px solid var(--border);
  border-radius:10px;
  padding:9px;
  max-width:150px;
}
.mobile-menu { display:none; }
.content {
  flex:1;
  width:100%;
  max-width:900px;
  margin:0 auto;
  padding:25px 20px 18px;
  display:flex;
  flex-direction:column;
  gap:20px;
}
.welcome {
  margin:auto 0;
  text-align:center;
  padding:30px 0;
}
.welcome-logo {
  margin:0 auto 18px;
  width:75px;height:75px;border-radius:25px;
  display:grid;place-items:center;
  font-size:36px;font-weight:800;
  background:linear-gradient(135deg,#8b5cf6,#3979ef);
  box-shadow:0 10px 40px #6655ff33;
}
.welcome h1 { font-size:clamp(27px,5vw,39px);margin:0 0 12px; }
.welcome p { color:var(--muted);line-height:1.8;margin:0 auto;max-width:530px; }
.suggestions {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
  margin-top:28px;
}
.suggestion {
  background:var(--panel);
  border:1px solid var(--border);
  color:var(--text);
  text-align:left;
  border-radius:14px;
  padding:15px;
  line-height:1.6;
}
.suggestion:hover { border-color:var(--accent); }
.messages { display:flex;flex-direction:column;gap:23px; }
.message { display:flex;gap:12px;align-items:flex-start;min-width:0; }
.avatar {
  width:35px;height:35px;flex-shrink:0;
  display:grid;place-items:center;
  border-radius:12px;background:var(--panel2);
  font-weight:700;
}
.message.user .avatar { background:#504486; }
.message-body { min-width:0;flex:1; }
.message-name { font-size:13px;color:var(--muted);margin-bottom:7px; }
.bubble {
  line-height:1.85;
  overflow-wrap:anywhere;
  white-space:pre-wrap;
}
.message.user .bubble {
  background:var(--user);
  padding:12px 15px;
  border-radius:4px 15px 15px 15px;
}
.message-actions {
  display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;
}
.action {
  border:1px solid var(--border);
  background:transparent;color:var(--muted);
  padding:6px 9px;border-radius:8px;font-size:12px;
}
.action:hover { color:white;background:var(--panel2); }
.error { color:#ff9d9d; }
.typing { color:var(--muted);padding:10px 0; }
.composer-wrap {
  width:100%;max-width:900px;margin:0 auto;
  padding:10px 20px 18px;
}
.mode-row { display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px; }
.mode {
  border:1px solid var(--border);border-radius:20px;
  background:transparent;color:var(--muted);
  padding:7px 12px;font-size:12px;
}
.mode.active { background:#39315f;border-color:#8175ff;color:white; }
.composer {
  background:var(--panel);
  border:1px solid #41435c;
  border-radius:19px;
  padding:12px;
  box-shadow:0 8px 35px #0002;
}
#prompt {
  width:100%;resize:none;min-height:48px;max-height:180px;
  border:0;outline:0;background:transparent;
  color:var(--text);padding:8px;
  line-height:1.7;
}
#prompt::placeholder { color:#898da4; }
.composer-tools {
  display:flex;align-items:center;gap:8px;
  justify-content:space-between;
}
.tool-group { display:flex;gap:7px;align-items:center; }
.tool {
  border:1px solid var(--border);
  background:var(--panel2);
  color:var(--text);
  border-radius:10px;
  padding:9px 11px;
}
.tool:disabled { opacity:.5;cursor:default; }
.send {
  background:var(--accent);color:white;
  border:0;border-radius:12px;
  padding:10px 17px;font-weight:700;
}
.send:hover { background:#6c5ce7; }
.send:disabled { opacity:.5; }
.hint { color:var(--muted);font-size:11px;text-align:center;margin-top:10px; }
.file-info { color:#b9b0ff;font-size:12px;padding:4px 8px; }
.footer { color:#6f738a;font-size:11px;text-align:center;padding:0 15px 12px; }
.hidden { display:none !important; }
@media(max-width:720px) {
  .sidebar {
    position:fixed;z-index:20;left:-280px;top:0;bottom:0;
    transition:left .2s;box-shadow:10px 0 40px #0005;
  }
  .sidebar.open { left:0; }
  .mobile-menu { display:inline-block; }
  .topbar { padding:12px 14px; }
  .content { padding:18px 14px; }
  .composer-wrap { padding:8px 12px 14px; }
  .suggestions { grid-template-columns:1fr; }
  .language { max-width:125px; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="logo">S</div><span>AI Sameer</span></div>
    <button class="new-chat" id="newChat">＋ కొత్త చాట్</button>
    <div class="section-label">చాట్ హిస్టరీ</div>
    <div class="history" id="history"></div>
    <div class="sidebar-bottom">
      <button class="side-btn" id="clearHistory">🗑 చాట్ హిస్టరీ క్లియర్</button>
      <button class="side-btn" id="aboutBtn" style="margin-top:8px">ⓘ AI Sameer గురించి</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="top-left">
        <button class="tool mobile-menu" id="menuBtn" aria-label="Menu">☰</button>
        <div>
          <h2>AI Sameer</h2>
          <div class="status" id="status">● AI Assistant</div>
        </div>
      </div>
      <select class="language" id="language" aria-label="Response language">
        <option value="auto">భాష: ఆటో</option>
        <option value="Telugu">తెలుగు</option>
        <option value="English">English</option>
        <option value="Hindi">हिन्दी</option>
        <option value="Kannada">ಕನ್ನಡ</option>
        <option value="Tamil">தமிழ்</option>
        <option value="Malayalam">മലയാളം</option>
        <option value="Urdu">اردو</option>
        <option value="Bengali">বাংলা</option>
        <option value="Marathi">मराठी</option>
        <option value="Gujarati">ગુજરાતી</option>
        <option value="Punjabi">ਪੰਜਾਬੀ</option>
        <option value="Odia">ଓଡ଼ିଆ</option>
        <option value="Assamese">অসমীয়া</option>
        <option value="Sanskrit">संस्कृतम्</option>
        <option value="Konkani">कोंकणी</option>
        <option value="Nepali">नेपाली</option>
        <option value="Sindhi">سنڌي</option>
        <option value="Kashmiri">कॉशुर</option>
        <option value="Manipuri">মেইতেই</option>
        <option value="Bodo">बर'</option>
        <option value="Dogri">डोगरी</option>
        <option value="Maithili">मैथिली</option>
      </select>
    </header>

    <section class="content" id="content">
      <div class="welcome" id="welcome">
        <div class="welcome-logo">S</div>
        <h1>నమస్కారం! 👋</h1>
        <p>నేను AI Sameer. మీ ప్రశ్నలకు సమాధానాలు, రైటింగ్, కోడింగ్, ఆలోచనలు మరియు రోజువారీ పనుల్లో సహాయం చేయడానికి సిద్ధంగా ఉన్నాను.</p>
        <div class="suggestions">
          <button class="suggestion" data-prompt="నాకు ఇంగ్లీష్ నేర్చుకోవడానికి రోజువారీ ప్లాన్ ఇవ్వండి.">📚 ఇంగ్లీష్ నేర్చుకోవడం</button>
          <button class="suggestion" data-prompt="ఒక మంచి YouTube వీడియో ఐడియా, టైటిల్, డిస్క్రిప్షన్ ఇవ్వండి.">🎬 YouTube వీడియో ఐడియాలు</button>
          <button class="suggestion" data-prompt="ఈ కోడ్ ఎలా పనిచేస్తుందో సులభంగా వివరించండి.">💻 కోడింగ్ సహాయం</button>
          <button class="suggestion" data-prompt="నాకు కొత్త వ్యాపార ఆలోచనలు చెప్పండి.">💡 కొత్త ఆలోచనలు</button>
        </div>
      </div>
      <div class="messages" id="messages"></div>
    </section>

    <div class="composer-wrap">
      <div class="mode-row">
        <button class="mode active" data-mode="chat">💬 చాట్</button>
        <button class="mode" data-mode="research">🔎 వివరమైన సమాధానం</button>
        <button class="mode" data-mode="code">💻 కోడింగ్</button>
        <button class="mode" data-mode="image">🎨 చిత్ర ఆలోచన</button>
      </div>
      <div class="composer">
        <textarea id="prompt" placeholder="మీ ప్రశ్నను ఇక్కడ టైప్ చేయండి..." rows="1"></textarea>
        <div class="file-info hidden" id="fileInfo"></div>
        <div class="composer-tools">
          <div class="tool-group">
            <button class="tool" id="attachBtn" title="Text file attachment">＋</button>
            <input type="file" id="fileInput" class="hidden" accept=".txt,.md,.csv,.json,.html,.css,.js,.py">
            <button class="tool" id="micBtn" title="Voice input">🎙️</button>
          </div>
          <button class="send" id="sendBtn">పంపండి ↑</button>
        </div>
      </div>
      <div class="hint">AI సమాధానాల్లో పొరపాట్లు ఉండవచ్చు. ముఖ్యమైన సమాచారాన్ని ధృవీకరించండి.</div>
    </div>
    <div class="footer">AI Sameer · Powered by OpenAI API</div>
  </main>
</div>

<script>
(() => {
  // మీ Cloudflare Worker చిరునామా
  const API_URL = "https://ai-sameer-api.shaikmahammed757.workers.dev";

  const $ = id => document.getElementById(id);
  const promptEl = $("prompt");
  const messagesEl = $("messages");
  const welcomeEl = $("welcome");
  const statusEl = $("status");
  const sendBtn = $("sendBtn");
  const fileInput = $("fileInput");
  const fileInfo = $("fileInfo");

  let chats = [];
  let currentId = null;
  let mode = "chat";
  let attachedText = "";
  let attachedName = "";
  let busy = false;

  try {
    chats = JSON.parse(localStorage.getItem("aiSameerChats") || "[]");
    if (!Array.isArray(chats)) chats = [];
  } catch {
    chats = [];
  }

  function saveChats() {
    try {
      localStorage.setItem("aiSameerChats", JSON.stringify(chats));
    } catch (e) {
      console.warn("Chat history could not be saved.", e);
    }
  }

  function getCurrentChat() {
    return chats.find(c => c.id === currentId);
  }

  function createChat() {
    currentId = String(Date.now()) + Math.random().toString(36).slice(2,7);
    chats.unshift({ id: currentId, title: "కొత్త చాట్", messages: [] });
    saveChats();
    renderHistory();
    renderMessages();
    promptEl.value = "";
    promptEl.focus();
    $("sidebar").classList.remove("open");
  }

  function renderHistory() {
    const history = $("history");
    history.replaceChildren();
    chats.forEach(chat => {
      const btn = document.createElement("button");
      btn.className = "history-item";
      btn.textContent = "💬 " + (chat.title || "కొత్త చాట్");
      btn.title = chat.title || "కొత్త చాట్";
      btn.onclick = () => {
        currentId = chat.id;
        renderMessages();
        renderHistory();
        $("sidebar").classList.remove("open");
      };
      if (chat.id === currentId) {
        btn.style.background = "#29283e";
        btn.style.color = "#fff";
      }
      history.appendChild(btn);
    });
  }

  function addMessageElement(role, text, error = false) {
    const row = document.createElement("div");
    row.className = "message " + (role === "user" ? "user" : "assistant");

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = role === "user" ? "మీరు" : "S";

    const body = document.createElement("div");
    body.className = "message-body";

    const name = document.createElement("div");
    name.className = "message-name";
    name.textContent = role === "user" ? "మీరు" : "AI Sameer";

    const bubble = document.createElement("div");
    bubble.className = "bubble" + (error ? " error" : "");
    bubble.textContent = text;

    body.append(name, bubble);

    if (role === "assistant" && !error) {
      const actions = document.createElement("div");
      actions.className = "message-actions";

      const addAction = (label, fn) => {
        const btn = document.createElement("button");
        btn.className = "action";
        btn.textContent = label;
        btn.onclick = fn;
        actions.appendChild(btn);
      };

      addAction("📋 Copy", async () => {
        try {
          await navigator.clipboard.writeText(text);
          statusEl.textContent = "✓ కాపీ అయింది";
        } catch {
          statusEl.textContent = "కాపీ చేయలేకపోయాం";
        }
      });

      addAction("👍", () => {
        statusEl.textContent = "ధన్యవాదాలు! మీ అభిప్రాయం నమోదు అయింది.";
      });

      addAction("👎", () => {
        statusEl.textContent = "మీ అభిప్రాయానికి ధన్యవాదాలు.";
      });

      addAction("📤 Share", async () => {
        try {
          if (navigator.share) {
            await navigator.share({ title: "AI Sameer", text });
          } else {
            await navigator.clipboard.writeText(text);
            statusEl.textContent = "సమాధానం కాపీ అయింది. షేర్ చేయడానికి పేస్ట్ చేయండి.";
          }
        } catch (e) {
          if (e.name !== "AbortError") statusEl.textContent = "షేర్ చేయలేకపోయాం.";
        }
      });

      addAction("🔊 Listen", () => {
        if (!("speechSynthesis" in window)) {
          statusEl.textContent = "ఈ బ్రౌజర్‌లో వాయిస్ సపోర్ట్ లేదు.";
          return;
        }
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        const lang = $("language").value;
        const voiceLanguages = {
          Telugu: "te-IN", English: "en-IN", Hindi: "hi-IN",
          Kannada: "kn-IN", Tamil: "ta-IN", Malayalam: "ml-IN",
          Urdu: "ur-IN", Bengali: "bn-IN", Marathi: "mr-IN",
          Gujarati: "gu-IN", Punjabi: "pa-IN", Odia: "or-IN"
        };
        utterance.lang = voiceLanguages[lang] || "en-IN";
        window.speechSynthesis.speak(utterance);
      });

      body.appendChild(actions);
    }

    row.append(avatar, body);
    messagesEl.appendChild(row);
    return { row, bubble };
  }

  function renderMessages() {
    messagesEl.replaceChildren();
    const chat = getCurrentChat();
    const list = chat ? chat.messages : [];
    welcomeEl.classList.toggle("hidden", list.length > 0);
    list.forEach(m => addMessageElement(m.role, m.content));
    scrollToBottom();
  }

  function scrollToBottom() {
    window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
  }

  function setBusy(value) {
    busy = value;
    sendBtn.disabled = value;
    sendBtn.textContent = value ? "వేచి ఉండండి..." : "పంపండి ↑";
    statusEl.textContent = value ? "● సమాధానం తయారవుతోంది..." : "● AI Assistant";
  }

  function selectedLanguageInstruction() {
    const language = $("language").value;
    if (language === "auto") return "";
    return "Please answer in " + language + ". ";
  }

  function modeInstruction() {
    if (mode === "research") {
      return "Give a detailed, well-organized answer. Be honest if information needs current web verification. Do not invent sources. ";
    }
    if (mode === "code") {
      return "Help with programming. Explain clearly and provide complete, usable code when appropriate. ";
    }
    if (mode === "image") {
      return "Help create a detailed image-generation prompt. Important: you can provide text prompts but cannot generate an image in this chat endpoint. ";
    }
    return "";
  }

  async function sendMessage(prefilled) {
    if (busy) return;
    let question = typeof prefilled === "string" ? prefilled : promptEl.value.trim();
    if (!question && attachedText) question = "దయచేసి ఈ ఫైల్‌ను పరిశీలించండి.";
    if (!question) {
      promptEl.focus();
      return;
    }

    if (attachedText) {
      question += "\n\nAttached text file (" + attachedName + "):\n" + attachedText;
    }

    let chat = getCurrentChat();
    if (!chat) {
      createChat();
      chat = getCurrentChat();
    }

    const originalQuestion = question;
    chat.messages.push({ role: "user", content: originalQuestion });
    if (chat.title === "కొత్త చాట్") {
      chat.title = originalQuestion.replace(/\s+/g, " ").slice(0, 36);
    }

    promptEl.value = "";
    attachedText = "";
    attachedName = "";
    fileInput.value = "";
    fileInfo.classList.add("hidden");
    renderMessages();
    renderHistory();
    saveChats();

    const typing = addMessageElement("assistant", "సమాధానం తయారవుతోంది...");
    typing.bubble.classList.add("typing");
    setBusy(true);

    const history = chat.messages
      .slice(-16)
      .map(m => ({
        role: m.role,
        content: m.role === "user"
          ? modeInstruction() + selectedLanguageInstruction() + m.content
          : m.content
      }));

    try {
      const response = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: history })
      });

      let data;
      try {
        data = await response.json();
      } catch {
