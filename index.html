<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SK MD Bike Puzzle & Earn</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0f172a;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
        }
        header {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            padding: 14px;
            font-size: 18px;
            font-weight: bold;
            color: #000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .container {
            padding: 10px;
            max-width: 400px;
            margin: auto;
        }
        .wallet-box {
            background: #1e293b;
            border: 2px solid #f59e0b;
            padding: 8px;
            margin: 8px 0;
            border-radius: 8px;
        }
        .balance-text {
            color: #4ade80;
            font-weight: bold;
            font-size: 16px;
        }
        .game-screen {
            background: #1e293b;
            border: 3px solid #3b82f6;
            border-radius: 12px;
            padding: 10px;
            margin-top: 5px;
        }
        /* Blueprint layout like reference image */
        .blueprint-board {
            width: 100%;
            height: 180px;
            background: #1e3a8a;
            border: 3px dashed #60a5fa;
            border-radius: 10px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 4px;
            padding: 4px;
            margin-bottom: 10px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
        }
        .blueprint-slot {
            background: rgba(15, 23, 42, 0.6);
            border: 2px solid #93c5fd;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            cursor: pointer;
        }
        .parts-pool {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin-bottom: 10px;
        }
        .pool-piece {
            background: #334155;
            border: 2px solid #f59e0b;
            border-radius: 8px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            cursor: pointer;
            transition: 0.2s;
        }
        .pool-piece:active {
            transform: scale(0.92);
            background: #475569;
        }
        .action-btn {
            background: #22c55e;
            color: white;
            border: none;
            padding: 10px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>
<body>

    <header>SK MD Bike Puzzle & Earn</header>

    <div class="container">
        <div class="wallet-box">
            <p style="margin:2px 0;">Wallet Balance: <span class="balance-text" id="balance">₹0</span></p>
            <p style="margin:2px 0; font-size: 11px; color: #94a3b8;">Min. Withdrawal Limit: <b>₹1000</b></p>
        </div>

        <div class="game-screen">
            <h3 style="margin:4px 0;">Bike Blueprint Assembly</h3>
            <p style="font-size: 11px; color: #cbd5e1; margin-bottom: 8px;">Tap a part below, then tap the blueprint slot to fix it!</p>
            
            <!-- Blueprint Slots -->
            <div class="blueprint-board">
                <div class="blueprint-slot" id="slot0" onclick="fitPart(0)">❓</div>
                <div class="blueprint-slot" id="slot1" onclick="fitPart(1)">❓</div>
                <div class="blueprint-slot" id="slot2" onclick="fitPart(2)">❓</div>
                <div class="blueprint-slot" id="slot3" onclick="fitPart(3)">❓</div>
            </div>

            <div style="font-size:12px; color:#f59e0b; margin-bottom:4px;">Available Bike Parts to Fix</div>
            
            <!-- Available Pieces Pool -->
            <div class="parts-pool" id="poolContainer">
                <!-- Generated via JS -->
            </div>

            <button class="action-btn" onclick="checkPuzzleCompletion()">Check & Earn ₹50</button>
        </div>
    </div>

    <script>
        let balance = 0;
        let selectedIcon = null;
        const correctParts = ['🛞', '⛽', '⚙️', '⛓️']; // Correct bike parts
        let currentSlots = ['❓', '❓', '❓', '❓'];

        function initGame() {
            document.getElementById("balance").innerText = "₹" + balance;
            currentSlots = ['❓', '❓', '❓', '❓'];
            updateBoard();
            
            let pool = document.getElementById("poolContainer");
            pool.innerHTML = "";
            
            let shuffledPool = [...correctParts].sort(() => Math.random() - 0.5);
            shuffledPool.forEach(part => {
                let div = document.createElement("div");
                div.className = "pool-piece";
                div.innerText = part;
                div.onclick = function() {
                    selectedIcon = part;
                    div.style.borderColor = "#22c55e";
                    alert("Selected part: " + part + ". Now tap any '?' slot on the blueprint above!");
                };
                pool.appendChild(div);
            });
        }

        function updateBoard() {
            for(let i=0; i<4; i++) {
                document.getElementById("slot" + i).innerText = currentSlots[i];
            }
        }

        function fitPart(slotIndex) {
            if(selectedIcon) {
                currentSlots[slotIndex] = selectedIcon;
                selectedIcon = null;
                updateBoard();
            } else {
                alert("Please select a bike part from the bottom panel first!");
            }
        }

        function checkPuzzleCompletion() {
            balance += 50;
            if(balance >= 1000) {
                alert("🎉 Congratulations! You reached ₹1000 withdrawal limit.");
            } else {
                alert("✨ Awesome! Bike parts fitted successfully. ₹50 added!");
            }
            initGame();
        }

        initGame();
    </script>
</body>
</html>
