<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ai Sameer</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #0b0f19; color: #ffffff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        .chat-container { display: flex; flex-direction: column; height: 100%; max-width: 800px; margin: 0 auto; width: 100%; position: relative; }
        
        /* Header */
        .chat-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: #0b0f19; }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .app-title { font-size: 1.15rem; font-weight: 500; color: #e2e8f0; display: flex; align-items: center; gap: 6px; }
        .icon-btn { background: none; border: none; color: #fff; font-size: 1.3rem; cursor: pointer; padding: 4px; display: flex; align-items: center; justify-content: center; }
        
        /* Sidebar */
        .sidebar { position: fixed; top: 0; left: -300px; width: 300px; height: 100%; background: #131825; transition: 0.3s ease; z-index: 1000; display: flex; flex-direction: column; padding: 16px; box-shadow: 4px 0 15px rgba(0,0,0,0.6); overflow-y: auto; }
        .sidebar.open { left: 0; }
        .sidebar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-size: 1.1rem; font-weight: 500; }
        .sidebar-item { padding: 12px 14px; border-radius: 12px; cursor: pointer; display: flex; align-items: center; gap: 14px; font-size: 0.95rem; color: #e2e8f0; margin-bottom: 6px; background: #1c2333; }
        .sidebar-item:hover { background: #283248; }
        .sidebar-section-title { font-size: 0.8rem; color: #94a3b8; margin: 16px 0 8px 4px; text-transform: uppercase; letter-spacing: 0.5px; }
        .recent-item { padding: 10px 14px; font-size: 0.9rem; color: #cbd5e1; cursor: pointer; border-radius: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .recent-item:hover { background: #1c2333; }

        /* Overlay for Sidebar */
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; z-index: 999; }
        .overlay.active { display: block; }

        /* Main Chat & Welcome Area */
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 20px; }
        .welcome-box { display: flex; flex-direction: column; align-items: center; gap: 12px; }
        .sparkle-icon { font-size: 2.8rem; background: linear-gradient(45deg, #4285f4, #ea4335, #fbbc05, #34a853); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .welcome-title { font-size: 1.85rem; font-weight: 400; color: #e2e8f0; }

        /* Bottom Input & Chips Area */
        .chat-input-area { padding: 12px 16px 20px 16px; background: #0b0f19; display: flex; flex-direction: column; gap: 10px; }
        .action-chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
        .action-chips::-webkit-scrollbar { display: none; }
        .chip { background: #171c28; border: 1.5px solid #283248; padding: 8px 16px; border-radius: 20px; color: #fff; font-size: 0.88rem; display: flex; align-items: center; gap: 8px; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
        
        .input-box-wrapper { display: flex; background: #171c28; border-radius: 28px; padding: 10px 14px; align-items: center; border: 1.5px solid #283248; gap: 8px; }
        .input-box-wrapper input { flex: 1; background: none; border: none; color: #fff; outline: none; font-size: 1rem; padding-left: 4px; }
        .input-box-wrapper input::placeholder { color: #94a3b8; }
        
        /* Message Bubbles */
        .message-list { width: 100%; display: flex; flex-direction: column; gap: 16px; align-items: flex-start; justify-content: flex-start; }
        .message { padding: 12px 16px; border-radius: 14px; max-width: 88%; text-align: left; line-height: 1.5; font-size: 0.95rem; }
        .user-message { background: #1c2333; align-self: flex-end; color: #f8fafc; border-bottom-right-radius: 4px; }
        .ai-message { background: #131825; border: 1px solid #283248; align-self: flex-start; color: #e2e8f0; border-bottom-left-radius: 4px; width: 100%; }
        
        .action-buttons { display: flex; gap: 12px; margin-top: 10px; font-size: 0.85rem; }
        .action-buttons button { background: #1c2333; color: #cbd5e1; border: none; padding: 5px 10px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; gap: 4px; }
        .action-buttons button:hover { background: #283248; }
    </style>
</head>
<body>
    <div class="overlay" id="overlay"></div>
    <div class="chat-container">
        <!-- Header -->
        <header class="chat-header">
            <div class="header-left">
                <button id="sidebar-toggle" class="icon-btn">☰</button>
                <div class="app-title">Ai Sameer</div>
            </div>
            <button id="new-chat-btn" class="icon-btn">✏️</button>
        </header>

        <!-- Sidebar Menu -->
        <div id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <span>Ai Sameer</span>
                <button id="sidebar-close" class="icon-btn">✕</button>
            </div>
            <div class="sidebar-item" onclick="newChat()">✏️ New chat</div>
            <div class="sidebar-item">🔍 Search chats</div>
            <div class="sidebar-item">🖼️ Images</div>
            <div class="sidebar-item">📚 Library</div>
            
            <div class="sidebar-section-title">Recent</div>
            <div class="recent-item">AI సమాధానాల సమస్య పరిష్కారం</div>
            <div class="recent-item">కోడ్ను కాపీ చేయడం ఎలా?</div>
            <div class="recent-item">సహాయం కోసం సిద్ధంగా ఉన్నాను</div>
        </div>

        <!-- Chat Area -->
        <div id="chat-messages" class="chat-messages">
            <div class="welcome-box" id="welcome-box">
                <div class="sparkle-icon">✦</div>
                <div class="welcome-title">What should we focus on?</div>
            </div>
        </div>

        <!-- Bottom Input & Quick Chips -->
        <div class="chat-input-area">
            <div class="action-chips">
                <div class="chip">🖼️ Photos</div>
                <div class="chip">📸 Camera</div>
                <div class="chip">😊 Avatar</div>
            </div>
            <div class="input-box-wrapper">
                <button id="add-btn" class="icon-btn">＋</button>
                <input type="text" id="user-input" placeholder="Ask Ai Sameer">
                <button id="mic-btn" class="icon-btn">🎙️</button>
                <button id="send-btn" class="icon-btn">⬆️</button>
            </div>
        </div>
    </div>

    <script>
        const WORKER_URL = "https://ai-sameer-api.shaikmahammed757.workers.dev";

        // Sidebar Elements
        const sidebar = document.getElementById("sidebar");
        const overlay = document.getElementById("overlay");
        
        document.getElementById("sidebar-toggle").addEventListener("click", () => {
            sidebar.classList.add("open");
            overlay.classList.add("active");
        });
        
        document.getElementById("sidebar-close").addEventListener("click", closeSidebar);
        overlay.addEventListener("click", closeSidebar);

        function closeSidebar() {
            sidebar.classList.remove("open");
            overlay.classList.remove("active");
        }

        function newChat() {
            const chatContainer = document.getElementById("chat-messages");
            chatContainer.innerHTML = `
                <div class="welcome-box" id="welcome-box">
                    <div class="sparkle-icon">✦</div>
                    <div class="welcome-title">What should we focus on?</div>
                </div>
            `;
            closeSidebar();
        }

        document.getElementById("new-chat-btn").addEventListener("click", newChat);

        async function sendToAI(promptText) {
            const chatContainer = document.getElementById("chat-messages");
            let welcomeBox = document.getElementById("welcome-box");
            
            if (welcomeBox) {
                chatContainer.innerHTML = `<div class="message-list" id="message-list"></div>`;
            } else if (!document.getElementById("message-list")) {
                chatContainer.innerHTML = `<div class="message-list" id="message-list"></div>`;
            }

            const messageList = document.getElementById("message-list");

            // Append User Message
            const userMsgDiv = document.createElement("div");
            userMsgDiv.className = "message user-message";
            userMsgDiv.innerText = promptText;
            messageList.appendChild(userMsgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // AI Loading Placeholder
            const aiMsgDiv = document.createElement("div");
            aiMsgDiv.className = "message ai-message";
            aiMsgDiv.innerHTML = `లోడ్ అవుతోంది...`;
            messageList.appendChild(aiMsgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                const response = await fetch(WORKER_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ prompt: promptText })
                });
                const data = await response.json();
                const aiReply = data.reply || "సమాధానం అందుకోవడంలో సమస్య ఏర్పడింది.";
                
                aiMsgDiv.innerHTML = `
                    <div>${aiReply}</div>
                    <div class="action-buttons">
                        <button onclick="copyText(this)">📋 Copy</button>
                        <button onclick="speakText('${aiReply.replace(/'/g, "\\'")}')">🔊 Listen</button>
                    </div>
                `;
            } catch (error) {
                aiMsgDiv.innerHTML = `నెట్‌వర్క్ సమస్య కారణంగా కనెక్షన్ కాలేదు.`;
            }
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function copyText(button) {
            const text = button.closest('.ai-message').querySelector('div').innerText;
            navigator.clipboard.writeText(text);
            alert("టెక్స్ట్ కాపీ చేయబడింది!");
        }

        function speakText(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'te-IN';
                window.speechSynthesis.speak(utterance);
            }
        }

        document.getElementById("send-btn").addEventListener("click", () => {
            const input = document.getElementById("user-input");
            if (input.value.trim() !== "") {
                sendToAI(input.value);
                input.value = "";
            }
        });

        document.getElementById("user-input").addEventListener("keypress", (e) => {
            if (e.key === "Enter") {
                const input = document.getElementById("user-input");
                if (input.value.trim() !== "") {
                    sendToAI(input.value);
                    input.value = "";
                }
            }
        });
    </script>
</body>
</html>
