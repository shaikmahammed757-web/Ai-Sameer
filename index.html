<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ai Sameer Delivery Partner</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f5f7;
            color: #333;
            padding-bottom: 70px;
        }
        /* Top Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .profile-section {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .profile-img {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 2px solid #ff4757;
            object-fit: cover;
        }
        /* Toggle Switch */
        .toggle-container {
            display: flex;
            align-items: center;
            background: #ffeaa7;
            padding: 5px 15px;
            border-radius: 30px;
            gap: 8px;
        }
        .switch {
            position: relative;
            display: inline-block;
            width: 45px;
            height: 24px;
        }
        .switch input { 
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 24px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: #2ed573;
        }
        input:checked + .slider:before {
            transform: translateX(21px);
        }
        .notification-icon {
            font-size: 20px;
            background: #f1f2f6;
            padding: 10px;
            border-radius: 50%;
        }

        /* Earnings Banner */
        .earnings-banner {
            background: linear-gradient(135deg, #30336b, #130f40);
            color: white;
            margin: 15px;
            padding: 20px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .earnings-banner h2 {
            font-size: 18px;
            font-weight: 400;
        }
        .earnings-banner span {
            font-size: 24px;
            font-weight: bold;
            color: #2ed573;
        }

        /* Daily Incentive Card */
        .incentive-card {
            background: linear-gradient(135deg, #ff9f43, #ff6b6b);
            color: white;
            margin: 15px;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .incentive-card h3 {
            font-size: 16px;
            margin-bottom: 5px;
        }
        .incentive-card p {
            font-size: 13px;
            opacity: 0.9;
        }

        /* Order Card */
        .order-card {
            background: white;
            margin: 15px;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border-left: 5px solid #2ed573;
        }
        .order-header {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            margin-bottom: 10px;
            color: #2f3640;
        }
        .order-route {
            font-size: 14px;
            color: #57606f;
            margin-bottom: 15px;
        }
        .accept-btn {
            width: 100%;
            background: #2ed573;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: white;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            box-shadow: 0 -2px 5px rgba(0,0,0,0.05);
            z-index: 100;
        }
        .nav-item {
            text-align: center;
            font-size: 12px;
            color: #718093;
            text-decoration: none;
        }
        .nav-item.active {
            color: #30336b;
            font-weight: bold;
        }
        .nav-item div {
            font-size: 18px;
            margin-bottom: 2px;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <div class="profile-section">
            <img src="logo.png" alt="Profile" class="profile-img">
            <strong>Shaik Mohammad</strong>
        </div>
        <div class="toggle-container">
            <span style="font-size: 12px; font-weight: bold;">Offline</span>
            <label class="switch">
                <input type="checkbox" checked>
                <span class="slider"></span>
            </label>
        </div>
        <div class="notification-icon">🔔</div>
    </div>

    <!-- Earnings Banner -->
    <div class="earnings-banner">
        <div>
            <h2>Today's Earnings</h2>
            <span>₹ 0</span>
        </div>
        <div style="font-size: 22px;">➔</div>
    </div>

    <!-- Daily Incentive Card -->
    <div class="incentive-card">
        <h3>🎁 డైలీ బోనస్ ఆఫర్ (Daily Incentive)</h3>
        <p>ఈ రోజు 5 ఆర్డర్లు పూర్తి చేయండి, అదనంగా <strong>₹50 బోనస్</strong> పొందండి!</p>
    </div>

    <!-- Active Order Card -->
    <div class="order-card">
        <div class="order-header">
            <span>📦 Pickup & Drop Request</span>
            <span style="color: #2ed573;">₹ 75</span>
        </div>
        <div class="order-route">
            📍 <strong>From:</strong> MG Road, Bengaluru<br>
            🏁 <strong>To:</strong> Indiranagar, Bengaluru <br>
            📏 <strong>Distance:</strong> 3.5 km
        </div>
        <button class="accept-btn" onclick="alert('Order Accepted!')">Accept Order</button>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <a href="#" class="nav-item active">
            <div>🏠</div>Home
        </a>
        <a href="#" class="nav-item">
            <div>📋</div>Orders
        </a>
        <a href="#" class="nav-item">
            <div>💰</div>Earnings
        </a>
        <a href="#" class="nav-item">
            <div>👤</div>Profile
        </a>
    </div>

</body>
</html>
