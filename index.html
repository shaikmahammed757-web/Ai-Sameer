<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sameer Puzzle - Safe Rewards</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            background-color: #0d0d1a;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            height: 100%;
            overflow: hidden;
        }
        .popup-card {
            background: #131324;
            border: 2px solid #222244;
            width: 85%;
            max-width: 350px;
            margin: 40px auto;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.2);
        }
        .trophy-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }
        .stage-title {
            color: #00ffff;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .level-num {
            font-size: 22px;
            font-weight: bold;
            margin: 5px 0 15px 0;
        }
        .bounty-box {
            background: #0b0b16;
            border: 1px solid #222244;
            border-radius: 10px;
            padding: 12px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-bottom: 20px;
        }
        .money-text {
            color: #50fa7b;
            font-size: 18px;
            font-weight: bold;
        }
        .points-text {
            color: #f1fa8c;
            font-size: 14px;
        }
        .btn-double {
            background: linear-gradient(45deg, #f1c40f, #f39c12);
            color: #000;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            margin-bottom: 10px;
            box-shadow: 0 0 10px rgba(241, 196, 15, 0.4);
        }
        .btn-next {
            background: #00bcd4;
            color: #000;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="popup-card">
        <div class="trophy-icon">🏆</div>
        <div class="stage-title">STAGE CLEARED</div>
        <div class="level-num" id="levelText">Lv. 31</div>
        <div style="font-size: 12px; color: #8888aa; margin-bottom: 15px;">All neon arrow paths unblocked!</div>

        <!-- సేఫ్ రివార్డ్ అమౌంట్ (₹0.50 నుండి ₹1.00 మాత్రమే) -->
        <div class="bounty-box">
            <div>
                <div style="font-size: 11px; color: #aaa;">Earned Reward</div>
                <div class="money-text" id="earnedMoney">+₹1.00</div>
            </div>
            <div style="width: 1px; height: 25px; background: #333355;"></div>
            <div>
                <div style="font-size: 11px; color: #aaa;">Points</div>
                <div class="points-text">+10 pts</div>
            </div>
        </div>

        <button class="btn-double" id="doubleBtn" onclick="doubleReward()">WATCH AD TO DOUBLE (+₹2.00)</button>
        <button class="btn-next" onclick="nextLevel()">NEXT STAGE ➔</button>
    </div>

    <script>
        let currentLevel = 31;
        let currentReward = 1.00; // ఒక రూపాయి లేదా 50 పైసలు

        function doubleReward() {
            currentReward = currentReward * 2;
            document.getElementById('earnedMoney').innerText = "+₹" + currentReward.toFixed(2);
            document.getElementById('doubleBtn').style.display = 'none'; // ఒక్కసారి యాడ్ చూశాక బటన్ హైడ్ అవుతుంది
            alert("Reward Doubled Successfully!");
        }

        function nextLevel() {
            currentLevel++;
            // తర్వాతి లెవెల్ కోసం అమౌంట్‌ను 0.50 లేదా 1.00 మధ్య మారుస్తుంది
            currentReward = currentLevel % 2 === 0 ? 0.50 : 1.00;
            
            document.getElementById('levelText').innerText = "Lv. " + currentLevel;
            document.getElementById('earnedMoney').innerText = "+₹" + currentReward.toFixed(2);
            document.getElementById('doubleBtn').innerText = "WATCH AD TO DOUBLE (+₹" + (currentReward * 2).toFixed(2) + ")";
            document.getElementById('doubleBtn').style.display = 'block';
        }
    </script>

</body>
</html>
