<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ai Sameer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#020617">
    <link rel="manifest" href="data:application/manifest+json,{
      &quot;name&quot;: &quot;Ai Sameer&quot;,
      &quot;short_name&quot;: &quot;Ai Sameer&quot;,
      &quot;start_url&quot;: &quot;.&quot;,
      &quot;display&quot;: &quot;standalone&quot;,
      &quot;background_color&quot;: &quot;#020617&quot;,
      &quot;theme_color&quot;: &quot;#020617&quot;,
      &quot;icons&quot;: [
        {
          &quot;src&quot;: &quot;https://deluxe-donut-a64c68.netlify.app/favicon.png&quot;,
          &quot;sizes&quot;: &quot;192x192&quot;,
          &quot;type&quot;: &quot;image/png&quot;
        }
      ]
    }">
    <link rel="icon" type="image/png" href="https://deluxe-donut-a64c68.netlify.app/favicon.png">
    <link rel="apple-touch-icon" href="https://deluxe-donut-a64c68.netlify.app/favicon.png">
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex flex-col justify-between font-sans relative overflow-hidden">
    
    <!-- Top Header -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 flex justify-between items-center shadow-lg z-10">
        <button onclick="toggleSidebar()" class="text-slate-300 hover:text-cyan-400 p-1 transition text-lg">
            <i class="fa-solid fa-bars"></i>
        </button>
        <div class="flex items-center gap-2 cursor-pointer" onclick="toggleSidebar()">
            <span class="text-base font-bold text-slate-100 tracking-wide">Ai Sameer</span>
            <i class="fa-solid fa-chevron-down text-xs text-slate-400"></i>
        </div>
        <button onclick="clearChat()" class="text-slate-300 hover:text-cyan-400 p-1 transition text-lg" title="New Chat">
            <i class="fa-solid fa-pen-to-square"></i>
        </button>
    </header>

    <!-- Sidebar Drawer (Left Menu) -->
    <div id="sidebar" class="fixed inset-y-0 left-0 w-72 bg-slate-900 border-r border-slate-800 z-50 transform -translate-x-full transition-transform duration-300 flex flex-col shadow-2xl">
        <div class="p-4 border-b border-slate-800 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <h2 class="font-bold text-slate-200 text-sm">Ai Sameer Menu</h2>
            </div>
            <button onclick="toggleSidebar()" class="text-slate-400 hover:text-white p-2">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
        </div>
        <div class="flex-1 overflow-y-auto p-4 space-y-2 text-sm">
            <button onclick="selectMenu('New chat')" class="w-full text-left px-4 py-3 rounded-xl hover:bg-slate-800 flex items-center gap-3 transition text-slate-200">
                <i class="fa-solid fa-pen-to-square text-cyan-400"></i> New chat
            </button>
            <button onclick="selectMenu('Search chats')" class="w-full text-left px-4 py-3 rounded-xl hover:bg-slate-800 flex items-center gap-3 transition text-slate-200">
                <i class="fa-solid fa-magnifying-glass text-cyan-400"></i> Search chats
            </button>
            <button onclick="selectMenu('Images')" class="w-full text-left px-4 py-3 rounded-xl hover:bg-slate-800 flex items-center gap-3 transition text-slate-200">
                <i class="fa-solid fa-image text-cyan-400"></i> Images
            </button>
            <button onclick="selectMenu('Library')" class="w-full text-left px-4 py-3 rounded-xl hover:bg-slate-800 flex items-center gap-3 transition text-slate-200">
                <i class="fa-solid fa-folder-open text-cyan-400"></i> Library
            </button>
            <div class="pt-4 border-t border-slate-800 text-xs text-slate-400 uppercase tracking-wider font-semibold px-2">Notebooks</div>
            <button onclick="selectMenu('New notebook')" class="w-full text-left px-4 py-3 rounded-xl hover:bg-slate-800 flex items-center gap-3 transition text-slate-200">
                <i class="fa-solid fa-plus text-cyan-400"></i> New notebook
            </button>
        </div>
        <div class="p-4 border-t border-slate-800 text-xs text-slate-400 flex items-center gap-2">
            <div class="bg-indigo-600 text-white rounded-full h-6 w-6 flex items-center justify-center font-bold">SM</div>
            <span>Shaik Mohammad</span>
        </div>
    </div>
    <div id="backdrop" onclick="toggleSidebar()" class="fixed inset-0 bg-black/60 z-40 hidden transition-opacity"></div>

    <!-- Plus (+) Features Bottom Sheet Modal -->
    <div id="plus-modal" class="fixed inset-0 bg-black/70 z-50 hidden flex items-end justify-center transition-opacity">
        <div class="bg-slate-900 border-t border-slate-800 rounded-t-3xl w-full max-w-2xl p-6 space-y-4 max-h-[80vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 class="text-slate-100 font-bold text-base">Select AI Feature</h3>
                <button onclick="togglePlusModal()" class="text-slate-400 hover:text-white text-lg"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <!-- Top 3 Quick Cards -->
            <div class="grid grid-cols-3 gap-3">
                <button onclick="selectFeatureModal('Photos')" class="bg-slate-950 border border-slate-800 p-4 rounded-2xl flex flex-col items-center justify-center gap-2 hover:bg-slate-800 transition">
                    <i class="fa-solid fa-image text-cyan-400 text-xl"></i>
                    <span class="text-xs font-medium text-slate-200">Photos</span>
                </button>
                <button onclick="selectFeatureModal('Camera')" class="bg-slate-950 border border-slate-800 p-4 rounded-2xl flex flex-col items-center justify-center gap-2 hover:bg-slate-800 transition">
                    <i class="fa-solid fa-camera text-cyan-400 text-xl"></i>
                    <span class="text-xs font-medium text-slate-200">Camera</span>
                </button>
                <button onclick="selectFeatureModal('Avatar')" class="bg-slate-950 border border-slate-800 p-4 rounded-2xl flex flex-col items-center justify-center gap-2 hover:bg-slate-800 transition">
                    <i class="fa-solid fa-face-smile text-cyan-400 text-xl"></i>
                    <span class="text-xs font-medium text-slate-200">Avatar</span>
                </button>
            </div>
            <!-- List Options -->
            <div class="space-y-2 text-sm">
                <button onclick="selectFeatureModal('Images')" class="w-full text-left p-3 rounded-xl bg-slate-950 hover:bg-slate-800 flex items-center gap-3 transition">
                    <i class="fa-solid fa-wand-magic-sparkles text-cyan-400"></i>
                    <div><div class="font-medium text-slate-200">Images</div><div class="text-xs text-slate-400">Create and edit visuals</div></div>
                </button>
                <button onclick="selectFeatureModal('Music')" class="w-full text-left p-3 rounded-xl bg-slate-950 hover:bg-slate-800 flex items-center gap-3 transition">
                    <i class="fa-solid fa-music text-cyan-400"></i>
                    <div><div class="font-medium text-slate-200">Music</div><div class="text-xs text-slate-400">Make audio tracks & voice</div></div>
                </button>
                <button onclick="selectFeatureModal('Canvas')" class="w-full text-left p-3 rounded-xl bg-slate-950 hover:bg-slate-800 flex items-center gap-3 transition">
                    <i class="fa-solid fa-code text-cyan-400"></i>
                    <div><div class="font-medium text-slate-200">Canvas</div><div class="text-xs text-slate-400">Code, write or make slides</div></div>
                </button>
                <button onclick="selectFeatureModal('Deep Research')" class="w-full text-left p-3 rounded-xl bg-slate-950 hover:bg-slate-800 flex items-center gap-3 transition">
                    <i class="fa-solid fa-brain text-cyan-400"></i>
                    <div><div class="font-medium text-slate-200">Deep Research</div><div class="text-xs text-slate-400">Get detailed reports & answers</div></div>
                </button>
                <button onclick="selectFeatureModal('Guided Learning')" class="w-full text-left p-3 rounded-xl bg-slate-950 hover:bg-slate-800 flex items-center gap-3 transition">
                    <i class="fa-solid fa-graduation-cap text-cyan-400"></i>
                    <div><div class="font-medium text-slate-200">Guided Learning</div><div class="text-xs text-slate-400">Get step-by-step help</div></div>
                </button>
            </div>
        </div>
    </div>

    <!-- Main Chat Area with Professional Glowing Sparkle Logo -->
    <div id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-4 max-w-2xl w-full mx-auto flex flex-col justify-center items-center">
        <div id="welcome-screen" class="text-center py-6">
            <div class="inline-block p-4 rounded-full bg-slate-900/80 border border-slate-800 shadow-2xl mb-4">
                <svg class="w-10 h-10 mx-auto" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2L14.4 9.6L22 12L14.4 14.4L12 22L9.6 14.4L2 12L9.6 9.6L12 2Z" fill="url(#sparkle-gradient)"/>
                    <defs>
                        <linearGradient id="sparkle-gradient" x1="2" y1="2" x2="22" y2="22" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#38BDF8"/>
                            <stop offset="0.5" stop-color="#818CF8"/>
                            <stop offset="1" stop-color="#F472B6"/>
                        </linearGradient>
                    </defs>
                </svg>
            </div>
            <h2 class="text-2xl font-bold text-slate-100 tracking-wide">Hi Shaik, let's get into it</h2>
        </div>
    </div>

    <!-- Bottom Input Section (Gemini Style with Mic & Audio Wave) -->
    <div class="bg-slate-900 border-t border-slate-800 p-4 z-10">
        <form id="chat-form" class="max-w-2xl mx-auto flex items-center bg-slate-900 border border-slate-700 rounded-full px-4 py-2.5 shadow-inner">
            <button type="button" onclick="togglePlusModal()" class="text-slate-400 hover:text-cyan-400 p-2 transition text-lg">
                <i class="fa-solid fa-plus"></i>
            </button>
            <input type="text" id="user-input" placeholder="Ask Ai Sameer" 
                class="flex-1 bg-transparent border-none px-3 py-1 text-sm text-slate-100 focus:outline-none" required>
            
            <!-- Mic Button -->
            <button type="button" id="mic-btn" onclick="startVoiceInput()" class="text-slate-400 hover:text-cyan-400 p-2 transition text-base" title="Voice Input">
                <i class="fa-solid fa-microphone"></i>
            </button>
            
            <!-- Audio Wave / Submit Button -->
            <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white h-9 w-9 rounded-full flex items-center justify-center transition shadow ml-2">
                <i class="fa-solid fa-arrow-up text-xs"></i>
            </button>
        </form>
    </div>

    <!-- JavaScript Logic -->
    <script>
        const chatContainer = document.getElementById('chat-container');
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const sidebar = document.getElementById('sidebar');
        const backdrop = document.getElementById('backdrop');
        const plusModal = document.getElementById('plus-modal');
        const micBtn = document.getElementById('mic-btn');
        const welcomeScreen = document.getElementById('welcome-screen');

        function toggleSidebar() {
            const isOpen = sidebar.classList.contains('translate-x-0');
            if (isOpen) {
                sidebar.classList.remove('translate-x-0');
                sidebar.classList.add('-translate-x-full');
                backdrop.classList.add('hidden');
            } else {
                sidebar.classList.remove('-translate-x-full');
                sidebar.classList.add('translate-x-0');
                backdrop.classList.remove('hidden');
            }
        }

        function togglePlusModal() {
            plusModal.classList.toggle('hidden');
        }

        function selectMenu(feature) {
            toggleSidebar();
            appendMessage(`${feature} మోడ్ ఎంచుకోబడింది. దానికి తగినట్లుగా వివరాలు ఇవ్వండి.`, 'ai');
        }

        function selectFeatureModal(feature) {
            togglePlusModal();
            appendMessage(`${feature} మాడ్యూల్ యాక్టివేట్ చేయబడింది. దానికి సంబంధించిన టాస్క్ టైప్ చేయండి.`, 'ai');
        }

        function clearChat() {
            chatContainer.innerHTML = `
                <div id="welcome-screen" class="text-center py-6">
                    <div class="inline-block p-4 rounded-full bg-slate-900/80 border border-slate-800 shadow-2xl mb-4">
                        <svg class="w-10 h-10 mx-auto" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 2L14.4 9.6L22 12L14.4 14.4L12 22L9.6 14.4L2 12L9.6 9.6L12 2Z" fill="url(#sparkle-gradient-2)"/>
                            <defs>
                                <linearGradient id="sparkle-gradient-2" x1="2" y1="2" x2="22" y2="22" gradientUnits="userSpaceOnUse">
                                    <stop stop-color="#38BDF8"/>
                                    <stop offset="0.5" stop-color="#818CF8"/>
                                    <stop offset="1" stop-color="#F472B6"/>
                                </linearGradient>
                            </defs>
                        </svg>
                    </div>
                    <h2 class="text-2xl font-bold text-slate-100 tracking-wide">Hi Shaik, let's get into it</h2>
                </div>
            `;
        }

        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'te-IN';
                utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        async function fetchAIResponse(prompt) {
            const lower = prompt.toLowerCase();
            if (lower.includes('sk md riding') || lower.includes('riding tv') || lower.includes('channel')) {
                return "SK MD Riding TV అనేది మోటార్‌సైకిల్ వ్లాగ్స్, రైడింగ్ అడ్వెంచర్లు మరియు బైక్ రివ్యూల కోసం ప్రత్యేకించబడిన అద్భుతమైన యూట్యూబ్ ఛానెల్!";
            } else if (lower.includes('name') || lower.includes('పేరు')) {
                return "నా పేరు Ai Sameer. షైక్ మొహమ్మద్ గారిచే రూపుదిద్దుకున్న అడ్వాన్స్‌డ్ పర్సనల్ ఏఐ అసిస్టెంట్ నేను.";
            } else if (lower.includes('hello') || lower.includes('hi') || lower.includes('నమస్తే')) {
                return "నమస్తే షైక్! మీకు ఏ విధంగా సహాయం చేయగలను?";
            } else if (lower.includes('video') || lower.includes('వీడియో')) {
                return "టెక్స్ట్-టు-వీడియో జనరేషన్ ప్రాసెస్ ప్రారంభించబడింది. మీ కాన్సెప్ట్ ప్రకారం వీడియో సిద్ధమవుతోంది.";
            } else if (lower.includes('image') || lower.includes('ఫోటో') || lower.includes('చిత్రం')) {
                return "మీ కోటా ప్రకారం హై-క్వాలిటీ ఇమేజ్ సృష్టించబడింది.";
            }
            return `ధన్యవాదాలు షైక్! మీరు అడిగిన "${prompt}" గురించిన పూర్తి విశ్లేషణ మరియు సమాచారం ఇక్కడ అందించబడింది. Ai Sameer ద్వారా మీకు అన్‌లిమిటెడ్‌గా సహాయం అందుతుంది.`;
        }

        chatForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            const message = userInput.value.trim();
            if (!message) return;
            
            if (welcomeScreen) welcomeScreen.style.display = 'none';
            chatContainer.classList.remove('justify-center', 'items-center');
            
            appendMessage(message, 'user');
            userInput.value = '';
            
            const loadingId = appendMessage("ఆలోచిస్తున్నాను...", 'ai', true);
            const aiReply = await fetchAIResponse(message);
            
            const loadingElement = document.getElementById(loadingId);
            if(loadingElement) loadingElement.remove();
            
            appendMessage(aiReply, 'ai');
        });

        // Fully working Voice Input (Microphone) handler
        function startVoiceInput() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("మీ బ్రౌజర్ వాయిస్ రికగ్నిషన్‌కు మద్దతు ఇవ్వడం లేదు.");
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = 'te-IN';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            micBtn.innerHTML = '<i class="fa-solid fa-microphone text-rose-500 animate-pulse"></i>';
            userInput.placeholder = "వింటున్నాను మాట్లాడండి...";

            recognition.onresult = function(event) {
                userInput.value = event.results[0][0].transcript;
                micBtn.innerHTML = '<i class="fa-solid fa-microphone"></i>';
                userInput.placeholder = "Ask Ai Sameer";
            };

            recognition.onerror = recognition.onend = function() {
                micBtn.innerHTML = '<i class="fa-solid fa-microphone"></i>';
                userInput.placeholder = "Ask Ai Sameer";
            };

            try { recognition.start(); } catch (err) { console.error(err); }
        }

        let messageCounter = 0;
        function appendMessage(text, sender, isLoading = false) {
            const isUser = sender === 'user';
            const msgId = 'msg-' + (++messageCounter);
            const wrapperDiv = document.createElement('div');
            wrapperDiv.id = msgId;
            wrapperDiv.className = `flex flex-col ${isUser ? 'items-end' : 'items-start'} space-y-1 mb-4 w-full`;
            
            const bubbleRow = document.createElement('div');
            bubbleRow.className = `flex items-start space-x-2 ${isUser ? 'flex-row-reverse space-x-reverse' : ''} w-full`;
            
            const avatar = document.createElement('div');
            avatar.className = `${isUser ? 'bg-emerald-600' : 'bg-indigo-600'} text-white rounded-full h-7 w-7 flex items-center justify-center font-bold text-xs shrink-0 shadow`;
            avatar.textContent = isUser ? 'US' : 'AI';
            
            const bubble = document.createElement('div');
            bubble.className = `${isUser ? 'bg-cyan-950 border-cyan-800 text-slate-100 ml-auto' : 'bg-slate-900 border-slate-800 text-slate-100 mr-auto'} border p-3.5 rounded-2xl max-w-[85%] text-sm shadow-md leading-relaxed`;
            bubble.textContent = text;
            
            bubbleRow.appendChild(avatar);
            bubbleRow.appendChild(bubble);
            wrapperDiv.appendChild(bubbleRow);

            if (!isUser && !isLoading) {
                const actionsRow = document.createElement('div');
                actionsRow.className = 'flex items-center gap-3 pl-9 text-slate-400 text-xs mt-1';
                actionsRow.innerHTML = `
                    <button onclick="alert('Liked!')" class="hover:text-cyan-400 transition"><i class="fa-regular fa-thumbs-up"></i></button>
                    <button onclick="alert('Disliked!')" class="hover:text-cyan-400 transition"><i class="fa-regular fa-thumbs-down"></i></button>
                    <button onclick="navigator.clipboard.writeText('${text}'); alert('Copied!');" class="hover:text-cyan-400 transition"><i class="fa-regular fa-copy"></i></button>
                    <button onclick="alert('More options')" class="hover:text-cyan-400 transition"><i class="fa-solid fa-ellipsis"></i></button>
                    <button onclick="speakText('${text}')" class="hover:text-cyan-400 flex items-center gap-1 transition ml-2"><i class="fa-solid fa-volume-high"></i> వినండి</button>
                `;
                wrapperDiv.appendChild(actionsRow);
            }

            chatContainer.appendChild(wrapperDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return msgId;
        }
    </script>
</body>
</html>
