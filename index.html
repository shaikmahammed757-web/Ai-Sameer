<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sameer Puzzle - Mid-Game Ads</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            color: #333333;
            font-family: Arial, sans-serif;
            text-align: center;
            height: 100%;
        }
        .header-title {
            background-color: #0f172a;
            color: #00ffcc;
            padding: 10px;
            font-size: 15px;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #e6f0ff;
            padding: 10px 15px;
            border-bottom: 2px solid #b3d1ff;
        }
        .balance-box {
            font-weight: bold;
            font-size: 16px;
            color: #000;
        }
        .withdraw-btn {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        .info-bar {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background-color: #f8f9fa;
            padding: 8px;
            border-bottom: 1px solid #ddd;
            font-size: 14px;
        }
        .hearts {
            color: #ff3366;
            font-size: 16px;
        }
        canvas {
            display: block;
            margin: 15px auto;
            background-color: #ffffff;
            border: 2px solid #333333;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .popup-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .popup-card {
            background: #ffffff;
            color: #000;
            width: 85%;
            max-width: 340px;
            padding: 20px;
            border-radius: 16px;
            border: 2px solid #ddd;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            text-align: center;
        }
        .money-text {
            color: #28a745;
            font-size: 20px;
            font-weight: bold;
        }
        .btn-double {
            background: #ffc107;
            color: #000;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            margin-top: 12px;
            cursor: pointer;
        }
        .btn-next {
            background: #00bcd4;
            color: #fff;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            margin-top: 8px;
            cursor: pointer;
        }
        /* గేమ్ మధ్యలో వచ్చే యాడ్ స్క్రీన్ */
        #adOverlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000000;
            color: white;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 200;
        }
    </style>
</head>
<body>

    <div class="header-title">SAMEER PUZZLE - FLOW ADVENTURE</div>

    <div class="top-bar">
        <div class="balance-box" id="walletBal">₹0.00</div>
        <button class="withdraw-btn" onclick="alert('KYC Required for Withdrawal!')">Withdraw</button>
    </div>

    <div class="info-bar">
        <div class="hearts">❤️❤️❤️</div>
        <div style="font-weight: bold;" id="levelTitle">Level 1</div>
        <div style="color: #666;" id="lineCount">lines</div>
    </div>

    <canvas id="puzzleCanvas" width="340" height="340"></canvas>

    <!-- లెవెల్ కంప్లీట్ అయినప్పుడు వచ్చే పాప్-అప్ -->
    <div class="popup-overlay" id="winPopup">
        <div class="popup-card">
            <div style="font-size: 35px;">🏆</div>
            <h3>STAGE CLEARED</h3>
            <p style="color: #666; font-size: 13px;" id="popupLevelText">Level completed successfully!</p>
            
            <div style="background: #f1f3f5; padding: 10px; border-radius: 8px; margin: 15px 0;">
                <div style="font-size: 12px; color: #555;">Earned Reward (Safe)</div>
                <div class="money-text" id="rewardText">+₹1.00</div>
            </div>

            <button class="btn-double" onclick="watchAdToDouble()">WATCH AD TO DOUBLE (+₹2.00)</button>
            <button class="btn-next" onclick="nextLevelLoad()">NEXT STAGE ➔</button>
        </div>
    </div>

    <!-- 3 లేదా 4 లైన్లు క్లియరింగ్ అయినప్పుడు మధ్యలో వచ్చే యాడ్ స్క్రీన్ -->
    <div id="adOverlay">
        <h2>SPONSOR AD (MID-GAME)</h2>
        <p style="color: #aaa; font-size: 14px;">Great progress! Ad is playing...</p>
        <h1 id="adTimer" style="color: #00ffcc; font-size: 50px;">3</h1>
        <p style="font-size: 12px; color: #666;">Resuming game shortly</p>
    </div>

    <script>
        const canvas = document.getElementById('puzzleCanvas');
        const ctx = canvas.getContext('2d');

        let currentLevel = 1;
        let currentReward = 1.00;
        let puzzlePaths = [];
        let totalLinesInLevel = 0;
        let clearedLinesCount = 0;
        let totalBalance = 0.00;

        function generateLevelData() {
            let levelBank = [
                [
                    { points: [{x: 40, y: 40}, {x: 200, y: 40}, {x: 200, y: 120}, {x: 120, y: 120}], dir: 'LEFT' },
                    { points: [{x: 240, y: 40}, {x: 300, y: 40}, {x: 300, y: 160}, {x: 200, y: 160}], dir: 'LEFT' },
                    { points: [{x: 40, y: 120}, {x: 120, y: 120}, {x: 120, y: 220}, {x: 240, y: 220}], dir: 'RIGHT' },
                    { points: [{x: 260, y: 100}, {x: 260, y: 200}, {x: 160, y: 200}], dir: 'DOWN' },
                    { points: [{x: 80, y: 280}, {x: 180, y: 280}, {x: 180, y: 300}, {x: 280, y: 300}], dir: 'RIGHT' }
                ],
                [
                    { points: [{x: 40, y: 80}, {x: 160, y: 80}, {x: 160, y: 160}, {x: 80, y: 160}], dir: 'LEFT' },
                    { points: [{x: 200, y: 80}, {x: 300, y: 80}, {x: 300, y: 240}, {x: 160, y: 240}], dir: 'LEFT' },
                    { points: [{x: 40, y: 200}, {x: 120, y: 200}, {x: 120, y: 280}, {x: 260, y: 280}], dir: 'RIGHT' },
                    { points: [{x: 240, y: 120}, {x: 240, y: 200}, {x: 180, y: 200}], dir: 'UP' }
                ]
            ];

            let patternIndex = (currentLevel - 1) % levelBank.length;
            puzzlePaths = JSON.parse(JSON.stringify(levelBank[patternIndex]));
            totalLinesInLevel = puzzlePaths.length;
            clearedLinesCount = 0; // రీసెట్ చేయడం

            document.getElementById('levelTitle').innerText = "Level " + currentLevel;
            document.getElementById('lineCount').innerText = puzzlePaths.length + " lines left";
            document.getElementById('popupLevelText').innerText = "Level " + currentLevel + " unblocked!";
            
            currentReward = currentLevel % 2 === 0 ? 0.50 : 1.00;
            document.getElementById('rewardText').innerText = "+₹" + currentReward.toFixed(2);
        }

        function drawGame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#b0b0b0';
            for (let x = 40; x < canvas.width; x += 40) {
                for (let y = 40; y < canvas.height; y += 40) {
                    ctx.fillRect(x, y, 2.5, 2.5);
                }
            }

            puzzlePaths.forEach((item) => {
                ctx.strokeStyle = '#111111';
                ctx.lineWidth = 4;
                ctx.lineCap = 'square';
                ctx.lineJoin = 'miter';

                ctx.beginPath();
                item.points.forEach((pt, i) => {
                    if (i === 0) ctx.moveTo(pt.x, pt.y);
                    else ctx.lineTo(pt.x, pt.y);
                });
                ctx.stroke();

                let lastPt = item.points[item.points.length - 1];
                ctx.fillStyle = '#111111';
                ctx.beginPath();
                if (item.dir === 'LEFT') {
                    ctx.moveTo(lastPt.x - 10, lastPt.y);
                    ctx.lineTo(lastPt.x + 2, lastPt.y - 6);
                    ctx.lineTo(lastPt.x + 2, lastPt.y + 6);
                } else if (item.dir === 'RIGHT') {
                    ctx.moveTo(lastPt.x + 10, lastPt.y);
                    ctx.lineTo(lastPt.x - 2, lastPt.y - 6);
                    ctx.lineTo(lastPt.x - 2, lastPt.y + 6);
                } else if (item.dir === 'DOWN') {
                    ctx.moveTo(lastPt.x, lastPt.y + 10);
                    ctx.lineTo(lastPt.x - 6, lastPt.y - 2);
                    ctx.lineTo(lastPt.x + 6, lastPt.y - 2);
                } else if (item.dir === 'UP') {
                    ctx.moveTo(lastPt.x, lastPt.y - 10);
                    ctx.lineTo(lastPt.x - 6, lastPt.y + 2);
                    ctx.lineTo(lastPt.x + 6, lastPt.y + 2);
                }
                ctx.fill();
            });
        }

        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            let clickedIndex = -1;
            puzzlePaths.forEach((item, index) => {
                let lastPt = item.points[item.points.length - 1];
                let dist = Math.hypot(clickX - lastPt.x, clickY - lastPt.y);
                if (dist < 30) {
                    clickedIndex = index;
                }
            });

            if (clickedIndex !== -1) {
                puzzlePaths.splice(clickedIndex, 1);
                clearedLinesCount++;
                document.getElementById('lineCount').innerText = puzzlePaths.length + " lines left";
                drawGame();

                // ముఖ్యమైన మార్పు: 2 లేదా 3 లైన్లు క్లియర్ కాగానే గేమ్ మధ్యలోనే యాడ్ ట్రిగ్గర్ కావడం
                if (clearedLinesCount === 2 && puzzlePaths.length > 0) {
                    triggerMidGameAd();
                    return;
                }

                // అన్ని లైన్లు అయిపోతే లెవెల్ విన్ పాప్-అప్
                if (puzzlePaths.length === 0) {
                    totalBalance += currentReward;
                    document.getElementById('walletBal').innerText = "₹" + totalBalance.toFixed(2);
                    document.getElementById('winPopup').style.display = 'flex';
                }
            }
        });

        // గేమ్ ఆడుతున్న మధ్యలో యాడ్ వచ్చే ఫంక్షన్
        function triggerMidGameAd() {
            document.getElementById('adOverlay').style.display = 'flex';
            let timeLeft = 3;
            document.getElementById('adTimer').innerText = timeLeft;

            let adInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('adTimer').innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(adInterval);
                    document.getElementById('adOverlay').style.display = 'none';
                }
            }, 1000);
        }

        function watchAdToDouble() {
            currentReward = currentReward * 2;
            totalBalance += currentReward;
            document.getElementById('walletBal').innerText = "₹" + totalBalance.toFixed(2);
            document.getElementById('rewardText').innerText = "+₹" + currentReward.toFixed(2) + " (Doubled!)";
            alert("Reward Doubled via Ad!");
        }

        function nextLevelLoad() {
            document.getElementById('winPopup').style.display = 'none';
            currentLevel++;
            generateLevelData();
            drawGame();
        }

        generateLevelData();
        drawGame();
    </script>

</body>
</html>
