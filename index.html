<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SK MD Bike Puzzle & Earn</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #111;
            color: #fff;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        header {
            background: #ff9800;
            padding: 15px;
            font-size: 20px;
            font-weight: bold;
            color: #000;
        }
        .container {
            padding: 20px;
        }
        .wallet-box {
            background: #222;
            border: 2px solid #ff9800;
            padding: 10px;
            margin: 10px auto;
            width: 80%;
            border-radius: 8px;
        }
        .game-board {
            width: 300px;
            height: 300px;
            margin: 20px auto;
            background: #333;
            border: 3px solid #fff;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
            padding: 5px;
        }
        .tile {
            background: #ff5722;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
        }
        button {
            background: #4caf50;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <header>SK MD Bike Puzzle & Earn</header>

    <div class="container">
        <div class="wallet-box">
            <p>Wallet Balance: <span id="balance">₹0</span></p>
            <p style="font-size: 12px; color: #aaa;">Minimum Withdrawal: ₹1000</p>
        </div>

        <h3>Level: <span id="level">1</span></h3>
        <p>Fix the bike parts in order!</p>

        <div class="game-board" id="board">
            <!-- Game Tiles generated via JS -->
        </div>

        <button onclick="nextLevel()">Complete Level</button>
    </div>

    <script>
        let balance = 0;
        let level = 1;

        function updateGame() {
            document.getElementById("balance").innerText = "₹" + balance;
            document.getElementById("level").innerText = level;
            
            const board = document.getElementById("board");
            board.innerHTML = "";
            
            // Random puzzle generation for infinite levels
            let tiles = [1, 2, 3, 4, 5, 6, 7, 8, "🔧"];
            tiles.sort(() => Math.random() - 0.5);

            tiles.forEach(tile => {
                let div = document.createElement("div");
                div.className = "tile";
                div.innerText = tile;
                board.appendChild(div);
            });
        }

        function nextLevel() {
            balance += 50; // Earn ₹50 per level
            level += 1;
            alert("Level Completed! You earned ₹50.");
            
            if(balance >= 1000) {
                alert("Congratulations! You reached ₹1000. You can withdraw now.");
            }
            updateGame();
        }

        updateGame();
    </script>
</body>
</html>
