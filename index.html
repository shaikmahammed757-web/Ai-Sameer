
<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0f19">
<title>AI Sameer</title>
<style>
:root {
  --bg: #0b0f19;
  --panel: #121826;
  --panel2: #1b2333;
  --border: #293347;
  --text: #f1f5ff;
  --muted: #a9b4c8;
  --accent: #8da9ff;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, "Noto Sans Telugu", sans-serif;
}
button, input, textarea { font: inherit; }
button {
  color: inherit;
  cursor: pointer;
}
header {
  height: 76px;
  position: sticky;
  top: 0;
  z-index: 5;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 18px;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
}
.brand {
  display: flex;
  align-items: center;
  gap: 16px;
  font-size: 25px;
  font-weight: 650;
}
.icon-btn {
  border: 0;
  background: transparent;
  font-size: 27px;
  padding: 7px;
  border-radius: 12px;
}
.icon-btn:hover, button:hover { filter: brightness(1.15); }
main {
  max-width: 900px;
  margin: auto;
  padding: 22px 16px 190px;
}
.welcome {
  text-align: center;
  margin: 65px auto 25px;
}
.welcome h1 { font-size: 30px; }
.welcome p { color: var(--muted); }
#messages {
  display: flex;
  flex-direction: column;
  gap: 22px;
}
.message { max-width: 100%; }
.message.user {
  align-self: flex-end;
  max-width: 88%;
  background: var(--panel2);
  padding: 15px 18px;
  border-radius: 23px 23px 6px 23px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.answer {
  background: var(--panel);
  border: 1px solid var(--border);
  padding: 17px;
  border-radius: 22px 22px 22px 6px;
  line-height: 1.8;
  overflow-wrap: anywhere;
}
.answer-text { white-space: pre-wrap; }
.answer-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
  margin-top: 15px;
  padding-top: 12px;
  border-top: 1px solid var(--border);
}
.answer-actions button {
  background: transparent;
  border: 0;
  border-radius: 9px;
  padding: 7px 10px;
  font-size: 21px;
}
.answer-actions button.active { background: #303e59; }
.status {
  color: var(--muted);
  padding: 12px 3px;
}
.error { color: #ffb8b8; }
.composer-wrap {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: linear-gradient(transparent, var(--bg) 16%);
  padding: 35px 14px 18px;
  z-index: 4;
}
.composer {
  max-width: 850px;
  margin: auto;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 25px;
  padding: 10px;
}
#question {
  display: block;
  width: 100%;
  min-height: 48px;
  max-height: 150px;
  resize: vertical;
  color: var(--text);
  background: transparent;
  border: 0;
  outline: none;
  padding: 10px;
}
.composer-actions {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.tools { display: flex; flex-wrap: wrap; gap: 6px; }
.tool-btn, .send-btn {
  border: 1px solid var(--border);
  background: var(--panel2);
  border-radius: 20px;
  padding: 9px 12px;
}
.send-btn {
  background: var(--accent);
  color: #10182a;
  font-weight: 700;
  min-width: 48px;
}
#fileInput { display: none; }
#preview {
  display: none;
  padding: 8px;
  color: var(--muted);
  overflow-wrap: anywhere;
}
#toast {
  position: fixed;
  left: 50%;
  bottom: 125px;
  transform: translateX(-50%);
  z-index: 20;
  background: #293347;
  border: 1px solid #44516a;
  border-radius: 12px;
  padding: 11px 16px;
  width: max-content;
  max-width: 90%;
  display: none;
}
.overlay {
  position: fixed;
  inset: 0;
  background: #0009;
  z-index: 9;
  display: none;
}
.sidebar {
  position: fixed;
  z-index: 10;
  inset: 0 auto 0 0;
  width: min(310px, 85vw);
  background: #101521;
  border-right: 1px solid var(--border);
  padding: 20px;
  transform: translateX(-105%);
  transition: transform .2s;
  overflow-y: auto;
}
.sidebar.open { transform: translateX(0); }
.sidebar-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 22px;
  margin-bottom: 25px;
}
.menu-btn {
  display: block;
  width: 100%;
  text-align: left;
  background: var(--panel);
  border: 1px solid #202a3c;
  border-radius: 15px;
  padding: 15px;
  margin: 10px 0;
}
.history-title { color: var(--muted); margin-top: 25px; }
.history-item {
  width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  text-align: left;
  padding: 12px 6px;
  background: transparent;
  border: 0;
  border-bottom: 1px solid var(--border);
}
@media (max-width: 480px) {
  header { height: 68px; padding: 0 12px; }
  .brand { font-size: 22px; gap: 10px; }
  main { padding: 18px 12px 185px; }
  .welcome { margin-top: 45px; }
  .message.user { max-width: 94%; }
  .composer-wrap { padding: 24px 9px 12px; }
  .tool-btn { padding: 8px 10px; font-size: 14px; }
}
</style>
</head>
<body>

<header>
  <div class="brand">
    <button class="icon-btn" id="menuButton" aria-label="Menu">☰</button>
    <span>AI Sameer</span>
  </div>
  <button class="icon-btn" id="newChatTop" aria-label="New chat">✏️</button>
</header>

<div class="overlay" id="overlay"></div>
<aside class="sidebar" id="sidebar">
  <div class="sidebar-title">
    <span>AI Sameer Menu</span>
    <button class="icon-btn" id="closeMenu">✕</button>
  </div>
  <button class="menu-btn" id="newChatMenu">✏️ New chat</button>
  <button class="menu-btn" id="searchChats">🔎 Search chats</button>
  <button class="menu-btn" id="imagesMenu">🖼️ Images</button>
  <div class="history-title">Recent chats</div>
  <div id="history"></div>
</aside>

<main>
  <section class="welcome" id="welcome">
    <h1>నమస్కారం! 👋</h1>
    <p>నేను AI Sameer. మీకు ఎలా సహాయం చేయగలను?</p>
  </section>
  <section id="messages" aria-live="polite"></section>
</main>

<div class="composer-wrap">
  <div class="composer">
    <div id="preview"></div>
    <textarea id="question" rows="1"
      placeholder="మీ ప్రశ్నను ఇక్కడ టైప్ చేయండి..."
      aria-label="మీ ప్రశ్న"></textarea>
    <div class="composer-actions">
      <div class="tools">
        <button class="tool-btn" id="photosButton">🖼️ Photos</button>
        <button class="tool-btn" id="cameraButton">📸 Camera</button>
        <button class="tool-btn" id="avatarButton">😊 Avatar</button>
        <button class="tool-btn" id="micButton" aria-label="Voice input">🎙️</button>
      </div>
      <button class="send-btn" id="sendButton">➤</button>
    </div>
  </div>
  <input type="file" id="fileInput" accept="image/*" multiple>
  <input type="file" id="cameraInput" accept="image/*" capture="environment">
</div>

<div id="toast" role="status"></div>

<script>
"use strict";

/*
  AI Sameer frontend.
  API key must remain in Cloudflare Worker secrets.
*/
const API_URL =
  "https://ai-sameer-api.shaikmahammed757.workers.dev";

const $ = id => document.getElementById(id);

const messagesEl = $("messages");
const questionEl = $("question");
const sendButton = $("sendButton");
const previewEl = $("preview");
const welcomeEl = $("welcome");

let chat = [];
let attachedFiles = [];
let isSending = false;
let toastTimer;

function showToast(message) {
  const toast = $("toast");
  toast.textContent = message;
  toast.style.display = "block";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    toast.style.display = "none";
  }, 3000);
}

function openMenu() {
  $("sidebar").classList.add("open");
  $("overlay").style.display = "block";
}
function closeMenu() {
  $("sidebar").classList.remove("open");
  $("overlay").style.display = "none";
}

$("menuButton").addEventListener("click", openMenu);
$("closeMenu").addEventListener("click", closeMenu);
$("overlay").addEventListener("click", closeMenu);

function newChat() {
  chat = [];
  attachedFiles = [];
  messagesEl.replaceChildren();
  welcomeEl.style.display = "block";
  updatePreview();
  questionEl.value = "";
  closeMenu();
  questionEl.focus();
}
$("newChatTop").addEventListener("click", newChat);
$("newChatMenu").addEventListener("click", newChat);

function updateHistory() {
  const history = $("history");
  history.replaceChildren();

  const conversations = chat.filter(m => m.role === "user").slice(-15).reverse();

  conversations.forEach(item => {
    const button = document.createElement("button");
    button.className = "history-item";
    button.textContent = "💬 " + item.content;
    button.title = item.content;
    button.addEventListener("click", () => {
      closeMenu();
      showToast("ఈ చాట్ ప్రస్తుత సంభాషణలో ఉంది.");
    });
    history.appendChild(button);
  });
}

$("searchChats").addEventListener("click", () => {
  closeMenu();
  const term = prompt("చాట్‌లో వెతకాల్సిన పదాన్ని నమోదు చేయండి:");
  if (term === null || !term.trim()) return;
  const found = [...messagesEl.querySelectorAll(".message")]
    .some(el => el.textContent.toLowerCase().includes(term.toLowerCase()));
  showToast(found ? "సరిపోలిన సందేశం ఈ చాట్‌లో ఉంది." : "ఈ చాట్‌లో సరిపోలిన సందేశం లేదు.");
});

/* Avoid JavaScript alert popups for unavailable features. */
$("imagesMenu").addEventListener("click", () => {
  closeMenu();
  $("fileInput").click();
});

$("photosButton").addEventListener("click", () => $("fileInput").click());
$("cameraButton").addEventListener("click", () => $("cameraInput").click());
$("avatarButton").addEventListener("click", () => {
  showToast("Avatar ఫీచర్ ఇంకా కనెక్ట్ చేయలేదు.");
});

$("fileInput").addEventListener("change", event => {
  addFiles(event.target.files);
  event.target.value = "";
});
$("cameraInput").addEventListener("change", event => {
  addFiles(event.target.files);
  event.target.value = "";
});

function addFiles(files) {
  const selected = Array.from(files || []);
  for (const file of selected) {
    if (!file.type.startsWith("image/")) {
      showToast("దయచేసి ఇమేజ్ ఫైల్ ఎంచుకోండి.");
      continue;
    }
    if (file.size > 5 * 1024 * 1024) {
      showToast("ఒక్కో ఫోటో పరిమాణం 5 MB కంటే తక్కువగా ఉండాలి.");
      continue;
    }
    if (attachedFiles.length >= 4) {
      showToast("ఒకేసారి గరిష్ఠంగా 4 ఫోటోలు ఎంచుకోండి.");
      break;
    }
    attachedFiles.push(file);
  }
  updatePreview();
}

function updatePreview() {
  previewEl.replaceChildren();
  if (!attachedFiles.length) {
    previewEl.style.display = "none";
    return;
  }
  previewEl.style.display = "block";
  const label = document.createElement("span");
  label.textContent = "📎 " + attachedFiles.map(f => f.name).join(", ");
  previewEl.appendChild(label);

  const remove = document.createElement("button");
  remove.textContent = " ✕";
  remove.className = "icon-btn";
  remove.style.fontSize = "16px";
  remove.addEventListener("click", () => {
    attachedFiles = [];
    updatePreview();
  });
  previewEl.appendChild(remove);
}

function createMessage(role, text, options = {}) {
  const wrapper = document.createElement("article");
  wrapper.className = "message " + role;

  if (role === "user") {
    wrapper.textContent = text;
    if (options.files && options.files.length) {
      const fileNames = document.createElement("div");
      fileNames.style.color = "#a9b4c8";
      fileNames.style.marginTop = "8px";
      fileNames.textContent = "📎 " + options.files.join(", ");
      wrapper.appendChild(fileNames);
    }
  } else {
    const card = document.createElement("div");
    card.className = "answer";

    const body = document.createElement("div");
    body.className = "answer-text";
    body.textContent = text;
    card.appendChild(body);

    const actions = document.createElement("div");
    actions.className = "answer-actions";

    const copy = makeAction("📋", "Copy answer", () => {
      copyText(text);
    });
    const like = makeAction("👍", "Like", () => {
      like.classList.toggle("active");
      showToast("ధన్యవాదాలు!");
    });
    const dislike = makeAction("👎", "Dislike", () => {
      dislike.classList.toggle("active");
      showToast("మీ అభిప్రాయానికి ధన్యవాదాలు.");
    });
    const listen = makeAction("🔊", "Listen to answer", () => {
      speakText(text);
    });
    const share = makeAction("📤", "Share answer", async () => {
      if (navigator.share) {
        try {
          await navigator.share({ title: "AI Sameer", text });
        } catch (error) {
          if (error.name !== "AbortError") copyText(text);
        }
      } else {
        copyText(text);
        showToast("సమాధానం కాపీ అయింది. మీరు షేర్ చేయవచ్చు.");
      }
    });

    [copy, like, dislike, listen, share].forEach(button => actions.appendChild(button));
    card.appendChild(actions);
    wrapper.appendChild(card);
  }

  messagesEl.appendChild(wrapper);
  wrapper.scrollIntoView({ behavior: "smooth", block: "nearest" });
  return wrapper;
}

function makeAction(symbol, label, callback) {
  const button = document.createElement("button");
  button.type = "button";
  button.textContent = symbol;
  button.title = label;
  button.setAttribute("aria-label", label);
  button.addEventListener("click", callback);
  return button;
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    showToast("సమాధానం కాపీ అయింది.");
  } catch {
    const area = document.createElement("textarea");
    area.value = text;
    area.style.position = "fixed";
    area.style.opacity = "0";
    document.body.appendChild(area);
    area.select();
    const ok = document.execCommand("copy");
    area.remove();
    showToast(ok ? "సమాధానం కాపీ అయింది." : "కాపీ కాలేదు. సమాధానాన్ని సెలెక్ట్ చేయండి.");
  }
}

function speakText(text) {
  if (!("speechSynthesis" in window)) {
    showToast("ఈ బ్రౌజర్‌లో వాయిస్ ఫీచర్ అందుబాటులో లేదు.");
    return;
  }
  window.speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = "te-IN";
  window.speechSynthesis.speak(utterance);
}

function getAnswerFromResponse(data) {
  if (typeof data === "string") return data;
  if (!data || typeof data !== "object") return "";
  if (typeof data.answer === "string") return data.answer;
  if (typeof data.reply === "string") return data.reply;
  if (typeof data.message === "string" && data.status !== "ready") {
    return data.message;
  }
  return "";
}

async function getAIResponse(history, files) {
  /*
    The Worker must accept POST JSON with a messages array
    and return JSON containing answer or reply.
    This frontend does not expose the secret API key.
  */
  const payload = {
    messages: history
  };

  /*
    Files are selected in the UI, but image understanding requires
    additional image-upload/base64 support in the Worker.
  */
  if (files.length) {
    throw new Error(
      "ఫోటోలు ఎంచుకున్నారు. ఫోటోలను AI విశ్లేషించాలంటే Worker‌లో image support కూడా అమర్చాలి. ప్రస్తుతం టెక్స్ట్ ప్రశ్నను మాత్రమే పంపండి."
    );
  }

  let response;
  try {
    response = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
  } catch {
    throw new Error(
      "సర్వర్‌కు కనెక్ట్ కాలేదు. ఇంటర్నెట్ కనెక్షన్, Cloudflare Worker URL తనిఖీ చేయండి."
    );
  }

  const raw = await response.text();
  let data;
  try {
    data = JSON.parse(raw);
  } catch {
    data = { message: raw };
  }

  if (!response.ok) {
    const detail = data.error || data.message || ("HTTP " + response.status);
    throw new Error("AI సర్వర్ సమస్య: " + detail);
  }

  const answer = getAnswerFromResponse(data);
  if (!answer) {
    if (data.status === "ready") {
      throw new Error(
        "Worker నడుస్తోంది, కానీ AI సమాధానం ఇచ్చే POST API ఇంకా సరిగ్గా అమర్చబడలేదు."
      );
    }
    throw new Error(
      "సర్వర్ నుంచి సమాధానం రాలేదు. Worker‌లో AI API కోడ్‌ను తనిఖీ చేయండి."
    );
  }
  return answer;
}

async function sendMessage() {
  if (isSending) return;

  const text = questionEl.value.trim();
  if (!text && !attachedFiles.length) {
    showToast("ముందుగా మీ ప్రశ్నను టైప్ చేయండి.");
    questionEl.focus();
    return;
  }

  if (attachedFiles.length) {
    showToast("ఫోటో విశ్లేషణ కోసం Worker‌లో image support అవసరం.");
    return;
  }

  const userText = text;
  chat.push({ role: "user", content: userText });
  createMessage("user", userText);
  welcomeEl.style.display = "none";
  questionEl.value = "";
  questionEl.style.height = "48px";
  updateHistory();

  const loading = createMessage("assistant", "⏳ సమాధానం తయారు చేస్తున్నాను...");
  const answerBody = loading.querySelector(".answer-text");

  isSending = true;
  sendButton.disabled = true;
  sendButton.textContent = "…";

  try {
    const answer = await getAIResponse(chat, attachedFiles);
    chat.push({ role: "assistant", content: answer });
    answerBody.textContent = answer;
    updateHistory();
  } catch (error) {
    answerBody.textContent =
      "క్షమించండి. " + (error.message || "సమాధానం పొందలేకపోయాను.");
    answerBody.classList.add("error");

    const retry = document.createElement("button");
    retry.className = "tool-btn";
    retry.textContent = "మళ్లీ ప్రయత్నించండి";
    retry.style.marginTop = "12px";
    retry.addEventListener("click", () => {
      loading.remove();
      questionEl.value = userText;
      sendMessage();
    });
    loading.querySelector(".answer").appendChild(retry);
  } finally {
    isSending = false;
    sendButton.disabled = false;
    sendButton.textContent = "➤";
  }
}

sendButton.addEventListener("click", sendMessage);

questionEl.addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
});

questionEl.addEventListener("input", () => {
  questionEl.style.height = "48px";
  questionEl.style.height = Math.min(questionEl.scrollHeight, 150) + "px";
});

$("micButton").addEventListener("click", () => {
  const SpeechRecognition =
    window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    showToast("వాయిస్ ఇన్‌పుట్‌కు Chrome అనుమతి లేదా మద్దతు అవసరం.");
    return;
  }

  const recognition = new SpeechRecognition();
  recognition.lang = "te-IN";
  recognition.interimResults = false;
  recognition.onresult = event => {
    questionEl.value += event.results[0][0].transcript;
    questionEl.focus();
  };
  recognition.onerror = () => {
    showToast("మైక్రోఫోన్ అనుమతిని తనిఖీ చేయండి.");
  };
  recognition.start();
});

</script>
</body>
</html>
