<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#030817">
<title>AI Sameer</title>

<style>
:root {
  --bg:#030611;
  --panel:#08152d;
  --blue:#155dfb;
  --cyan:#16caff;
  --text:#f5f7ff;
  --muted:#a5b3cf;
  --border:#243b68;
}
* { box-sizing:border-box; }
body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial, sans-serif;
  min-height:100vh;
}
button,input,textarea { font:inherit; }
button {
  color:inherit;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
button:focus-visible,input:focus-visible,textarea:focus-visible {
  outline:2px solid var(--cyan);
}
.topbar {
  height:65px;
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 15px;
  background:#061027;
  border-bottom:1px solid var(--border);
}
.top-left,.top-right {
  display:flex;
  align-items:center;
  gap:10px;
}
.icon-btn {
  border:0;
  background:transparent;
  border-radius:12px;
  width:43px;
  height:43px;
  font-size:25px;
}
.icon-btn:active { background:#1b2d50; }
.brand {
  border:0;
  background:transparent;
  font-size:20px;
  font-weight:700;
  padding:10px;
}
.brand span { color:var(--cyan); }
.layout {
  min-height:calc(100vh - 65px);
}
.sidebar {
  position:fixed;
  top:65px;
  bottom:0;
  left:0;
  z-index:40;
  width:290px;
  padding:18px 13px;
  background:#061329;
  border-right:1px solid var(--border);
  transform:translateX(-105%);
  transition:transform .22s ease;
  overflow-y:auto;
}
.sidebar.open { transform:translateX(0); }
.side-brand {
  display:flex;
  align-items:center;
  gap:12px;
  padding:8px 10px 18px;
  font-size:20px;
  font-weight:bold;
}
.side-brand .spark { font-size:34px; }
.side-item {
  display:flex;
  align-items:center;
  gap:14px;
  width:100%;
  border:0;
  padding:13px 14px;
  margin:3px 0;
  text-align:left;
  background:transparent;
  border-radius:16px;
  font-size:16px;
}
.side-item .ico { width:25px; text-align:center; }
.side-item:hover,.side-item.active { background:#1044a8; }
.side-separator {
  border:0;
  border-top:1px solid var(--border);
  margin:14px 4px;
}
.account {
  margin-top:20px;
  padding:12px 8px;
  color:#dce8ff;
  font-size:14px;
}
.scrim {
  display:none;
  position:fixed;
  inset:65px 0 0;
  z-index:30;
  background:#0009;
}
.scrim.show { display:block; }
main {
  max-width:900px;
  margin:auto;
  padding:20px 17px 165px;
}
.welcome {
  min-height:calc(100vh - 270px);
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  text-align:center;
  padding:15px 0;
}
.banana {
  font-size:105px;
  line-height:1.2;
  filter:drop-shadow(0 0 24px #087dff);
  animation:float 3s ease-in-out infinite;
}
@keyframes float {
  0%,100% { transform:translateY(0); }
  50% { transform:translateY(-8px); }
}
.welcome h1 {
  font-size:clamp(27px,6vw,43px);
  line-height:1.2;
  margin:22px 0 8px;
}
.welcome h1 span {
  color:var(--cyan);
}
.welcome p {
  color:var(--muted);
  margin:0;
  font-size:15px;
}
.messages {
  display:flex;
  flex-direction:column;
  gap:20px;
}
.message {
  max-width:95%;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  line-height:1.65;
  font-size:16px;
}
.message.user {
  align-self:flex-end;
  background:#192849;
  padding:13px 16px;
  border-radius:20px 20px 5px 20px;
}
.message.assistant {
  align-self:stretch;
}
.message.assistant .answer {
  padding:3px 2px 12px;
}
.message-actions {
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  padding-top:10px;
  border-top:1px solid #25334c;
}
.message-actions button {
  border:0;
  background:transparent;
  padding:7px 10px;
  border-radius:10px;
  font-size:17px;
}
.message-actions button:hover { background:#172744; }
.composer-wrap {
  position:fixed;
  bottom:12px;
  left:0;
  right:0;
  z-index:25;
  padding:0 14px;
}
.composer {
  position:relative;
  display:flex;
  align-items:center;
  gap:5px;
  max-width:860px;
  min-height:72px;
  margin:auto;
  padding:8px;
  border:1px solid #35568b;
  border-radius:38px;
  background:#0a1730;
  box-shadow:0 0 18px #075cff36;
}
.plus-btn {
  flex:0 0 48px;
  width:48px;
  height:48px;
  border:1px solid #178cff;
  border-radius:50%;
  background:#092c70;
  font-size:25px;
  box-shadow:0 0 12px #087cff70;
}
.banana-mini { font-size:22px; }
#prompt {
  min-width:0;
  flex:1;
  resize:none;
  height:42px;
  max-height:110px;
  padding:11px 5px;
  border:0;
  outline:none;
  background:transparent;
  color:white;
  font-size:16px;
}
#prompt::placeholder { color:#91a4c8; }
.mic-btn,.send-btn {
  flex:0 0 44px;
  width:44px;
  height:44px;
  border:0;
  border-radius:50%;
  background:transparent;
  font-size:22px;
}
.send-btn {
  flex-basis:48px;
  width:48px;
  height:48px;
  background:var(--blue);
  font-size:24px;
}
.send-btn:disabled { opacity:.55; }
.voice-btn {
  display:none;
  flex:0 0 48px;
  height:48px;
  width:48px;
  border:0;
  border-radius:50%;
  background:#155dfb;
  font-size:24px;
}
.plus-menu {
  display:none;
  position:absolute;
  left:0;
  bottom:84px;
  width:min(330px,calc(100vw - 28px));
  max-height:min(62vh,520px);
  overflow:auto;
  padding:12px;
  background:#1b1b1d;
  border:1px solid #343941;
  border-radius:28px;
  box-shadow:0 12px 38px #0009;
}
.plus-menu.open { display:block; }
.menu-handle {
  width:65px;
  height:5px;
  margin:0 auto 14px;
  background:#777;
  border-radius:8px;
}
.quick-grid {
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:7px;
  margin-bottom:12px;
}
.quick-option {
  min-height:100px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:10px;
  border:0;
  border-radius:28px;
  background:#111113;
  font-size:14px;
}
.quick-option .big-icon { font-size:27px; }
.quick-option:hover,.tool-option:hover { background:#29303d; }
.tool-option {
  display:flex;
  align-items:center;
  gap:16px;
  width:100%;
  border:0;
  background:transparent;
  text-align:left;
  padding:13px 12px;
  border-radius:14px;
  font-size:16px;
}
.tool-option .tool-icon {
  width:28px;
  text-align:center;
  font-size:23px;
}
.tool-option small {
  display:block;
  color:#a6a6ac;
  font-size:12px;
  margin-top:5px;
}
.model-menu {
  display:none;
  position:absolute;
  top:58px;
  left:50%;
  transform:translateX(-50%);
  width:min(285px,90vw);
  padding:8px;
  border:1px solid #304c79;
  border-radius:20px;
  background:#08152d;
  box-shadow:0 10px 35px #000b;
}
.model-menu.open { display:block; }
.model-option {
  width:100%;
  display:flex;
  gap:12px;
  align-items:center;
  border:0;
  border-radius:12px;
  background:transparent;
  text-align:left;
  padding:12px;
  font-size:15px;
}
.model-option.selected,.model-option:hover {
  background:#1046aa;
}
.model-option .check { margin-left:auto; }
.modal-backdrop {
  display:none;
  position:fixed;
  inset:0;
  z-index:100;
  background:#000b;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.modal-backdrop.open { display:flex; }
.modal {
  width:min(400px,100%);
  background:#0b1730;
  border:1px solid var(--border);
  border-radius:22px;
  padding:22px;
  text-align:center;
}
.modal h2 { margin-top:0; }
.modal button {
  border:0;
  border-radius:12px;
  background:#155dfb;
  padding:11px 17px;
  margin:6px;
}
.modal .secondary { background:#29354d; }
.avatar-preview {
  font-size:90px;
  filter:drop-shadow(0 0 18px #087dff);
}
#status {
  font-size:13px;
  color:var(--muted);
  text-align:center;
  margin-top:8px;
}
@media(min-width:850px) {
  body.sidebar-visible .sidebar { transform:translateX(0); }
  body.sidebar-visible main { margin-left:290px; }
  body.sidebar-visible .composer-wrap { left:290px; }
}
@media(max-width:480px) {
  .topbar { padding:0 9px; }
  .brand { font-size:18px; }
  main { padding-left:14px; padding-right:14px; }
  .banana { font-size:85px; }
  .welcome h1 { font-size:30px; }
  .composer-wrap { bottom:10px; padding:0 10px; }
  .composer { min-height:66px; padding:6px; gap:3px; }
  .plus-btn { flex-basis:43px; width:43px; height:43px; }
  #prompt { font-size:15px; }
  .mic-btn { flex-basis:36px; width:36px; font-size:20px; }
  .send-btn { flex-basis:43px; width:43px; height:43px; }
}
</style>
</head>

<body>
<header class="topbar">
  <div class="top-left">
    <button class="icon-btn" id="menuToggle"
      aria-label="Open menu">☰</button>
    <button class="brand" id="brandToggle">
      AI Sameer <span>⌄</span>
    </button>
  </div>
  <div class="top-right">
    <button class="icon-btn" id="newChat" aria-label="New chat">✎</button>
  </div>
  <div class="model-menu" id="modelMenu">
    <button class="model-option selected" data-model="AI Sameer">
      ✨ AI Sameer <span class="check">✓</span>
    </button>
    <button class="model-option" data-model="Fast">
      ⚡ Fast
    </button>
    <button class="model-option" data-model="Creative">
      👑 Creative
    </button>
    <button class="model-option" data-model="Reasoning">
      ◈ Reasoning
    </button>
    <button class="model-option" data-model="Research">
      ✺ Research
    </button>
  </div>
</header>

<div class="scrim" id="scrim"></div>

<aside class="sidebar" id="sidebar">
  <div class="side-brand">
    <span class="spark">✨</span> AI Sameer
  </div>
  <button class="side-item active" data-action="new">
    <span class="ico">▣</span> New chat
  </button>
  <button class="side-item" data-action="search">
    <span class="ico">⌕</span> Search chats
  </button>
  <button class="side-item" data-action="images">
    <span class="ico">▧</span> Images
  </button>
  <button class="side-item" data-action="library">
    <span class="ico">▦</span> Library
  </button>
  <hr class="side-separator">
  <button class="side-item" data-action="settings">
    <span class="ico">⚙</span> Settings
  </button>
  <button class="side-item" data-action="help">
    <span class="ico">ⓘ</span> Help & feedback
  </button>
  <hr class="side-separator">
  <div class="account">👤 Shaik Mahammad</div>
</aside>

<main>
  <section class="welcome" id="welcome">
    <div class="banana" id="mainBanana">🍌</div>
    <h1>Hi! I am <span>AI Sameer</span></h1>
    <p>What should we focus on?</p>
  </section>

  <section class="messages" id="messages"></section>
</main>

<div class="composer-wrap">
  <div class="composer">
    <button class="plus-btn" id="plusToggle"
      aria-label="Add to chat"><span class="banana-mini">🍌</span></button>

    <textarea id="prompt" rows="1"
      placeholder="Ask AI Sameer..." aria-label="Message"></textarea>

    <button class="mic-btn" id="micButton"
      aria-label="Voice typing">🎙</button>

    <button class="send-btn" id="sendButton"
      aria-label="Send message">➤</button>

    <button class="voice-btn" id="voiceButton"
      aria-label="Voice mode">〽</button>

    <div class="plus-menu" id="plusMenu">
      <div class="menu-handle"></div>

      <div class="quick-grid">
        <button class="quick-option" data-tool="Photos">
          <span class="big-icon">▧</span>Photos
        </button>
        <button class="quick-option" data-tool="Camera">
          <span class="big-icon">◎</span>Camera
        </button>
        <button class="quick-option" data-tool="Avatar">
          <span class="big-icon">☻</span>Avatar
        </button>
      </div>

      <button class="tool-option" data-tool="Images">
        <span class="tool-icon">▧</span>
        <span>Images<small>Create and edit</small></span>
      </button>
      <button class="tool-option" data-tool="Music">
        <span class="tool-icon">♫</span>
        <span>Music<small>Make audio tracks</small></span>
      </button>
      <button class="tool-option" data-tool="Canvas">
        <span class="tool-icon">▣</span>
        <span>Canvas<small>Code, write or make slides</small></span>
      </button>
      <button class="tool-option" data-tool="Deep Research">
        <span class="tool-icon">◎</span>
        <span>Deep Research<small>Get detailed reports</small></span>
      </button>
      <button class="tool-option" data-tool="Guided Learning">
        <span class="tool-icon">♧</span>
        <span>Guided Learning<small>Get step-by-step help</small></span>
      </button>
      <button class="tool-option" data-tool="Personal Intelligence">
        <span class="tool-icon">♙</span>
        <span>Personal Intelligence<small>Personalise chat if helpful</small></span>
      </button>
    </div>
  </div>
  <div id="status"></div>
</div>

<input type="file" id="photoInput"
  accept="image/*" hidden>
<input type="file" id="cameraInput"
  accept="image/*" capture="environment" hidden>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <h2 id="modalTitle">AI Sameer</h2>
    <div class="avatar-preview" id="avatarPreview">🍌</div>
    <p id="modalText">Welcome to AI Sameer!</p>
    <div id="modalExtra"></div>
    <button id="modalClose">Close</button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);

const sidebar = $("sidebar");
const scrim = $("scrim");
const plusMenu = $("plusMenu");
const modelMenu = $("modelMenu");
const promptBox = $("prompt");
const messages = $("messages");
const welcome = $("welcome");
const statusBox = $("status");
const modalBackdrop = $("modalBackdrop");

let currentModel = "AI Sameer";
let selectedImage = null;
let recognition = null;

/*
  IMPORTANT:
  Add your deployed Cloudflare Worker URL below.
  Example: https://your-worker.your-subdomain.workers.dev
  Do not put a secret API key in this public HTML.
*/
const WORKER_URL = "";

function showStatus(text) {
  statusBox.textContent = text || "";
}

function closeMenus() {
  plusMenu.classList.remove("open");
  modelMenu.classList.remove("open");
}

function toggleSidebar() {
  const open = !sidebar.classList.contains("open");
  sidebar.classList.toggle("open", open);
  scrim.classList.toggle("show", open);

  if (window.innerWidth >= 850) {
    document.body.classList.toggle("sidebar-visible", open);
  }
}

$("menuToggle").addEventListener("click", toggleSidebar);

scrim.addEventListener("click", () => {
  sidebar.classList.remove("open");
  scrim.classList.remove("show");
  document.body.classList.remove("sidebar-visible");
});

$("brandToggle").addEventListener("click", () => {
  plusMenu.classList.remove("open");
  modelMenu.classList.toggle("open");
});

$("plusToggle").addEventListener("click", () => {
  modelMenu.classList.remove("open");
  plusMenu.classList.toggle("open");
});

document.addEventListener("click", event => {
  if (!event.target.closest("#brandToggle") &&
      !event.target.closest("#modelMenu") &&
      !event.target.closest("#plusToggle") &&
      !event.target.closest("#plusMenu")) {
    closeMenus();
  }
});

document.querySelectorAll(".model-option").forEach(button => {
  button.addEventListener("click", () => {
    currentModel = button.dataset.model;
    $("brandToggle").innerHTML =
      currentModel + ' <span>⌄</span>';

    document.querySelectorAll(".model-option").forEach(item => {
      item.classList.remove("selected");
      item.querySelector(".check")?.remove();
    });

    button.classList.add("selected");
    const check = document.createElement("span");
    check.className = "check";
    check.textContent = "✓";
    button.appendChild(check);
    modelMenu.classList.remove("open");
    showStatus("ఎంచుకున్న మోడ్: " + currentModel);
  });
});

function newChat() {
  messages.innerHTML = "";
  welcome.style.display = "flex";
  promptBox.value = "";
  selectedImage = null;
  showStatus("");
  closeMenus();
}

$("newChat").addEventListener("click", newChat);

document.querySelector('[data-action="new"]')
  .addEventListener("click", () => {
    newChat();
    sidebar.classList.remove("open");
    scrim.classList.remove("show");
    document.body.classList.remove("sidebar-visible");
  });

document.querySelectorAll("[data-action]").forEach(button => {
  if (button.dataset.action === "new") return;

  button.addEventListener("click", () => {
    const action = button.dataset.action;
    sidebar.classList.remove("open");
    scrim.classList.remove("show");
    document.body.classList.remove("sidebar-visible");

    if (action === "search") {
      showModal("Search chats",
        "మీ చాట్‌ను వెతకడానికి ప్రశ్న లేదా పదాన్ని టైప్ చేయండి.",
        "search");
    } else if (action === "settings") {
      showModal("Settings",
        "AI Sameer సెట్టింగ్స్. మోడల్‌ను పైన ఎంచుకోవచ్చు.");
    } else if (action === "help") {
      showModal("Help & feedback",
        "మీ సమస్యను AI Sameer చాట్‌లో టైప్ చేయండి.");
    } else if (action === "images") {
      $("photoInput").click();
    } else if (action === "library") {
      showModal("Library",
        "ఈ డెమోలో గత చాట్‌ల శాశ్వత నిల్వ ఇంకా అమర్చలేదు.");
    }
  });
});

function showModal(title, text, mode) {
  $("modalTitle").textContent = title;
  $("modalText").textContent = text;
  $("modalExtra").innerHTML = "";

  if (mode === "search") {
    const input = document.createElement("input");
    input.placeholder = "Search...";
    input.style.cssText =
      "width:100%;padding:12px;border-radius:10px;" +
      "background:#101c32;color:white;border:1px solid #345";
    input.addEventListener("keydown", event => {
      if (event.key === "Enter") {
        promptBox.value = input.value;
        modalBackdrop.classList.remove("open");
        promptBox.focus();
      }
    });
    $("modalExtra").appendChild(input);
  }

  modalBackdrop.classList.add("open");
}

$("modalClose").addEventListener("click", () => {
  modalBackdrop.classList.remove("open");
});

modalBackdrop.addEventListener("click", event => {
  if (event.target === modalBackdrop) {
    modalBackdrop.classList.remove("open");
  }
});

document.querySelectorAll("[data-tool]").forEach(button => {
  button.addEventListener("click", () => {
    const tool = button.dataset.tool;
    closeMenus();

    if (tool === "Photos" || tool === "Images") {
      $("photoInput").click();
      return;
    }

    if (tool === "Camera") {
      $("cameraInput").click();
      return;
    }

    if (tool === "Avatar") {
      showModal("AI Sameer Avatar",
        "🍌 మీ అవతార్ ఫీచర్. మీ ఫోటోను ఎంచుకోవడానికి Photos బటన్ ఉపయోగించండి.");
      $("avatarPreview").textContent = "🍌";
      return;
    }

    const prompts = {
      "Music":"నా కోసం ఒక మ్యూజిక్ ఐడియా తయారు చేయి.",
      "Canvas":"ఒక Canvas తయారు చేయడంలో సహాయం చేయి.",
      "Deep Research":"ఈ అంశంపై వివరంగా పరిశోధన చేయి.",
      "Guided Learning":"ఈ విషయాన్ని దశలవారీగా నేర్పించు.",
      "Personal Intelligence":"నా ప్రశ్నకు వ్యక్తిగతీకరించిన సహాయం ఇవ్వు."
    };

    promptBox.value = prompts[tool] || tool;
    promptBox.focus();
    showStatus(tool + " ఎంపికైంది. పంపడానికి Send నొక్కండి.");
  });
});

function handleImage(file) {
  if (!file) return;

  if (!file.type.startsWith("image/")) {
