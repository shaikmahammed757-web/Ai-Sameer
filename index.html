<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SK MD Bike Puzzle & Earn</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0f172a;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
        }
        header {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            padding: 14px;
            font-size: 18px;
            font-weight: bold;
            color: #000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .container {
            padding: 10px;
            max-width: 400px;
            margin: auto;
        }
        .wallet-box {
            background: #1e293b;
            border: 2px solid #f59e0b;
            padding: 8px;
            margin: 8px 0;
            border-radius: 8px;
        }
        .balance-text {
            color: #4ade80;
            font-weight: bold;
            font-size: 16px;
        }
        .game-screen {
            background: #1e293b;
            border: 3px solid #3b82f6;
            border-radius: 12px;
            padding: 10px;
            margin-top: 5px;
        }
        .blueprint-board {
            width: 100%;
            height: 200px;
            background: #1e3a8a;
            border: 3px dashed #60a5fa;
            border-radius: 10px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 6px;
            padding: 6px;
            margin-bottom: 10px;
        }
        .blueprint-slot {
            background: rgba(15, 23, 42, 0.8);
            border: 2px solid #93c5fd;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: #93c5fd;
            cursor: pointer;
            overflow: hidden;
        }
        .blueprint-slot img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .parts-pool {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin-bottom: 10px;
        }
        .pool-piece {
            background: #334155;
            border: 2px solid #f59e0b;
            border-radius: 8px;
            height: 65px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            overflow: hidden;
            transition: 0.2s;
        }
        .pool-piece img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .pool-piece:active {
            transform: scale(0.92);
        }
        .action-btn {
            background: #22c55e;
            color: white;
            border: none;
            padding: 10px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>
<body>

    <header>SK MD Bike Puzzle & Earn</header>

    <div class="container">
        <div class="wallet-box">
            <p style="margin:2px 0;">Wallet Balance: <span class="balance-text" id="balance">₹0</span></p>
            <p style="margin:2px 0; font-size: 11px; color: #94a3b8;">Min. Withdrawal Limit: <b>₹1000</b></p>
        </div>

        <div class="game-screen">
            <h3 style="margin:4px 0;">Bike Mechanic Puzzle</h3>
            <p style="font-size: 11px; color: #cbd5e1; margin-bottom: 8px;">Tap a bike part photo below, then tap the blueprint slot!</p>
            
            <!-- Blueprint Target Slots -->
            <div class="blueprint-board">
                <div class="blueprint-slot" id="slot0" onclick="fitPart(0)">Slot 1</div>
                <div class="blueprint-slot" id="slot1" onclick="fitPart(1)">Slot 2</div>
                <div class="blueprint-slot" id="slot2" onclick="fitPart(2)">Slot 3</div>
                <div class="blueprint-slot" id="slot3" onclick="fitPart(3)">Slot 4</div>
            </div>

            <div style="font-size:12px; color:#f59e0b; margin-bottom:4px;">Available Bike Parts Photos</div>
            
            <!-- Available Photo Pieces Pool -->
            <div class="parts-pool" id="poolContainer">
                <!-- Generated via JS -->
            </div>

            <button class="action-btn" onclick="checkPuzzleCompletion()">Check & Earn ₹50</button>
        </div>
    </div>

    <script>
        let balance = 0;
        let selectedImgUrl = null;
        
        // Professional high-quality bike parts images
        const bikeImages = [
            { id: 0, url: "https://images.unsplash.com/photo-1558981806-ec527fa84c39?w=200&auto=format&fit=crop&q=80" }, // Bike Tank/Body
            { id: 1, url: "https://images.unsplash.com/photo-1568772585407-9361f9bf3a87?w=200&auto=format&fit=crop&q=80" }, // Engine/Parts
            { id: 2, url: "https://images.unsplash.com/photo-1502745484501-c9676a71026e?w=200&auto=format&fit=crop&q=80" }, // Wheel
            { id: 3, url: "https://images.unsplash.com/photo-1449426468159-d96dbf08f19f?w=200&auto=format&fit=crop&q=80" }  // Handle/Custom Bike
        ];

        let currentSlots = [null, null, null, null];

        function initGame() {
            document.getElementById("balance").innerText = "₹" + balance;
            currentSlots = [null, null, null, null];
            updateBoard();
            
            let pool = document.getElementById("poolContainer");
            pool.innerHTML = "";
            
            let shuffledPool = [...bikeImages].sort(() => Math.random() - 0.5);
            shuffledPool.forEach(item => {
                let div = document.createElement("div");
                div.className = "pool-piece";
                div.innerHTML = `<img src="${item.url}" alt="Bike Part">`;
                div.onclick = function() {
                    selectedImgUrl = item.url;
                    div.style.borderColor = "#22c55e";
                    alert("Bike part photo selected! Now tap any slot on the blueprint above.");
                };
                pool.appendChild(div);
            });
        }

        function updateBoard() {
            for(let i=0; i<4; i++) {
                let slot = document.getElementById("slot" + i);
                if(currentSlots[i]) {
                    slot.innerHTML = `<img src="${currentSlots[i]}" alt="Fitted Part">`;
                } else {
                    slot.innerHTML = `Slot ${i+1}`;
                }
            }
        }

        function fitPart(slotIndex) {
            if(selectedImgUrl) {
                currentSlots[slotIndex] = selectedImgUrl;
                selectedImgUrl = null;
                updateBoard();
            } else {
                alert("Please select a bike part photo from the bottom panel first!");
            }
        }

        function checkPuzzleCompletion() {
            balance += 50;
            if(balance >= 1000) {
                alert("🎉 అభినందనలు! మీరు ₹1000 విత్‌డ్రా లిమిట్ చేరుకున్నారు.");
            } else {
                alert("✨ అద్భుతం! బైక్ పజిల్ విజయవంతంగా పూర్తయింది. ₹50 మీ వాలెట్‌కి చేరింది!");
            }
            initGame();
        }

        initGame();
    </script>
</body>
</html>
