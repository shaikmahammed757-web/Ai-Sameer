
<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101019">
<meta name="description" content="AI Sameer - Your personal AI assistant">
<title>AI Sameer</title>
<link rel="manifest" href="./manifest.json">

<style>
*{box-sizing:border-box}
:root{
--bg:#101019;--panel:#191925;--panel2:#252538;
--line:#38384e;--text:#f5f3ff;--muted:#aaa9bf;
--purple:#8270ff;--blue:#43b9ed
}
body{margin:0;background:var(--bg);color:var(--text);
font-family:Arial,sans-serif;min-height:100vh}
button,input,textarea,select{font:inherit}
button{cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{
outline:2px solid var(--purple)}
.topbar{height:66px;display:flex;align-items:center;gap:10px;
padding:0 12px;border-bottom:1px solid var(--line);
position:sticky;top:0;background:var(--bg);z-index:5}
.brand{font-size:22px;font-weight:800;flex:1}
.iconbtn{border:0;border-radius:13px;background:var(--panel2);
min-width:43px;height:43px;font-size:22px}
.lang{max-width:115px;background:var(--panel2);color:white;
border:1px solid var(--line);border-radius:12px;padding:9px}
.layout{min-height:calc(100dvh - 66px)}
.main{max-width:850px;margin:auto;padding:18px 15px 165px}
.welcome{text-align:center;padding:40px 0 25px}
.logo{margin:auto auto 22px;width:84px;height:84px;border-radius:27px;
display:grid;place-items:center;font-size:45px;
background:linear-gradient(135deg,#8170ff,#28b8d9)}
h1{font-size:clamp(27px,6vw,38px);margin:12px 0}
.sub{color:var(--muted);line-height:1.8}
.suggestions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
gap:10px;margin-top:26px}
.suggestion{background:var(--panel);border:1px solid var(--line);
border-radius:17px;text-align:left;padding:17px 12px;line-height:1.5}
#messages{display:flex;flex-direction:column;gap:16px}
.message{max-width:94%;padding:14px 16px;border-radius:18px;
line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere}
.user{align-self:flex-end;background:#34334e}
.assistant{align-self:flex-start;background:var(--panel)}
.message small{display:block;color:var(--muted);margin-bottom:5px}
.message-actions{display:flex;gap:8px;margin-top:10px}
.message-actions button{background:var(--panel2);border:0;
border-radius:9px;padding:7px 10px}
.composer-wrap{position:fixed;bottom:0;left:0;right:0;
z-index:6;padding:10px 12px 15px;
background:linear-gradient(transparent,var(--bg) 20%)}
.composer{max-width:850px;margin:auto;display:flex;align-items:flex-end;
gap:7px;padding:9px;background:var(--panel);
border:1px solid var(--line);border-radius:23px}
#prompt{flex:1;min-width:0;max-height:130px;min-height:44px;
resize:vertical;background:transparent;border:0;outline:0;
color:white;padding:12px 4px}
.send{background:var(--purple);border:0;border-radius:15px;
width:47px;height:47px;font-size:24px}
.plus{width:44px;height:44px;border:0;border-radius:14px;
background:#34334b;font-size:27px}
.mic{width:38px;height:44px;background:transparent;
border:0;font-size:20px}
.drawer-back,.modal-back{display:none;position:fixed;inset:0;
background:#0009;z-index:10}
.drawer{position:absolute;top:0;bottom:0;left:0;
width:min(310px,86vw);background:#15151f;padding:16px 12px;
overflow-y:auto}
.drawer-head{display:flex;align-items:center;padding:5px 5px 18px}
.drawer-head strong{font-size:23px;flex:1}
.close{border:0;background:transparent;font-size:27px}
.navbtn{width:100%;display:flex;align-items:center;gap:15px;
padding:13px 12px;border:0;border-radius:13px;
background:transparent;text-align:left;margin:3px 0;font-size:16px}
.navbtn:hover{background:var(--panel2)}
.navbtn span:first-child{width:27px;text-align:center;font-size:21px}
.section{font-size:14px;color:var(--muted);padding:19px 12px 8px}
.history{font-size:14px;overflow-wrap:anywhere}
.profile{position:sticky;bottom:-16px;background:#15151f;
display:flex;align-items:center;gap:10px;padding:14px 6px}
.avatar{width:38px;height:38px;border-radius:50%;
display:grid;place-items:center;background:#5146a0}
.profile-name{flex:1;font-size:14px;overflow:hidden}
.modal-back{z-index:12;align-items:flex-end;justify-content:center}
.modal{width:min(600px,100%);max-height:86dvh;overflow:auto;
background:#191925;border:1px solid var(--line);
border-radius:24px 24px 0 0;padding:18px 15px 28px}
.modal-head{display:flex;align-items:center;
justify-content:space-between;margin-bottom:15px}
.modal-head h2{font-size:21px;margin:4px 0}
.feature-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
gap:10px}
.feature{min-height:95px;background:var(--panel2);
border:1px solid var(--line);border-radius:16px;padding:12px 5px;
display:flex;flex-direction:column;align-items:center;
justify-content:center;gap:9px;text-align:center;font-size:13px}
.feature b{font-size:25px;font-weight:400}
.field{width:100%;padding:13px;border-radius:12px;
background:var(--bg);border:1px solid var(--line);
color:white;margin:8px 0}
.primary{background:var(--purple);border:0;border-radius:12px;
padding:12px 16px;color:white}
.secondary{background:var(--panel2);border:1px solid var(--line);
border-radius:12px;padding:10px}
.result{padding:13px;border:1px solid var(--line);
border-radius:14px;margin:10px 0;line-height:1.6}
.note{color:var(--muted);font-size:12px;line-height:1.6}
.hidden{display:none!important}
.install{background:#34334b;color:white;border:1px solid var(--line);
border-radius:11px;padding:8px 10px;font-size:12px}
@media(max-width:390px){
.brand{font-size:19px}
.suggestions{grid-template-columns:1fr}
.main{padding-left:11px;padding-right:11px}
.feature-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.lang{max-width:95px}
}
</style>
</head>

<body>
<header class="topbar">
<button class="iconbtn" id="menuBtn" aria-label="Menu">☰</button>
<div class="brand">✦ AI Sameer</div>
<button class="install hidden" id="installBtn">⬇ Install</button>
<select class="lang" id="language" aria-label="Language">
<option value="te">తెలుగు</option>
<option value="en">English</option>
<option value="hi">हिन्दी</option>
<option value="kn">ಕನ್ನಡ</option>
<option value="ur">اردو</option>
</select>
</header>

<div class="layout">
<main class="main">
<section class="welcome" id="welcome">
<div class="logo">✦</div>
<h1 id="welcomeTitle">నమస్కారం! 👋</h1>
<p class="sub" id="welcomeSub">నేను AI Sameer. ఈరోజు మీకు ఎలా సహాయం చేయగలను?</p>
<div class="suggestions">
<button class="suggestion" data-prompt="నా YouTube వీడియో కోసం మంచి ఐడియాలు ఇవ్వండి">🎬 YouTube వీడియో ఐడియాలు</button>
<button class="suggestion" data-prompt="నాకు ఒక వెబ్‌సైట్ కోడ్ తయారు చేయండి">💻 వెబ్‌సైట్ కోడ్</button>
<button class="suggestion" data-prompt="నాకు ఇంగ్లీష్ నేర్పించండి">📚 ఇంగ్లీష్ నేర్చుకుందాం</button>
<button class="suggestion" data-prompt="ఒక మంచి కథ రాయండి">✍️ కథలు మరియు రైటింగ్</button>
</div>
</section>
<section id="messages" aria-live="polite"></section>
</main>
</div>

<div class="composer-wrap">
<div class="composer">
<button class="plus" id="plusBtn" aria-label="More features">＋</button>
<textarea id="prompt" rows="1" placeholder="మీ ప్రశ్నను ఇక్కడ టైప్ చేయండి..." aria-label="Message"></textarea>
<button class="mic" id="micBtn" title="Voice input">🎙️</button>
<button class="send" id="sendBtn" aria-label="Send">➤</button>
</div>
<p class="note" style="text-align:center">AI సమాధానాల్లో తప్పులు ఉండవచ్చు. ముఖ్యమైన సమాచారాన్ని తనిఖీ చేయండి.</p>
</div>

<div class="drawer-back" id="drawerBack">
<aside class="drawer">
<div class="drawer-head">
<strong>✦ AI Sameer</strong>
<button class="close" id="closeDrawer">×</button>
</div>
<button class="navbtn" id="newChat"><span>✎</span>New chat</button>
<button class="navbtn" id="searchBtn"><span>⌕</span>Search chats</button>
<button class="navbtn" data-feature="Images"><span>▧</span>Images</button>
<button class="navbtn" data-feature="Library"><span>⊞</span>Library</button>
<div class="section">Notebooks</div>
<button class="navbtn" data-feature="New notebook"><span>＋</span>New notebook</button>
<div class="section">Recent chats</div>
<div id="historyList" class="history"></div>
<div class="profile">
<div class="avatar">S</div>
<div class="profile-name">AI Sameer User</div>
<button class="iconbtn" id="settingsBtn">⚙</button>
</div>
</aside>
</div>

<div class="modal-back" id="modalBack">
<section class="modal">
<div class="modal-head">
<h2 id="modalTitle">More features</h2>
<button class="close" id="closeModal">×</button>
</div>
<div id="modalContent"></div>
</section>
</div>

<input id="photoInput" type="file" accept="image/*" class="hidden">
<input id="cameraInput" type="file" accept="image/*" capture="environment" class="hidden">
<input id="avatarInput" type="file" accept="image/*" class="hidden">

<script>
const $=id=>document.getElementById(id);
const messages=$("messages"),promptBox=$("prompt");
const modalBack=$("modalBack"),modalContent=$("modalContent");
let currentChat=[],chatId=Date.now(),installPrompt=null;

const features=[
["📷","Photos"],["📸","Camera"],["🙂","Avatar"],
["🖼️","Images"],["🎵","Music"],["🧩","Canvas"],
["🔬","Deep Research"],["📖","Guided Learning"],
["📚","Library"],["📒","New notebook"]
];

function getChats(){
try{return JSON.parse(localStorage.getItem("sameerChats")||"[]")}
catch(e){return []}
}
function saveChats(){
let chats=getChats();
let i=chats.findIndex(c=>c.id===chatId);
let item={id:chatId,title:currentChat[0]?.text?.slice(0,55)||"New chat",messages:currentChat};
if(i>=0)chats[i]=item;else if(currentChat.length)chats.unshift(item);
try{localStorage.setItem("sameerChats",JSON.stringify(chats.slice(0,50)))}
catch(e){}
renderHistory();
}
function renderHistory(){
$("historyList").innerHTML="";
getChats().forEach(c=>{
let b=document.createElement("button");
b.className="navbtn";b.textContent=c.title||"New chat";
b.onclick=()=>loadChat(c.id);
$("historyList").appendChild(b);
});
}
function closeDrawer(){$("drawerBack").style.display="none"}
function closeModal(){modalBack.style.display="none"}
function openModal(title,html){
$("modalTitle").textContent=title;
modalContent.innerHTML=html;
modalBack.style.display="flex";
}
function drawMessage(role,text,save=true){
$("welcome").classList.add("hidden");
let el=document.createElement("article");
el.className="message "+(role==="user"?"user":"assistant");
let label=document.createElement("small");
label.textContent=role==="user"?"మీరు":"✦ AI Sameer";
let body=document.createElement("div");body.textContent=text;
el.append(label,body);
if(role!=="user"){
let actions=document.createElement("div");actions.className="message-actions";
let copy=document.createElement("button");copy.textContent="కాపీ";
copy.onclick=()=>navigator.clipboard?.writeText(text);
actions.append(copy);el.append(actions);
}
messages.appendChild(el);
if(save){currentChat.push({role,text});saveChats()}
}
function loadChat(id){
let c=getChats().find(x=>x.id===id);if(!c)return;
chatId=id;currentChat=c.messages||[];messages.innerHTML="";
$("welcome").classList.toggle("hidden",currentChat.length>0);
currentChat.forEach(m=>drawMessage(m.role,m.text,false));
closeDrawer();window.scrollTo(0,0);
}
function openFeatures(){
openModal("＋ మరిన్ని ఫీచర్లు",
'<div class="feature-grid">'+features.map(f=>
`<button class="feature" data-feature-modal="${f[1]}"><b>${f[0]}</b><span>${f[1]}</span></button>`
).join("")+'</div><p class="note">కొన్ని ఫీచర్లకు బాహ్య AI సేవ అవసరం.</p>');
modalContent.querySelectorAll("[data-feature-modal]").forEach(b=>{
b.onclick=()=>runFeature(b.dataset.featureModal);
});
}
function escapeHTML(s){
let d=document.createElement("div");d.textContent=s||"";return d.innerHTML;
}
function runFeature(name){
closeModal();
if(name==="Photos"){$("photoInput").click();return}
if(name==="Camera"){$("cameraInput").click();return}
if(name==="Avatar"){$("avatarInput").click();return}
if(name==="Library"){showLibrary();return}
if(name==="New notebook"){showNotebook();return}
if(name==="Images"){
openModal("🖼️ Images",'<p>మీ చిత్రం ఎలా ఉండాలో వివరించండి.</p><textarea id="featureText" class="field" rows="3" placeholder="చిత్రం వివరణ"></textarea><button class="primary" id="featureGo">వివరణ పంపండి</button><p class="note">చిత్రం రూపొందించడానికి image-generation సేవ కనెక్ట్ చేయాలి.</p>');
$("featureGo").onclick=()=>sendFromField("ఈ వివరణతో AI చిత్రాన్ని రూపొందించడానికి సహాయం చేయండి: ");return;
}
if(name==="Music"){
openModal("🎵 Music",'<p>మీకు కావలసిన సంగీతాన్ని వివరించండి.</p><textarea id="featureText" class="field" rows="3" placeholder="ఉదా: Telugu travel background music"></textarea><button class="primary" id="featureGo">కొనసాగించండి</button><p class="note">ఆడియో రూపొందించడానికి సంగీత సేవ అవసరం.</p>');
$("featureGo").onclick=()=>sendFromField("ఈ సంగీత ఆలోచనకు సహాయం చేయండి: ");return;
}
if(name==="Canvas"){
openModal("🧩 Canvas",'<textarea id="featureText" class="field" rows="8" placeholder="మీ కోడ్ లేదా నోట్స్ రాయండి"></textarea><button class="primary" id="featureGo">నోట్ సేవ్ చేయండి</button>');
$("featureText").value=localStorage.getItem("sameerCanvas")||"";
$("featureGo").onclick=()=>{
try{localStorage.setItem("sameerCanvas",$("featureText").value)}catch(e){}
closeModal();drawMessage("assistant","మీ Canvas నోట్ ఈ బ్రౌజర్‌లో సేవ్ అయింది.");
};return;
}
if(name==="Deep Research"){
openModal("🔬 Deep Research",'<input id="featureText" class="field" placeholder="ఏ అంశంపై పరిశోధన కావాలి?"><button class="primary" id="featureGo">కొనసాగించండి</button><p class="note">తాజా వెబ్ పరిశోధనకు search సేవ అవసరం.</p>');
$("featureGo").onclick=()=>sendFromField("ఈ అంశంపై పరిశోధన ప్రణాళిక తయారు చేయండి: ");return;
}
if(name==="Guided Learning"){
openModal("📖 Guided Learning",'<input id="featureText" class="field" placeholder="ఏ విషయం నేర్చుకోవాలి?"><button class="primary" id="featureGo">పాఠం ప్రారంభించండి</button>');
$("featureGo").onclick=()=>sendFromField("ఈ విషయాన్ని తెలుగు భాషలో దశలవారీగా నేర్పించండి: ");return;
}
}
function sendFromField(prefix){
let v=$("featureText").value.trim();closeModal();
if(v){promptBox.value=prefix+v;sendMessage()}
}
function showLibrary(){
let chats=getChats();
openModal("📚 Library",chats.length?chats.map(c=>
`<div class="result">${escapeHTML(c.title)}<br><button class="secondary" data-load="${c.id}">తెరవండి</button></div>`
).join(""):'<p>ఇంకా సేవ్ చేసిన చాట్‌లు లేవు.</p>');
modalContent.querySelectorAll("[data-load]").forEach(b=>{
b.onclick=()=>{closeModal();loadChat(Number(b.dataset.load))}
});
}
function showNotebook(){
openModal("📒 New notebook",'<input id="nbName" class="field" placeholder="నోట్‌బుక్ పేరు"><textarea id="nbBody" class="field" rows="4" placeholder="మీ నోట్స్"></textarea><button class="primary" id="nbSave">సేవ్ చేయండి</button><div id="nbList"></div>');
function listNotes(){
let notes=[];try{notes=JSON.parse(localStorage.getItem("sameerNotebooks")||"[]")}catch(e){}
$("nbList").innerHTML=notes.map(n=>'<div class="result"><b>'+escapeHTML(n.name)+'</b><p>'+escapeHTML(n.body)+'</p></div>').join("");
}
$("nbSave").onclick=()=>{
let notes=[];try{notes=JSON.parse(localStorage.getItem("sameerNotebooks")||"[]")}catch(e){}
notes.unshift({name:$("nbName").value||"నా నోట్‌బుక్",body:$("nbBody").value});
try{localStorage.setItem("sameerNotebooks",JSON.stringify(notes))}catch(e){}
$("nbName").value="";$("nbBody").value="";listNotes();
};
listNotes();
}
function handleFile(file,kind){
if(!file)return;
drawMessage("assistant",kind+": "+file.name+" ఎంపిక అయింది. చిత్రాన్ని AIతో విశ్లేషించడానికి AI vision API కనెక్షన్ అవసరం.");
}
$("photoInput").onchange=e=>handleFile(e.target.files[0],"ఫోటో");
$("cameraInput").onchange=e=>handleFile(e.target.files[0],"కెమెరా ఫోటో");
$("avatarInput").onchange=e=>handleFile(e.target.files[0],"అవతార్ చిత్రం");

function localReply(text){
let t=text.toLowerCase();
if(/hello|hi\b|నమస్కారం|హాయ్/.test(t))
return "నమస్కారం! 👋 నేను AI Sameer. మీకు ఏ విషయంలో సహాయం చేయాలి?";
if(/youtube|యూట్యూబ్|వీడియో/.test(t))
return "YouTube వీడియో కోసం:\n1. మొదటి 3 సెకన్లలో ఆసక్తి కలిగించండి.\n2. స్పష్టమైన వీడియో విషయం ఎంచుకోండి.\n3. ఆకర్షణీయమైన టైటిల్, థంబ్‌నెయిల్ తయారు చేయండి.\n4. ప్రేక్షకులకు ఉపయోగపడే కంటెంట్ ఇవ్వండి.\n\nగమనిక: నిజమైన AI సమాధానాల కోసం AI APIని సురక్షిత బ్యాకెండ్ ద్వారా కనెక్ట్ చేయాలి.";
if(/english|ఇంగ్లీష్/.test(t))

function sendMessage(){
let text=promptBox.value.trim();if(!text)return;
promptBox.value="";drawMessage("user",text);
let wait=document.createElement("article");
wait.className="message assistant";
wait.textContent="AI Sameer సమాధానం సిద్ధం చేస్తోంది…";
messages.appendChild(wait);
setTimeout(()=>{wait.remove();drawMessage("assistant",localReply(text))},300);
}
$("sendBtn").onclick=sendMessage;
promptBox.addEventListener("keydown",e=>{
if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage()}
});
document.querySelectorAll("[data-prompt]").forEach(b=>{
b.onclick=()=>{promptBox.value=b.dataset.prompt;sendMessage()}
});
