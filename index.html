<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sameer Puzzle - Infinite Levels</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            color: #333333;
            font-family: Arial, sans-serif;
            text-align: center;
            height: 100%;
        }
        .header-title {
            background-color: #0f172a;
            color: #00ffcc;
            padding: 10px;
            font-size: 15px;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #e6f0ff;
            padding: 10px 15px;
            border-bottom: 2px solid #b3d1ff;
        }
        .balance-box {
            font-weight: bold;
            font-size: 16px;
            color: #000;
        }
        .withdraw-btn {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        .info-bar {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background-color: #f8f9fa;
            padding: 8px;
            border-bottom: 1px solid #ddd;
            font-size: 14px;
        }
        .hearts {
            color: #ff3366;
            font-size: 16px;
        }
        canvas {
            display: block;
            margin: 15px auto;
            background-color: #ffffff;
            border: 2px solid #333333;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .popup-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .popup-card {
            background: #ffffff;
            color: #000;
            width: 85%;
            max-width: 340px;
            padding: 20px;
            border-radius: 16px;
            border: 2px solid #ddd;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            text-align: center;
        }
        .money-text {
            color: #28a745;
            font-size: 20px;
            font-weight: bold;
        }
        .btn-double {
            background: #ffc107;
            color: #000;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            margin-top: 12px;
            cursor: pointer;
        }
        .btn-next {
            background: #00bcd4;
            color: #fff;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            margin-top: 8px;
            cursor: pointer;
        }
        #adOverlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000000;
            color: white;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 200;
        }
    </style>
</head>
<body>

    <div class="header-title">SAMEER PUZZLE - FLOW ADVENTURE</div>

    <div class="top-bar">
        <div class="balance-box" id="walletBal">₹0.00</div>
        <button class="withdraw-btn" onclick="alert('KYC Required for Withdrawal!')">Withdraw</button>
    </div>

    <div class="info-bar">
        <div class="hearts">❤️❤️❤️</div>
        <div style="font-weight: bold;" id="levelTitle">Level 1</div>
        <div style="color: #666;" id="lineCount">lines</div>
    </div>

    <canvas id="puzzleCanvas" width="340" height="340"></canvas>

    <!-- స్టేజ్ క్లియర్ పాప్-అప్ (సేఫ్ రివార్డ్: 50 పైసలు లేదా 1 రూపాయి) -->
    <div class="popup-overlay" id="winPopup">
        <div class="popup-card">
            <div style="font-size: 35px;">🏆</div>
            <h3>STAGE CLEARED</h3>
            <p style="color: #666; font-size: 13px;" id="popupLevelText">Level completed successfully!</p>
            
            <div style="background: #f1f3f5; padding: 10px; border-radius: 8px; margin: 15px 0;">
                <div style="font-size: 12px; color: #555;">Earned Reward (Safe)</div>
                <div class="money-text" id="rewardText">+₹1.00</div>
            </div>

            <button class="btn-double" onclick="watchAdToDouble()">WATCH AD TO DOUBLE (+₹2.00)</button>
            <button class="btn-next" onclick="triggerAdBeforeNext()">NEXT STAGE ➔</button>
        </div>
    </div>

    <!-- గేమ్స్ మధ్యలో వచ్చే యాడ్ స్క్రీన్ -->
    <div id="adOverlay">
        <h2>SPONSOR AD</h2>
        <p style="color: #aaa; font-size: 14px;">Advertisement is playing...</p>
        <h1 id="adTimer" style="color: #00ffcc; font-size: 50px;">3</h1>
        <p style="font-size: 12px; color: #666;">Skipping in few seconds</p>
    </div>

    <script>
        const canvas = document.getElementById('puzzleCanvas');
        const ctx = canvas.getContext('2d');

        let currentLevel = 1;
        let currentReward = 1.00;
        let puzzlePaths = [];
        let totalBalance = 0.00;

        // అన్లిమిటెడ్ లెవెల్స్ కోసం ప్రతిసారీ కొత్త లైన్లను ఆటోమేటిక్‌గా జనరేట్ చేసే ఫంక్షన్
        function generateLevelData() {
            puzzlePaths = [];
            let numLines = 4 + (currentLevel % 4); // లెవెల్స్ బట్టి లైన్ల సంఖ్య మారుతుంది

            let possibleDirs = ['LEFT', 'RIGHT', 'DOWN', 'UP'];
            let startPositions = [
                {x: 40, y: 40}, {x: 280, y: 40}, {x: 40, y: 160}, 
                {x: 280, y: 160}, {x: 80, y: 280}, {x: 240, y: 280},
                {x: 140, y: 40}, {x: 40, y: 220}, {x: 220, y: 100}
            ];

            // రాండమ్‌గా డిఫరెంట్ షేప్స్ మరియు లైన్లను సృష్టించడం
            for (let i = 0; i < numLines; i++) {
                let start = startPositions[(currentLevel * 3 + i) % startPositions.length];
                let midX = 60 + ((currentLevel * 45 + i * 30) % 220);
                let midY = 60 + ((currentLevel * 35 + i * 40) % 200);
                let endX = 50 + ((currentLevel * 60 + i * 50) % 240);
                let endY = 50 + ((currentLevel * 50 + i * 25) % 240);

                let dir = possibleDirs[(currentLevel + i) % possibleDirs.length];

                puzzlePaths.push({
                    points: [
                        {x: start.x, y: start.y},
                        {x: midX, y: start.y},
                        {x: midX, y: midY},
                        {x: endX, y: endY}
                    ],
                    dir: dir
                });
            }

            document.getElementById('levelTitle').innerText = "Level " + currentLevel;
            document.getElementById('lineCount').innerText = puzzlePaths.length + " lines";
            document.getElementById('popupLevelText').innerText = "Level " + currentLevel + " unblocked!";
            
            // సేఫ్ రివార్డ్ (50 పైసలు లేదా 1 రూపాయి)
            currentReward = currentLevel % 2 === 0 ? 0.50 : 1.00;
            document.getElementById('rewardText').innerText = "+₹" + currentReward.toFixed(2);
        }

        function drawGame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // గ్రిడ్ డాట్స్
            ctx.fillStyle = '#b0b0b0';
            for (let x = 40; x < canvas.width; x += 40) {
                for (let y = 40; y < canvas.height; y += 40) {
                    ctx.fillRect(x, y, 2.5, 2.5);
                }
            }

            // నల్లటి లైన్లు మరియు బాణాలు గీయడం
            puzzlePaths.forEach((item) => {
                ctx.strokeStyle = '#111111';
                ctx.lineWidth = 4;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                ctx.beginPath();
                item.points.forEach((pt, i) => {
                    if (i === 0) ctx.moveTo(pt.x, pt.y);
                    else ctx.lineTo(pt.x, pt.y);
                });
                ctx.stroke();

                // బాణం ముకులు (Arrowhead)
                let lastPt = item.points[item.points.length - 1];
                ctx.fillStyle = '#111111';
                ctx.beginPath();
                if (item.dir === 'LEFT') {
                    ctx.moveTo(lastPt.x - 8, lastPt.y);
                    ctx.lineTo(lastPt.x + 4, lastPt.y - 5);
                    ctx.lineTo(lastPt.x + 4, lastPt.y + 5);
                } else if (item.dir === 'RIGHT') {
                    ctx.moveTo(lastPt.x + 8, lastPt.y);
                    ctx.lineTo(lastPt.x - 4, lastPt.y - 5);
                    ctx.lineTo(lastPt.x - 4, lastPt.y + 5);
                } else if (item.dir === 'DOWN') {
                    ctx.moveTo(lastPt.x, lastPt.y + 8);
                    ctx.lineTo(lastPt.x - 5, lastPt.y - 4);
                    ctx.lineTo(lastPt.x + 5, lastPt.y - 4);
                } else if (item.dir === 'UP') {
                    ctx.moveTo(lastPt.x, lastPt.y - 8);
                    ctx.lineTo(lastPt.x - 5, lastPt.y + 4);
                    ctx.lineTo(lastPt.x + 5, lastPt.y + 4);
                }
                ctx.fill();
            });
        }

        // టచ్ లేదా క్లిక్ చేసినప్పుడు లైన్ క్లియర్ కావడం
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            puzzlePaths.forEach((item, index) => {
                let lastPt = item.points[item.points.length - 1];
                let dist = Math.hypot(clickX - lastPt.x, clickY - lastPt.y);
                if (dist < 28) {
                    puzzlePaths.splice(index, 1);
                }
            });

            document.getElementById('lineCount').innerText = puzzlePaths.length + " lines";
            drawGame();

            if (puzzlePaths.length === 0) {
                totalBalance += currentReward;
                document.getElementById('walletBal').innerText = "₹" + totalBalance.toFixed(2);
                document.getElementById('winPopup').style.display = 'flex';
            }
        });

        function watchAdToDouble() {
            currentReward = currentReward * 2;
            totalBalance += currentReward;
            document.getElementById('walletBal').innerText = "₹" + totalBalance.toFixed(2);
            document.getElementById('rewardText').innerText = "+₹" + currentReward.toFixed(2) + " (Doubled!)";
            alert("Reward Doubled via Ad!");
        }

        // నెక్స్ట్ స్టేజ్ క్లిక్ చేయగానే గేమ్స్ మధ్యలో యాడ్ రావడం
        function triggerAdBeforeNext() {
            document.getElementById('winPopup').style.display = 'none';
            document.getElementById('adOverlay').style.display = 'flex';

            let timeLeft = 3;
            document.getElementById('adTimer').innerText = timeLeft;

            let adInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('adTimer').innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(adInterval);
                    document.getElementById('adOverlay').style.display = 'none';
                    nextLevelLoad();
                }
            }, 1000);
        }

        function nextLevelLoad() {
            currentLevel++;
            generateLevelData();
            drawGame();
        }

        // గేమ్ స్టార్ట్ చేయడం
        generateLevelData();
        drawGame();
    </script>

</body>
</html>
